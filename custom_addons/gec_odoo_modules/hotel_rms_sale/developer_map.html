*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line2) transparent}

.step-ref{margin-top:6px}

.quote{display:block;margin-top:5px;padding-left:10px;border-left:2px solid var(--red);font-style:italic;color:var(--ink)}
details.proof{margin-top:9px;font-size:12.5px}

.elabel{position:absolute;transform:translate(-50%,-50%);font:500 10.5px var(--mono);background:var(--raised);border:1px solid var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2}
.elabel.lit{opacity:1}
.elabel.show{opacity:1;border-color:var(--line2);color:var(--ink2);font-family:var(--sans);font-weight:600}
.states{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-top:8px}
.state{flex:1 1 150px;max-width:260px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface)}
.state b{display:block;font-size:13.5px}.state code{font-size:11.5px}
.state .by{margin-top:6px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.crud{display:inline-flex;gap:3px}
.crud i{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font:600 10px var(--mono);font-style:normal;background:var(--sunken);color:var(--faint)}
.crud i.y{background:var(--green-soft);color:var(--green)}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.input{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13.5px;color:var(--ink);min-width:230px}
.input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.pill{padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font:500 12.5px var(--sans);color:var(--muted)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:8px}
details.fold>summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(-45deg);transition:transform .12s;flex:none}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>.body{border-top:1px solid var(--line);overflow-x:auto}
details.fold>summary>*{min-width:0;overflow-wrap:anywhere}
.code{font:400 12.5px/1.65 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:8px 0;max-height:62vh;tab-size:4}
.code{scrollbar-width:thin}.code-in{display:block;width:max-content;min-width:100%}
.ln{display:block;white-space:pre;padding:0 14px 0 0}
.ln::before{content:attr(data-n);display:inline-block;width:46px;padding-right:12px;text-align:right;color:var(--faint);user-select:none}
.ln.hl{background:var(--hl);box-shadow:inset 3px 0 0 var(--amber)}
.hljs-keyword,.hljs-built_in,.hljs-literal,.hljs-meta{color:var(--k-kw)}.hljs-string,.hljs-doctag{color:var(--k-str)}
.hljs-number{color:var(--k-num)}.hljs-comment{color:var(--k-com);font-style:italic}
.hljs-title,.hljs-function,.hljs-params .hljs-title{color:var(--k-fn)}.hljs-tag,.hljs-name{color:var(--k-tag)}.hljs-attr,.hljs-attribute{color:var(--k-attr)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,96vw);background:var(--raised);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .2s ease;z-index:20;display:flex;flex-direction:column}
#drawer.open{transform:none}
body.dock #app{padding-right:var(--dw)}
body.dock #drawer{width:var(--dw);box-shadow:none;background:var(--surface)}
#dr-grip{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;display:none;z-index:1;touch-action:none}
#dr-grip::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .12s}
#dr-grip:hover::after,body.sizing #dr-grip::after{opacity:.7}
body.dock #dr-grip{display:block}
body.sizing{user-select:none;cursor:col-resize}body.sizing #drawer{transition:none}
.dr-tool{flex:none;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 12px var(--sans);color:var(--muted);white-space:nowrap}
.dr-tool:hover{color:var(--ink);border-color:var(--line2)}.dr-tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.dr-tool[hidden]{display:none}
.dr-body.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
.dr-body.fill>*{flex:none}
.dr-body.fill>.code{flex:0 1 auto;min-height:0;max-height:none;margin-top:8px}
#drawer.wrap .code-in{width:auto}
#drawer.wrap .ln{white-space:pre-wrap;overflow-wrap:anywhere;padding-left:58px;text-indent:-58px}
#drawer.wrap .ln::before{text-indent:0}
.cur{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);border-radius:5px;color:var(--accent-ink)}
.dr-head{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-head .ttl{font:600 14px var(--mono);overflow-wrap:anywhere;flex:1;min-width:0}
.dr-body{padding:16px 18px 40px;overflow:auto;flex:1}
.dr-body h3{margin-top:20px;font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.dr-body h3:first-child{margin-top:0}
.dr-body ol{margin:4px 0 0;padding-left:20px;color:var(--ink2)}.dr-body ol li{margin:2px 0}
.purpose{font-size:15.5px;line-height:1.55;color:var(--ink)}
#palette{position:fixed;inset:0;z-index:40;background:rgba(20,18,14,.34);display:grid;place-items:start center;padding-top:11vh}
#palette[hidden]{display:none}
.pal{width:min(680px,94vw);background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;padding:15px 18px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:16px;color:var(--ink);outline:0}
.pal-res{max-height:56vh;overflow:auto;padding:6px}
.pal-row{display:flex;gap:10px;align-items:baseline;padding:7px 11px;border-radius:8px;cursor:pointer}
.pal-row.on{background:var(--accent-soft)}
.pal-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pal-row .s{color:var(--muted);font-size:12px;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);margin-top:14px}
.tree{font-size:14px}.tree .crumb{color:var(--muted)}.tree .crumb.ext{color:var(--faint)}
.sep{color:var(--faint);margin:0 5px}
/* purpose, idea, result */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.trio-card{border-top:3px solid var(--c);padding-top:13px}
.trio-card .eyebrow{color:var(--c)}
.trio-card p{margin-top:5px;color:var(--ink);font-size:15px;line-height:1.55}
/* the engine: stages in the order things happen */
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:12px 0 4px}
.rail a{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);font:600 12.5px var(--sans);color:var(--ink2)}
.rail a:hover{border-color:var(--accent);color:var(--accent-ink)}
.rail a i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);font-style:normal;background:var(--accent);color:var(--bg)}
.rail .sep{margin:0 1px;color:var(--faint)}
.stages{margin-top:12px}
.stage{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;position:relative;padding-bottom:12px;scroll-margin-top:72px}
.stage::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line2)}
.stage:last-child::before{display:none}
.stage-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--accent);color:var(--bg);position:relative;z-index:1}
.stage-n.sm{display:inline-grid;width:24px;height:24px;font-size:11.5px;vertical-align:2px;margin-right:6px}
.stage-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stage-main p{color:var(--ink2);margin-top:3px;font-size:14px;max-width:70ch}
.stage-side{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stage-side .chip,.variant .chip{white-space:normal;overflow:visible;line-height:1.35;padding:3px 8px}
/* scenarios */
.sc-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;margin-top:18px;align-items:start}
.given{margin:6px 0 0;display:flex;flex-direction:column;gap:7px}
.given>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px}
.given dt{color:var(--muted)}.given dd{margin:0;color:var(--ink)}
.setv{display:inline-flex;gap:5px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.res{width:100%;border-collapse:collapse;margin-top:6px}
.res td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.res tr:first-child td{border-top:0}
.res td{overflow-wrap:break-word}.res .chip{white-space:normal;overflow:visible;text-align:left}
.res td.num{text-align:right;font:600 14.5px var(--mono);font-variant-numeric:tabular-nums;padding-left:12px}
.res td.txt{text-align:right;padding-left:12px;max-width:62%;color:var(--ink)}
.res tr:last-child td{font-weight:650}.res tr:last-child td.num{font-size:16px;color:var(--accent-ink)}.res tr:last-child td.txt{font-weight:500}
.card.out{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.sstep{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative}
.sstep::before{content:"";position:absolute;left:14px;top:36px;bottom:-6px;width:2px;background:var(--line)}
.sstep:last-child::before{display:none}
.sstep-n{width:30px;height:30px;margin-top:14px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);background:var(--accent-soft);color:var(--accent-ink);position:relative;z-index:1}
.calc{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:8px;padding:7px 11px;border-radius:8px;background:var(--code);border:1px solid var(--line);font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.calc b{color:var(--ink);font-weight:600}.calc+.calc{margin-top:4px}
.variant{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1.3fr);gap:10px;align-items:start;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px;font-size:14px}
.variant .ic{color:var(--faint);margin-top:3px}
.sw{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;border:1px dashed var(--line2);font:500 12.5px var(--sans);color:var(--faint)}
.sw.y{border:1px solid transparent;background:var(--green-soft);color:var(--green)}
a.sw.y:hover{border-color:currentColor}
.sw i{font:600 10.5px var(--mono);font-style:normal;opacity:.8}
/* automation matrix */
.mx{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.mx th{font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:10px 6px 8px;text-align:center;white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--surface);z-index:1}
.mx td{padding:5px 6px;border-top:1px solid var(--line);text-align:center}
.mx button{min-width:34px;height:28px;border-radius:8px;font:600 12.5px var(--mono);background:color-mix(in srgb,var(--accent) calc(var(--h)*1%),var(--accent-soft));color:var(--accent-ink);border:2px solid transparent}
.mx button:hover{border-color:var(--accent)}
.mx button.on{background:var(--accent);color:var(--bg)}
.mx th button{min-width:0;height:auto;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:2px 6px;border-radius:6px}
.mx th button.on{background:var(--accent);color:var(--bg)}
.mx .zero{color:var(--line2)}
.evt{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin:16px 0 4px}
.evt a{display:block;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.evt a:hover{border-color:var(--accent)}
.evt a.on{border-color:var(--accent);background:var(--accent-soft)}
.evt b{display:block;font:650 20px/1.15 var(--sans)}.evt span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
/* diagram box */
.dg{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:10px;overflow:hidden;display:flex;flex-direction:column}
.dg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--raised);font-size:12.5px;color:var(--muted)}
.dg-tools{margin-left:auto;display:inline-flex;gap:5px;align-items:center}
.dg-tools button{height:28px;min-width:28px;padding:0 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font:600 12px var(--sans);color:var(--ink2)}
.dg-tools button:hover{border-color:var(--accent);color:var(--accent-ink)}
.dg-pct{font:500 11.5px var(--mono);min-width:40px;text-align:center}
.dg-info{border-top:1px solid var(--line);padding:11px 14px;background:var(--raised)}
.dg-info[hidden]{display:none}
.dg.full{position:fixed;inset:12px;z-index:26;margin:0;box-shadow:0 0 0 100vmax rgba(20,18,14,.45),var(--shadow)}
.dg.full .mapwrap{max-height:none;flex:1}
.mk{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);font:500 12px var(--sans);color:var(--faint);background:none}
.mk i{width:9px;height:9px;border-radius:3px;background:var(--line2)}
.mk.on{color:var(--ink2);border-color:var(--line2)}
.mk.on.own i{background:var(--accent)}.mk.on.wizard i{background:var(--violet)}.mk.on.extend i{background:var(--teal)}.mk.on.ref i{background:var(--faint)}
.map.pinned .node:not(.lit){opacity:.3}
.node.pin{box-shadow:0 0 0 3px var(--accent)}
/* language control and toast */
.langc{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:50;max-width:min(560px,92vw);padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.noscroll{overflow:hidden}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  #nav{position:static;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand-title,.stamp,.nav-group,.nav-foot,.nav-item .n,.nav-item .seen{display:none}
  .brand{margin-right:8px;flex:none}.brand-name{white-space:nowrap}
  #nav-items,#nav-items>div{display:flex;gap:4px;margin:0!important}.nav-item{white-space:nowrap;padding:6px 9px}
  .searchbox .long{display:none}.searchbox .short{display:inline}
  .step{display:block}.at{white-space:normal;overflow-wrap:anywhere}.tbl .at{white-space:nowrap}
  .kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}.kv .bdg{white-space:normal}
  #bar{padding:10px 16px}#view{padding:6px 16px 70px}
  h1{font-size:25px}.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .arch{grid-template-columns:1fr}.arch .arrow{transform:rotate(90deg);padding:4px}
  .life{display:none}
  .trio,.sc-top{grid-template-columns:minmax(0,1fr)}
  .stage{grid-template-columns:26px minmax(0,1fr);gap:9px}.stage-n{width:26px;height:26px;font-size:11.5px}.stage::before{left:12px;top:26px}
  .stage-body{grid-template-columns:minmax(0,1fr);gap:10px}.stage-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}
  .given>div{grid-template-columns:minmax(0,1fr);gap:0}
  .variant{grid-template-columns:minmax(0,1fr)}.variant .ic{transform:rotate(90deg)}
  .langc .lbl{display:none}.input{min-width:0;width:100%}
  .sstep{grid-template-columns:22px minmax(0,1fr);gap:8px}.sstep-n{width:22px;height:22px;font-size:11px}.sstep::before{left:10px}
}
/* same content rules as the 900px block above: the docked source panel can make the main column that narrow on a wide screen */
#main.tight .searchbox .long{display:none}#main.tight .searchbox .short{display:inline}
#main.tight .step{display:block}#main.tight .at{white-space:normal;overflow-wrap:anywhere}#main.tight .tbl .at{white-space:nowrap}
#main.tight .kv{grid-template-columns:minmax(0,1fr)}#main.tight .kv dt{margin-top:6px}#main.tight .kv .bdg{white-space:normal}
#main.tight #bar{padding:10px 16px}#main.tight #view{padding:6px 16px 70px}
#main.tight h1{font-size:25px}#main.tight .g2,#main.tight .g3{grid-template-columns:minmax(0,1fr)}
#main.tight .arch{grid-template-columns:1fr}#main.tight .arch .arrow{transform:rotate(90deg);padding:4px}
#main.tight .life{display:none}
#main.tight .trio,#main.tight .sc-top{grid-template-columns:minmax(0,1fr)}
#main.tight .stage{grid-template-columns:26px minmax(0,1fr);gap:9px}#main.tight .stage-n{width:26px;height:26px;font-size:11.5px}#main.tight .stage::before{left:12px;top:26px}
#main.tight .stage-body{grid-template-columns:minmax(0,1fr);gap:10px}#main.tight .stage-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}
#main.tight .given>div{grid-template-columns:minmax(0,1fr);gap:0}
#main.tight .variant{grid-template-columns:minmax(0,1fr)}#main.tight .variant .ic{transform:rotate(90deg)}
#main.tight .langc .lbl{display:none}#main.tight .input{min-width:0;width:100%}
#main.tight .sstep{grid-template-columns:22px minmax(0,1fr);gap:8px}#main.tight .sstep-n{width:22px;height:22px;font-size:11px}#main.tight .sstep::before{left:10px}
@media (max-width:1180px) and (min-width:901px){#app{grid-template-columns:208px minmax(0,1fr)}#bar{padding:12px 24px}#view{padding:8px 24px 90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="brand">
      <div class="brand-name" id="b-name"></div>
      <div class="brand-title" id="b-title"></div>
      <a class="stamp" data-go="#/about" id="b-stamp" title="What this map was built from"></a>
    </div>
    <div id="nav-items"></div>
    <div class="nav-foot" id="b-foot"></div>
  </nav>
  <div id="main">
    <header id="bar">
      <button class="searchbox" id="search-btn" type="button"><span id="search-ic"></span><span class="long">Search a method, field, button text, message...</span><span class="short">Search</span><kbd>/</kbd></button>
      <div class="bar-right"><span id="lang"></span><button class="iconbtn" id="theme" type="button" title="Light or dark"></button></div>
    </header>
    <div id="view" tabindex="-1"></div>
  </div>
</div>
<aside id="drawer" aria-hidden="true">
  <div id="dr-grip" title="Drag to resize. Double-click for the default width."></div>
  <div class="dr-head"><span id="dr-kind"></span><span class="ttl" id="dr-title"></span><button class="dr-tool" id="dr-copy" type="button" title="Copy the path and line" hidden>Copy</button><button class="dr-tool" id="dr-wrap" type="button" title="Wrap long lines instead of scrolling sideways">Wrap</button><button class="iconbtn" id="dr-close" type="button" title="Close (Esc)"></button></div>
  <div class="dr-body" id="dr-body"></div>

for sale; a price waiting to be applied keeps its rate.","writes":{"state":["hold"],"published_rate":[],"exported_rate":[]},"env":["hotel.rms.price"],"hash":"f55a4347b522cd0a","calls":[{"to":"models/hotel_rms_property.py::HotelRmsProperty._local_to_utc","name":"_local_to_utc","line":121,"via":"model"},{"to":"models/hotel_rms_property.py::_differs","name":"_differs","line":133,"via":"name"}],"called_by":["models/hotel_rms_property.py::HotelRmsProperty._sync_sources"],"kind":"helper"},{"id":"models/hotel_rms_property.py::HotelRmsProperty._get_apply_domain","model":"hotel.rms.property","cls":"HotelRmsProperty","name":"_get_apply_domain","file":"models/hotel_rms_property.py","line":139,"def_line":139,"end":148,"args":"self","doc":"The prices the apply writes; the calendar's publish count uses the same set.","hash":"b46e64604f5cfa1e","called_by":["models/hotel_rms_property.py::HotelRmsProperty.action_publish_approved","models/hotel_rms_property.py::HotelRmsProperty.get_calendar"],"kind":"helper"},{"id":"models/hotel_rms_property.py::HotelRmsProperty.action_publish_approved","model":"hotel.rms.property","cls":"HotelRmsProperty","name":"action_publish_approved","file":"models/hotel_rms_property.py","line":150,"def_line":150,"end":177,"args":"self","doc":"Apply the approved prices to the pricelist, one fixed-price item per night and room product.","raises":[{"exc":"UserError","text":"Applying prices to the pricelist needs the access right Sales: Administrator or Product: Manager.","line":157,"id":"msg:HotelRmsProperty.action_publish_approved/757611"}],"strings":[{"text":"Applying prices to the pricelist needs the access right Sales: Administrator or Product: Manager.","line":157}],"env":["product.pricelist.item","hotel.rms.price"],"calls_super":true,"hash":"d5fa49580216047a","calls":[{"to":"models/hotel_rms_property.py::HotelRmsProperty._get_apply_domain","name":"_get_apply_domain","line":158,"via":"model"},{"to":"models/hotel_rms_property.py::HotelRmsProperty._local_to_utc llable': True,\n    'auto_install': True,\n}\n"},"i18n/ka_GE.po":{"sha":"d609b9541d87a990","lines":186},"models/__init__.py":{"sha":"973ff168e0eaa575","lines":6,"text":"from . import hotel_rms_import\nfrom . import hotel_rms_price\nfrom . import hotel_rms_property\nfrom . import hotel_rms_room_type\nfrom . import product_pricelist_item\n"},"models/hotel_rms_import.py":{"sha":"47f1334250396736","lines":12,"text":"from odoo import models\nfrom odoo.exceptions import UserError\n\n\nclass HotelRmsImport(models.Model):\n    _inherit = 'hotel.rms.import'\n\n    def action_import(self):\n        if self.kind == 'rates' and self.property_id.pricelist_id:\n            raise UserError(self.env._(\"The current prices of this hotel come from its pricelist. Import reservations only.\"))\n        return super().action_import()\n"},"models/hotel_rms_price.py":{"sha":"0ae3f5e95a2d6ffa","lines":26,"text":"from odoo import fields, models\n\n\nclass HotelRmsPrice(models.Model):\n    _inherit = 'hotel.rms.price'\n\n    not_for_sale = fields.Boolean(readonly=True, copy=False,\n        help=\"The pricelist price of this night is 0: the night is not sold, so it has no recommendation and its price is not applied.\")\n\n    def _calendar_cell(self):\n        cell = super()._calendar_cell()\n        cell['not_for_sale'] = self.not_for_sale\n        return cell\n\n    def get_panel_data(self):\n        data = super().get_panel_data()\n        if self.not_for_sale:\n            data['actions'].update(accept=False, use_my_price=False, reject=False)\n        return data\n\n    def _engine_skip_write(self, today):\n        return self.not_for_sale or super()._engine_skip_write(today)\n\n    def action_use_my_price(self):\n        return super(HotelRmsPrice, self.filtered(lambda p: not p.not_for_sale)).action_use_my_price()\n"},"models/hotel_rms_property.py":{"sha":"b8acf2ab3ac9a8d4","lines":186,"text":"from collections import defaultdict\nfrom datetime import datetime, time, timedelta\nfrom zoneinfo import ZoneInfo\n\nfrom odoo import fields, models\nfrom odoo.exceptions import UserError\nfrom odoo.fields import Domain\nfrom odoo.tools.date_utils import to_timezone\n\nSOURCE_PREFIX = 'sale.order.line,'\nPRICE_READ_TIME = time(12)\nDAY_END = time(23, 59, 59)\n\n\ndef _differs(record, vals):\n    \"\"\"True when a value of vals is not what the record holds; money compares by the currency rounding.\"\"\"\n    for fname, value in vals.items():\n        field = record._fields[fname]\n        current = record[fname]\n        if field.type == 'monetary':\n            different = record.currency_id.compare_amounts(current, value)\n        elif field.type == 'many2one':\n            different = current.id != value\n        else:\n            different = (current or False) != value\n        if different:\n            return True\n    return False\n\n\nclass HotelRmsProperty(models.Model):\n    _inherit = 'hotel.rms.property'\n    _check_company_auto = True\n\n    pricelist_id = fields.Many2one('product.pricelist', string=\"Pricelist\", check_company=True, ondelete='set null',\n        domain=\"[('currency_id', '=', currency_id)]\",\n        help=\"Current prices are read from this pricelist, and approved prices are written back to it as one fixed price per night and room product. \"\n        \"Empty: prices come from a CSV import and are exported to CSV.\")\n\n    def _local_to_utc(self, day, at):\n        \"\"\"Naive UTC datetime of a time of day in the hotel time zone.\"\"\"\n        self.ensure_one()\n        return to_timezone(None)(datetime.combine(day, at, tzinfo=ZoneInfo(self.tz or 'UTC')))\n\n    def _sync_sources(self):\n        super()._sync_sources()\n        for prop in self:\n            room_types = prop.with_context(active_test=False).room_type_ids.filtered('product_tmpl_id')\n            if not room_types:\n                continue\n            today = prop._get_local_today()\n            prop._sync_reservations(today, room_types)\n            if prop.pricelist_id:\n                prop._sync_prices(today, room_types)\n            prop.last_data_at = fields.Datetime.now()\n\n    def _sync_reservations(self, today, room_types):\n        \"\"\"Create, update and cancel the reservations of this hotel from its rental order lines.\"\"\"\n        self.ensure_one()\n        Reservation = self.env['hotel.rms.reservation']\n        by_template = {room.product_tmpl_id.id: room for room in room_types}\n        existing = {res.source_ref: res for res in Reservation.search([\n            ('property_id', '=', self.id),\n            ('source_ref', '=like', SOURCE_PREFIX + '%'),\n        ]) if res.source_ref.removeprefix(SOURCE_PREFIX).isdecimal()}\n        domain = (\n            Domain('is_rental', '=', True)\n            & Domain('product_template_id', 'in', list(by_template))\n            & Domain('company_id', '=', self.company_id.id)\n            & (Domain('state', 'in', ('sale', 'cancel'))\n               | Domain('id', 'in', [int(ref.removeprefix(SOURCE_PREFIX)) for ref in existing]))\n        )\n        # sudo: a Revenue Manager may lack Sales rights and a salesman sees own lines only; company filtered here\n        lines = self.env['sale.order.line'].sudo().search(domain)\n        to_create = []\n        updates = defaultdict(list)\n        for line in lines:\n            order = line.order_id\n            ref = f\"{SOURCE_PREFIX}{line.id}\"\n            res = existing.pop(ref, Reservation)\n            arrival = self._get_local_today(order.rental_start_date)\n            cancelled = order.state != 'sale'\n            cancel_date = False\n            if cancelled and res:\n                cancel_date = res.cancel_date if res.status == 'cancelled' else today\n            vals = {\n                'booking_date': min(self._get_local_today(order.create_date), arrival),\n                'arrival': arrival,\n                'departure': self._get_local_today(order.rental_return_date),\n                'room_type_id': by_template[line.product_template_id.id].id,\n                'rooms': int(line.product_uom_qty),\n                'revenue': line.currency_id._convert(line.price_subtotal, self.currency_id, self.company_id, order.date_order.date()),\n                'status': 'cancelled' if cancelled else 'confirmed',\n                'cancel_date': cancel_date,\n            }\n            if not res:\n                to_create.append(dict(vals, property_id=self.id, source_ref=ref))\n            elif _differs(res, vals):\n                updates[frozenset(vals.items())].append(res.id)\n        for vals, ids in updates.items():\n            Reservation.browse(ids).write(dict(vals))\n        Reservation.create(to_create)\n        Reservation.concat(*existing.values()).filtered(lambda r: r.status != 'cancelled').write({'status': 'cancelled', 'cancel_date': today})\n\n    def _sync_prices(self, today, room_types):\n        \"\"\"A pricelist price of 0 means not for sale; a price waiting to be applied keeps its rate.\"\"\"\n        self.ensure_one()\n        Price = self.env['hotel.rms.price']\n        rooms = room_types.filtered('active')\n        horizon_end = today + timedelta(days=self.horizon_days)\n        prices = {(price.stay_date, price.room_type_id.id): price for price in Price.search([\n            ('property_id', '=', self.id),\n            ('room_type_id', 'in', rooms.ids),\n            ('stay_date', '>=', today),\n            ('stay_date', '\u003c', horizon_end),\n        ])}\n        to_create = []\n        updates = defaultdict(list)\n        for lead in range(self.horizon_days):\n            night = today + timedelta(days=lead)\n            current = self.pricelist_id._get_products_price(rooms.product_tmpl_id, 1.0, date=self._local_to_utc(night, PRICE_READ_TIME))\n            for room in rooms:\n                rate = current[room.product_tmpl_id.id]\n                row = prices.get((night, room.id))\n                if self.currency_id.is_zero(rate):\n                    vals = {'not_for_sale': True, 'recommended_rate': 0, 'raw_target_rate': 0, 'action': False, 'state': 'hold', 'reason_json': False}\n                else:\n                    vals = {'not_for_sale': False}\n                    if not (row and row.to_export):\n                        vals.update({'published_rate': rate, 'exported_rate': rate})\n                if not row:\n                    to_create.append(dict(vals, property_id=self.id, stay_date=night, room_type_id=room.id, state='hold'))\n                elif _differs(row, vals):\n                    updates[frozenset(vals.items())].append(row.id)\n        for vals, ids in updates.items():\n            Price.browse(ids).write(dict(vals))\n        Price.create(to_create)\n\n    def _get_apply_domain(self):\n        \"\"\"The prices the apply writes; the calendar's publish count uses the same set.\"\"\"\n        self.ensure_one()\n        return (\n            Domain('property_id', '=', self.id)\n            & Domain('to_export', '=', True)\n            & Domain('not_for_sale', '=', False)\n            & Domain('room_type_id.product_tmpl_id', '!=', False)\n            & Domain('stay_date', '>=', self._get_local_today())\n        )\n\n    def action_publish_approved(self):\n        \"\"\"Apply the approved prices to the pricelist, one fixed-price item per night and room product.\"\"\"\n        self.ensure_one()\n        if not self.pricelist_id:\n            return super().action_publish_approved()\n        Item = self.env['product.pricelist.item']\n        if not Item.has_access('create'):\n            raise UserError(self.env._(\"Applying prices to the pricelist needs the access right Sales: Administrator or Product: Manager.\"))\n        prices = self.env['hotel.rms.price'].search(self._get_apply_domain(), order='stay_date, room_type_id')\n        items = {item.hotel_rms_price_id.id: item for item in Item.search([('hotel_rms_price_id', 'in', prices.ids)])}\n        to_create = []\n        for price in prices:\n            vals = {\n                'pricelist_id': self.pricelist_id.id,\n                'product_tmpl_id': price.room_type_id.product_tmpl_id.id,\n                'compute_price': 'fixed',\n                'fixed_price': price.published_rate,\n                'min_quantity': 0,\n                'date_start': self._local_to_utc(price.stay_date, time.min),\n                'date_end': self._local_to_utc(price.stay_date, DAY_END),\n            }\n            if price.id in items:\n                items[price.id].write(vals)\n            else:\n                to_create.append(dict(vals, hotel_rms_price_id=price.id))\n        Item.create(to_create)\n        prices._mark_exported('apply')\n        return False\n\n    def get_calendar(self, date_from=None, days=14):\n        \"\"\"With a pricelist, the publish count is what the apply writes.\"\"\"\n        calendar = super().get_calendar(date_from, days)\n        if self.pricelist_id:\n            calendar['to_export_count'] = self.env['hotel.rms.price'].search_count(self._get_apply_domain())\n            calendar['publish'].update(label=self.env._(\"Apply to pricelist\"), done=self.env._(\"%s prices applied to the pricelist\"))\n        return calendar\n"},"models/hotel_rms_room_type.py":{"sha":"0b92f929df55b4bf","lines":13,"text":"from odoo import fields, models\n\n\nclass HotelRmsRoomType(models.Model):\n    _inherit = 'hotel.rms.room.type'\n\n    product_tmpl_id = fields.Many2one('product.template', string=\"Odoo room product\", check_company=True, ondelete='set null',\n        domain=\"[('rent_periodicity', 'in', ('days', 'nights'))]\",\n        help=\"The rental product that sells this room type: its rental order \"\n        \"lines are the reservations and its pricelist price is the current price.\")\n\n    _product_tmpl_unique = models.Constraint('UNIQUE(product_tmpl_id)', \"An Odoo product can be the room product of one room type only.\")\n"},"models/product_pricelist_item.py":{"sha":"b98637499760914b","lines":8,"text":"from odoo import fields, models\n\n\nclass ProductPricelistItem(models.Model):\n    _inherit = 'product.pricelist.item'\n\n    hotel_rms_price_id = fields.Many2one('hotel.rms.price', string=\"Hotel price\", ondelete='set null', copy=False, index='btree_not_null')\n"},"tests/__init__.py":{"sha":"c963ce4560bcd6dc","lines":4},"tests/common.py":{"sha":"74c0e2d9ec665ca3","lines":124},"tests/test_apply.py":{"sha":"71c407e04c43df30","lines":148},"tests/test_prices.py":{"sha":"7cd824529f8bc83d","lines":108},"tests/test_reservations.py":{"sha":"21ebb236f1aeaa7d","lines":213},"views/hotel_rms_sale_views.xml":{"sha":"446e56b68103fcc0","lines":42,"text":"\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n\u003codoo>\n    \u003crecord id=\"hotel_rms_property_view_form\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">hotel.rms.property.form.sale\u003c/field>\n        \u003cfield name=\"model\">hotel.rms.property\u003c/field>\n        \u003cfield name=\"inherit_id\" ref=\"hotel_rms.hotel_rms_property_view_form\"/>\n        \u003cfield name=\"arch\" type=\"xml\">\n            \u003cxpath expr=\"//page[@name='strategy']//field[@name='price_step']\" position=\"after\">\n                \u003cfield name=\"pricelist_id\"/>\n            \u003c/xpath>\n            \u003cxpath expr=\"//page[@name='rooms']//field[@name='code']\" position=\"after\">\n                \u003cfield name=\"product_tmpl_id\" options=\"{'no_create': True}\"/>\n            \u003c/xpath>\n        \u003c/field>\n    \u003c/record>\n\n    \u003crecord id=\"hotel_rms_price_view_form\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">hotel.rms.price.form.sale\u003c/field>\n        \u003cfield name=\"model\">hotel.rms.price\u003c/field>\n        \u003cfield name=\"inherit_id\" ref=\"hotel_rms.hotel_rms_price_view_form\"/>\n        \u003cfield name=\"arch\" type=\"xml\">\n            \u003cxpath expr=\"//widget[@name='rms_price_panel']\" position=\"before\">\n                \u003cfield name=\"   if (lazy && !lazy.innerHTML) lazy.innerHTML = viewBody(IDX.get(d.dataset.view).o);
}, true);
document.addEventListener('keydown', ev => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName), r = route();
  if (!$('#palette').hidden) {
    if (ev.key === 'Escape') palette(false);
    else if (ev.key === 'ArrowDown') { palSel = Math.min(palHits.length - 1, palSel + 1); drawPal(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); drawPal(); ev.preventDefault(); }
    else if (ev.key === 'Enter') pick(palSel);
    return;
  }
  if ((ev.key === '/' && !typing) || (ev.key === 'k' && (ev.metaKey || ev.ctrlKey))) { ev.preventDefault(); return palette(true); }
  if (ev.key === 'Escape') { const full = $('.dg.full');
    if (full) { full.classList.remove('full'); document.body.classList.remove('noscroll'); const el = full.querySelector('.map'); el._z = 0; setZoom(el, fitScale(el)); }
    else if (r.d) location.hash = url(r.sec, r.arg); else if (walk >= 0) setWalk(-1); return; }
  if (typing || r.d || r.sec !== 'flows') return;
  if (['ArrowDown', 'j', 'ArrowRight'].includes(ev.key)) { ev.preventDefault(); setWalk(walk + 1); }
  if (['ArrowUp', 'k', 'ArrowLeft'].includes(ev.key) && walk >= 0) { ev.preventDefault(); setWalk(walk - 1 < 0 ? 0 : walk - 1); }
});
addEventListener('hashchange', () => render());
/* hover card: a preview without leaving the page */
const card = document.body.appendChild(Object.assign(document.createElement('div'), {id: 'hover'}));
let cardTimer = 0;
function cardHtml(id) {
  const e = IDX.get(id); if (!e) return '';
  const o = e.o;
  switch (e.type) {
    case 'scenario': return `<b class="t">${esc(o.title)}</b>${plain(o.case)}<div class="faint" style="margin-top:3px">${o.tests?.length ? 'pinned by a test' : 'from code'} · ${(o.steps || []).length} steps</div>`;
    case 'method': return `<b class="t">${esc(mname(o))}()</b><span class="bdg ${o.kind}">${MKIND[o.kind]}</span> ${plain(purposeOf(o)) || 'No note yet.'}<div class="faint" style="margin-top:4px">${esc(o.file)}:${o.def_line} · ${o.end - o.line + 1} lines</div>`;
    case 'field': return `<b class="t">${esc(o.model)}.${esc(o.name)}</b>${esc(T(o.label || ''))} · ${esc(o.type)}${o.comodel ? ' → ' + esc(o.comodel) : ''}${S.field_notes?.[o.id] ? `<div style="margin-top:3px">${plain(S.field_notes[o.id])}</div>` : ''}`;
    case 'button': return `<b class="t">${esc(T(o.label || '') || o.name)}</b>Button on ${esc(o.model || '')}, calls ${esc(o.name)}()${o.invisible ? `<div class="faint" style="margin-top:3px">Hidden when ${esc(o.invisible)}</div>` : ''}`;
    case 'model': return `<b class="t">${esc(o.model)}</b><span class="bdg ${o.kind}">${KIND[o.kind]}</span> ${plain(O.models?.[o.model] || o.description)}<div class="faint" style="margin-top:4px">${o.fields.length} fields · ${o.methods.length} methods</div>`;
    case 'group': return `<b class="t">${esc(o.full)}</b>${esc(o.xid)}${o.implied ? `<div class="faint" style="margin-top:3px">Includes ${esc(o.implied.map(x => GROUPS[x]?.full || x).join(', '))}</div>` : ''}`;
    case 'msg': return `<b class="t">${esc(o.exc)}</b>“${esc(T(o.text))}”<div class="faint" style="margin-top:3px">raised in ${esc(mname(e.m))}()</div>`;
    case 'menu': return `<b class="t">${esc((o.path || []).map(n => T(n.name || '?')).join(' › '))}</b>Opens ${esc(o.res_model || o.action || '')}`;
    case 'flow': return `<b class="t">${esc(o.title)}</b>${plain(o.summary)}<div class="faint" style="margin-top:3px">${o.steps.length} steps</div>`;
    default: return `<b class="t">${esc(id.replace(/^\w+:/, ''))}</b>${esc(T(o.name || ''))}`;
  }
}
document.addEventListener('mouseover', ev => {
  const c = ev.target.closest?.('.chip[data-open], .chip[data-go], .node[data-open], .node[data-go], .node[data-pick], .quote[data-open]');
  clearTimeout(cardTimer); card.classList.remove('on');
  if (!c || matchMedia('(hover: none)').matches) return;
  const go = c.dataset.go || '';
  const id = c.dataset.open || (go.startsWith('#/data/') ? 'model:' + decodeURIComponent(go.slice(7)) : go.startsWith('#/flows/') ? 'flow:' + decodeURIComponent(go.slice(8))
    : go.startsWith('#/scenarios/') ? 'scenario:' + decodeURIComponent(go.slice(12)) : c.dataset.pick !== undefined ? 'model:' + c.dataset.n : '');
  cardTimer = setTimeout(() => { const html = cardHtml(id); if (!html) return;
    card.innerHTML = html; const r = c.getBoundingClientRect(), h = card.offsetHeight, w = card.offsetWidth;
    card.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px'; card.style.top = (r.bottom + h + 14 > innerHeight ? r.top - h - 8 : r.bottom + 8) + 'px'; card.classList.add('on'); }, 300);
});
addEventListener('scroll', () => { clearTimeout(cardTimer); card.classList.remove('on'); }, true);
/* drag a diagram to pan it */
let pan = null;
document.addEventListener('pointerdown', ev => { const w = ev.target.closest('.mapwrap'); if (!w || ev.target.closest('.node')) return; pan = {w, x: ev.clientX, y: ev.clientY, l: w.scrollLeft, t: w.scrollTop}; w.classList.add('drag'); });
document.addEventListener('pointermove', ev => { if (pan) { pan.w.scrollLeft = pan.l - (ev.clientX - pan.x); pan.w.scrollTop = pan.t - (ev.clientY - pan.y); } });
document.addEventListener('pointerup', () => { pan?.w.classList.remove('drag'); pan = null; });
document.addEventListener('wheel', ev => { const w = ev.target.closest?.('.mapwrap'); if (!w || !(ev.ctrlKey || ev.metaKey)) return; ev.preventDefault();
  const el = w.querySelector('.map'); el._z = (el._cur || 1) * (ev.deltaY < 0 ? 1.100 : .9); setZoom(el, el._z); }, {passive: false});
const toastEl = document.body.appendChild(Object.assign(document.createElement('div'), {id: 'toast'}));
let toastTimer = 0;
const toast = text => { toastEl.textContent = text; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 4200); };
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const box = document.body.appendChild(Object.assign(document.createElement('textarea'), {value: text})); box.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {} box.remove(); return ok;
}
const wrapOn = store.get('wrap', '1') === '1'; $('#drawer').classList.toggle('wrap', wrapOn); $('#dr-wrap').classList.toggle('on', wrapOn);
$('#dr-grip').addEventListener('pointerdown', ev => {
  ev.preventDefault(); const grip = ev.currentTarget; grip.setPointerCapture(ev.pointerId); document.body.classList.add('sizing');
  const move = e => { store.set('dw', Math.round(innerWidth - e.clientX)); dockFit(); };
  const up = () => { document.body.classList.remove('sizing'); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); refit(); };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
});
$('#dr-grip').addEventListener('dblclick', () => { store.set('dw', ''); dockFit(); refit(); });
let sizeTimer = 0;
addEventListener('resize', () => { clearTimeout(sizeTimer); sizeTimer = setTimeout(() => { dockFit(); refit(); }, 80); });
$('#search-btn').onclick = () => palette(true);
$('#theme').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', document.documentElement.dataset.theme); };

/* ---------- start ---------- */
const savedTheme = store.get('theme', ''); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
const repo = F.stamp.repo || {}, dirty = (repo.dirty || []).length;
$('#b-name').textContent = MOD.name; $('#b-title').textContent = MOD.title || '';
$('#b-stamp').innerHTML = `<span class="dot${dirty ? ' dirty' : ''}"></span><b>${esc(repo.branch || 'no git')}</b> @ <b>${esc((repo.head?.sha || '').slice(0, 8))}</b><br>${esc((repo.head?.date || F.stamp.built_at).slice(0, 10))}${dirty ? ` · ${dirty} uncommitted` : ''}`;
$('#b-foot').textContent = `Built ${F.stamp.built_at.slice(0, 16).replace('T', ' ')}`;
$('#search-ic').innerHTML = ic('search', 15); $('#theme').innerHTML = ic('theme', 16); $('#dr-close').innerHTML = ic('x', 16);
if (LANGS.length) {
  const drawLang = () => { $('#lang').innerHTML = `<span class="langc" title="Button, menu, field and message texts can be shown as the user sees them in another language. The explanations stay in English."><span class="lbl">Screen texts</span>
    <span class="seg">${[''].concat(LANGS).map(l => `<button type="button" data-lang="${l}" class="${l === LANG ? 'on' : ''}">${l ? esc(l.split('_')[0].toUpperCase()) : 'EN'}</button>`).join('')}</span></span>`; };
  drawLang();
  $('#lang').onclick = ev => { const b = ev.target.closest('[data-lang]'); if (!b) return; ev.stopPropagation(); LANG = b.dataset.lang; store.set('lang.' + MOD.name, LANG); drawLang(); INDEX = null; render(true);
    let name = LANG; try { name = new Intl.DisplayNames(['en'], {type: 'language'}).of(LANG.split('_')[0]) || LANG; } catch {}
    toast(LANG ? `Buttons, menus, field labels and messages now show in ${name}, as the user reads them (${Object.keys(F.i18n.tr[LANG]).length} translated texts). Explanations stay in English. Best seen on Screens and Rules.` : 'Buttons, menus, field labels and messages show as written in the source code.'); };
}
tightFit();
render();
const load = src => new Promise(done => { const s = document.createElement('script'); s.src = src; s.onload = () => done(true); s.onerror = () => done(false); document.head.appendChild(s); });
load('https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js').then(ok => { if (ok) { drawGraphs($('#view')); drawGraphs($('#dr-body')); } });
load('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js').then(ok => ok && render(true));
})();
</script>
