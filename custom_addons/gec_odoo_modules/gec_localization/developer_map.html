r_property_form_ge_treasury_code\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">res.partner.property.form.ge.treasury.code\u003c/field>\n        \u003cfield name=\"model\">res.partner\u003c/field>\n        \u003cfield name=\"inherit_id\" ref=\"account.view_partner_property_form\"/>\n        \u003cfield name=\"arch\" type=\"xml\">\n            \u003cfield name=\"bank_ids\" position=\"after\">\n                \u003cfield name=\"gec_treasury_code\" invisible=\"parent_id\"/>\n            \u003c/field>\n        \u003c/field>\n    \u003c/record>\n\u003c/odoo>\n"},"wizards/__init__.py":{"sha":"deb7dbcf7f08dde3","lines":3,"text":"from . import cit_wizard\nfrom . import bill_pay_choice\n"},"wizards/bill_pay_choice.py":{"sha":"9a88291237dcc5dd","lines":138,"text":"from odoo import api, fields, models\nfrom odoo.exceptions import UserError\n\n\nclass GecBillPayChoice(models.TransientModel):\n    \"\"\"Ask what to pay on a bill with an open withholding tax: the vendor, the tax, or both.\n    Payments are created by Odoo's own Pay code (account.payment.register); the amounts shown here are display only.\"\"\"\n    _name = 'gec.bill.pay.choice'\n    _description = 'Pay a Bill and its Withholding Tax'\n    _check_company_auto = True\n\n    move_ids = fields.Many2many('account.move', string='Bills', required=True)\n    company_id = fields.Many2one('res.company', compute='_compute_company_id')\n    currency_id = fields.Many2one(related='company_id.currency_id')\n    pay_choice = fields.Selection([('both', 'Vendor and Withholding Tax'), ('vendor', 'Vendor Only'), ('tax', 'Withholding Tax Only')], string='Pay',\n        required=True, compute='_compute_pay_choice', store=True, readonly=False, precompute=True)\n    vendor_line_ids = fields.Many2many('account.move.line', compute='_compute_lines')\n    tax_line_ids = fields.Many2many('account.move.line', compute='_compute_lines')\n    vendor_amount = fields.Monetary(compute='_compute_amounts', currency_field='currency_id')\n    tax_amount = fields.Monetary(compute='_compute_amounts', currency_field='currency_id')\n    can_pay_both = fields.Boolean(compute='_compute_can_pay_both')\n    pay_both_note = fields.Char(compute='_compute_can_pay_both')\n    journal_id = fields.Many2one('account.journal', string='Journal', check_company=True, ondelete='cascade',\n        domain=\"[('type', 'in', ('bank', 'cash')), '|', ('currency_id', '=', False), ('currency_id', '=', currency_id), \"\n        \"('outbound_payment_method_line_ids', '!=', False)]\", compute='_compute_journal_id', store=True, readonly=False, precompute=True)\n    payment_method_line_id = fields.Many2one('account.payment.method.line', string='Payment Method', check_company=True, ondelete='cascade',\n        domain=\"[('journal_id', '=', journal_id), ('payment_type', '=', 'outbound')]\", compute='_compute_payment_method_line_id', store=True,\n        readonly=False, precompute=True)\n    payment_date = fields.Date(required=True, default=fields.Date.context_today)\n\n    @api.depends('move_ids')\n    def _compute_company_id(self):\n        for wizard in self:\n            wizard.company_id = wizard.move_ids[:1].company_id\n\n    @api.depends('can_pay_both', 'vendor_line_ids', 'move_ids.payment_state')\n    def _compute_pay_choice(self):\n        \"\"\"Offer both when possible, else the vendor if it is open and not already being paid, else the tax.\"\"\"\n        for wizard in self:\n            if wizard.can_pay_both:\n                wizard.pay_choice = 'both'\n            elif wizard.vendor_line_ids and 'in_payment' not in wizard.move_ids.mapped('payment_state'):\n                wizard.pay_choice = 'vendor'\n            else:\n                wizard.pay_choice = 'tax'\n\n    @api.depends('move_ids.line_ids.amount_residual', 'move_ids.line_ids.reconciled')\n    def _compute_lines(self):\n        \"\"\"Take the open payable lines and the open withholding tax lines of the bills.\"\"\"\n        for wizard in self:\n            wizard.vendor_line_ids = wizard.move_ids.line_ids.filtered(\n                lambda line: line.account_id.account_type == 'liability_payable' and line._gec_is_open())\n            wizard.tax_line_ids = wizard.move_ids._gec_open_withholding_lines()\n\n    @api.depends('vendor_line_ids', 'tax_line_ids')\n    def _compute_amounts(self):\n        for wizard in self:\n            wizard.vendor_amount = abs(sum(wizard.vendor_line_ids.mapped('amount_residual')))\n            wizard.tax_amount = abs(sum(wizard.tax_line_ids.mapped('amount_residual')))\n\n    @api.depends('move_ids.payment_state', 'move_ids.currency_id', 'move_ids.reconciled_payment_ids',\n        'move_ids.invoice_payment_term_id.early_discount', 'vendor_line_ids', 'tax_line_ids', 'company_id')\n    def _compute_can_pay_both(self):\n        \"\"\"Allow one window to pay both only when Odoo's own Pay amounts cannot be disturbed.\n        Otherwise two steps: partly paid bill, unmatched paid payments, installments, early payment discount,\n        foreign currency, no single State Treasury contact.\"\"\"\n        for wizard in self:\n            company = wizard.company_id\n            note = False\n            if not wizard.vendor_line_ids or not wizard.tax_line_ids:\n                note = self.env._(\"The vendor or the withholding tax is already paid: pay what is left separately.\")\n            elif any(move.payment_state != 'not_paid' for move in wizard.move_ids):\n                note = self.env._(\"The bill is already partly paid: pay the vendor and the tax separately.\")\n            elif any(\n                move.reconciled_payment_ids.filtered(\n                    lambda p: p.state == 'paid' and not p.is_reconciled and not p.is_matched)\n                for move in wizard.move_ids\n            ):\n                note = self.env._(\"The bill has a payment that is not matched yet: pay the vendor and the tax separately.\")\n            elif any(\n                len(move.line_ids.filtered(lambda line: line.display_type == 'payment_term')) > 1\n                or move.invoice_payment_term_id.early_discount\n                for move in wizard.move_ids\n            ):\n                note = self.env._(\"The bill has installments or an early payment discount: pay the vendor and the tax separately.\")\n            elif any(move.currency_id != company.currency_id for move in wizard.move_ids):\n                note = self.env._(\"The bill is not in %(currency)s: pay the vendor and the tax separately.\", currency=company.currency_id.name)\n            elif len(self.env['res.partner']._gec_state_treasury_partners(company)) != 1:\n                note = self.env._(\"No single State Treasury contact with Treasury Code 101001000.\")\n            wizard.can_pay_both = not note\n            wizard.pay_both_note = note\n\n    @api.depends('company_id')\n    def _compute_journal_id(self):\n        \"\"\"Take the first bank or cash journal of the company in its currency that has an outgoing payment method.\"\"\"\n        for wizard in self:\n            company = wizard.company_id\n            wizard.journal_id = self.env['account.journal'].search([*self.env['account.journal']._check_company_domain(company),\n                ('type', 'in', ('bank', 'cash')), ('currency_id', 'in', (False, company.currency_id.id)),\n                ('outbound_payment_method_line_ids', '!=', False)], limit=1)\n\n    @api.depends('journal_id')\n    def _compute_payment_method_line_id(self):\n        \"\"\"Take the first outgoing payment method of the journal, unless the chosen one belongs to it.\"\"\"\n        for wizard in self:\n            lines = wizard.journal_id.outbound_payment_method_line_ids\n            if wizard.payment_method_line_id not in lines:\n                wizard.payment_method_line_id = lines[:1]\n\n    def action_confirm(self):\n        \"\"\"Do the chosen payment: open Odoo's Pay dialog for the vendor or the tax, or pay both now.\"\"\"\n        self.ensure_one()\n        if self.pay_choice == 'vendor':\n            if not self.vendor_line_ids:\n                raise UserError(self.env._(\"Nothing is left to pay to the vendor.\"))\n            return self.move_ids.with_context(gec_pay_choice_done=True).action_force_register_payment()\n        if self.pay_choice == 'tax':\n            return self.tax_line_ids._gec_action_pay_withholding()\n        return self._gec_pay_both()\n\n    def _gec_pay_both(self):\n        \"\"\"Create the vendor payment and the Treasury payment with Odoo's Pay code, in one transaction.\n        Tax lines are netted first; runs use the Pay dialog's own create and _create_payments: no amount computed.\"\"\"\n        if not self.can_pay_both:\n            raise UserError(self.pay_both_note)\n        if not self.payment_method_line_id.payment_account_id:\n            raise UserError(self.env._(\"Payment method %(method)s of %(journal)s has no Outstanding Payments account, so this payment would not \"\n                \"settle the journal entry line. Set one on the journal's Outgoing Payments tab.\", method=self.payment_method_line_id.name,\n                journal=self.journal_id.display_name))\n        tax_lines = self.tax_line_ids._gec_net_withholding_lines()\n        Register = self.env['account.payment.register']\n        vals = {'journal_id': self.journal_id.id, 'payment_method_line_id': self.payment_method_line_id.id, 'payment_date': self.payment_date}\n        Register.with_context(active_model='account.move.line', active_ids=self.vendor_line_ids.ids).create(vals)._create_payments()\n        if tax_lines:\n            Register.with_context(active_model='account.move.line', active_ids=tax_lines.ids,\n                gec_wht_tax_line_payment=True).create({**vals, 'group_payment': True})._create_payments()\n        return {'type': 'ir.actions.act_window_close'}\n"},"wizards/bill_pay_choice_views.xml":{"sha":"1dabdc331bf16a45","lines":42,"text":"\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n\u003codoo>\n\n  \u003crecord id=\"view_gec_bill_pay_choice_form\" model=\"ir.ui.view\">\n    \u003cfield name=\"name\">gec.bill.pay.choice.form\u003c/field>\n    \u003cfield name=\"model\">gec.bill.pay.choice\u003c/field>\n    \u003cfield name=\"arch\" type=\"xml\">\n      \u003cform string=\"Pay\">\n        \u003cfield name=\"move_ids\" invisible=\"1\"/>\n        \u003cfield name=\"company_id\" invisible=\"1\"/>\n        \u003cfield name=\"currency_id\" invisible=\"1\"/>\n        \u003cfield name=\"can_pay_both\" invisible=\"1\"/>\n        \u003cgroup>\n          \u003cfield name=\"pay_choice\" widget=\"radio\"/>\n        \u003c/group>\n        \u003cgroup>\n          \u003cgroup invisible=\"pay_choice != 'both'\">\n            \u003cfield name=\"journal_id\" options=\"{'no_create': True}\" required=\"pay_choice == 'both'\"/>\n            \u003cfield name=\"payment_method_line_id\" options=\"{'no_create': True}\" required=\"pay_choice == 'both'\"/>\n            \u003cfield name=\"payment_date\"/>\n          \u003c/group>\n          \u003cgroup>\n            \u003cfield name=\"vendor_amount\" string=\"Vendor\" invisible=\"pay_choice == 'tax'\"/>\n            \u003cfield name=\"tax_amount\" string=\"State Treasury\" invisible=\"pay_choice == 'vendor'\"/>\n          \u003c/group>\n        \u003c/group>\n        \u003cdiv class=\"alert alert-warning\" role=\"alert\" invisible=\"pay_choice != 'both' or can_pay_both\">\n          \u003cfield name=\"pay_both_note\" nolabel=\"1\"/>\n        \u003c/div>\n        \u003cfooter>\n          \u003cbutton name=\"action_confirm\" type=\"object\" string=\"Create Payments\" class=\"btn-primary\"\n                  invisible=\"pay_choice != 'both'\"/>\n          \u003cbutton name=\"action_confirm\" type=\"object\" string=\"Continue\" class=\"btn-primary\"\n                  invisible=\"pay_choice == 'both'\"/>\n          \u003cbutton string=\"Discard\" class=\"btn-secondary\" special=\"cancel\"/>\n        \u003c/footer>\n      \u003c/form>\n    \u003c/field>\n  \u003c/record>\n\n\u003c/odoo>\n"},"wizards/cit_wizard.py":{"sha":"2d5aa870957f2ea5","lines":148,"text":"from odoo import models, fields, api, _, Command\nfrom odoo.exceptions import UserError\n\n\nclass L10nGeCitWizard(models.TransientModel):\n    \"\"\"Post the profit distribution, its CIT and optional dividend withholding as one entry.\n    Shareholder stays on the distribution and net-payable lines; CIT and withholding go to the State Treasury.\n    Default tax and account are provisional.\"\"\"\n    _name = 'l10n.ge.cit.wizard'\n    _description = 'Georgian CIT / Profit Distribution Wizard'\n    _check_company_auto = True\n\n    company_id = fields.Many2one('res.company', required=True, default=lambda self: self.env.company)\n    journal_id = fields.Many2one('account.journal', required=True, domain=\"[('type', '=', 'general'), ('company_id', '=', company_id)]\")\n    date = fields.Date(required=True, default=fields.Date.context_today)\n    partner_id = fields.Many2one('res.partner', string='Shareholder', required=True)\n    net_amount = fields.Monetary(string='Net Distribution', required=True, currency_field='currency_id')\n    currency_id = fields.Many2one(related='company_id.currency_id')\n\n    distribution_account_id = fields.Many2one('account.account', string='Distribution Account (Dr)', required=True,\n        default=lambda self: self._default_chart_account('ge_account_530110'),\n        domain=\"[('account_type', 'in', ('equity', 'equity_unaffected')), ('company_ids', 'in', company_id)]\",\n        help=\"Debited with the grossed-up distribution. Typically 530110 Retained Earnings.\")\n    cit_account_id = fields.Many2one('account.account', string='CIT Payable Account (Cr)', required=True,\n        default=lambda self: self._default_chart_account('ge_account_331110'), domain=\"[('company_ids', 'in', company_id)]\",\n        help=\"Credited with the CIT. Typically 331110 Corporate Income Taxes.\")\n    cit_tax_id = fields.Many2one('account.tax', string='Corporate Income Tax', required=True, check_company=True,\n        domain=[('amount_type', '=', 'division'), ('type_tax_use', '=', 'none')], default=lambda self: self._default_chart_account('ge_tax_cit_15'),\n        help=\"Its rate grosses up the net distribution: gross = net / (1 - rate).\")\n    payable_account_id = fields.Many2one('account.account', string='Shareholder Payable Account (Cr)', required=True,\n        default=lambda self: self._default_chart_account('ge_account_340120'),\n        domain=\"[('account_type', 'in', ('liability_payable', 'liability_current')), ('company_ids', 'in', company_id)]\",\n        help=\"Credited with the net amount due to the shareholder. Typically 340120 Accrued Dividends Payable.\")\n\n    treasury_partner_id = fields.Many2one('res.partner', string='State Treasury', domain=[('gec_treasury_code', '!=', False)], check_company=True,\n        required=True, default=lambda self: self.env['res.partner']._gec_state_treasury_partners(self.env.company)[:1],\n        help=\"Partner of the CIT and withholding lines: the taxes are paid to it.\")\n\n    apply_dividend_wht = fields.Boolean(string='Withhold Dividend Tax', help=\"For individual or non-resident shareholders, withhold dividend tax \"\n        \"(Art. 134) on top of the CIT. Leave off for resident company shareholders (exempt).\")\n    dividend_wht_tax_id = fields.Many2one('account.tax', string='Dividend Withholding Tax', domain=[('gec_is_withholding', '=', True)],\n        check_company=True, compute='_compute_dividend_wht_tax_id', store=True, readonly=False, precompute=True)\n    dividend_wht_rate = fields.Float(string='Dividend WHT %', compute='_compute_dividend_wht_rate')\n    dividend_wht_account_id = fields.Many2one('account.account', string='Dividend WHT Account (Cr)', domain=\"[('company_ids', 'in', company_id)]\",\n        default=lambda self: self._default_dividend_wht_account(), help=\"Credited with the tax withheld from the dividend. Default 331210: pay it to \"\n        \"the State Treasury by a bank entry booked on this account.\")\n\n    gross_amount = fields.Monetary(compute='_compute_amounts', currency_field='currency_id')\n    cit_amount = fields.Monetary(compute='_compute_amounts', currency_field='currency_id')\n    dividend_wht_amount = fields.Monetary(compute='_compute_amounts', currency_field='currency_id')\n\n    def _default_dividend_wht_account(self):\n        \"\"\"The accountant keeps dividend tax on 331210 and pays the Treasury by a bank entry (2026-11-12), so the line gets no Pay link.\"\"\"\n        return self._default_chart_account('ge_account_331210')\n\n    def _default_chart_account(self, xmlid):\n        \"\"\"Provisional defaults until the accountant confirms them; a company without the Georgian chart gets none.\"\"\"\n        return self.env['account.chart.template'].with_company(self.env.company).ref(xmlid, raise_if_not_found=False)\n\n    @api.depends('company_id')\n    def _compute_dividend_wht_tax_id(self):\n        \"\"\"Propose the dividend withholding tax once, for the company and the date at opening.\n        It does not follow the date, so a tax picked by hand is never replaced.\"\"\"\n        for wizard in self:\n            wizard.dividend_wht_tax_id = wizard._gec_default_dividend_wht_tax()\n\n    def _gec_default_dividend_wht_tax(self):\n        \"\"\"Return the dividend withholding tax proposed here: resident individual, 5%.\n        Provisional: a non-resident shareholder needs the non-resident tax picked by hand.\n        gec_income_tax_report overrides it to follow dated tax replacements by the wizard date.\"\"\"\n        self.ensure_one()\n        return self.env['account.chart.template'].with_company(self.company_id).ref(\n            'ge_tax_p_wht_res_dividends_5', raise_if_not_found=False) or self.env['account.tax']\n\n    @api.depends('dividend_wht_tax_id.amount')\n    def _compute_dividend_wht_rate(self):\n        \"\"\"Take the rate from the tax, so the booked withholding always matches the tax.\"\"\"\n        for wizard in self:\n            wizard.dividend_wht_rate = abs(wizard.dividend_wht_tax_id.amount)\n\n    @api.depends('net_amount', 'apply_dividend_wht', 'dividend_wht_rate', 'cit_tax_id.amount')\n    def _compute_amounts(self):\n        for wizard in self:\n            gross = wizard.net_amount / (1 - wizard.cit_tax_id.amount / 100) if wizard.net_amount else 0.0\n            wizard.gross_amount = gross\n            wizard.cit_amount = gross - wizard.net_amount\n            wizard.dividend_wht_amount = (wizard.net_amount * wizard.dividend_wht_rate / 100.0 if wizard.apply_dividend_wht else 0.0)\n\n    def action_post_cit(self):\n        \"\"\"Post the distribution entry; the CIT and withholding lines get the State Treasury as partner.\n        The distribution line carries the Withholding Tax in Taxes, as a label Form 30 reads.\"\"\"\n        self.ensure_one()\n        currency = self.company_id.currency_id\n        net = currency.round(self.net_amount)\n        if net \u003c= 0:\n            raise UserError(_('Net distribution must be greater than zero.'))\n        if self.apply_dividend_wht and not self.dividend_wht_account_id:\n            raise UserError(_('Select a Dividend WHT account, or turn off dividend withholding.'))\n        if self.apply_dividend_wht and not self.dividend_wht_tax_id:\n            raise UserError(_('Select the Dividend Withholding Tax, or turn off dividend withholding.'))\n\n        gross, cit, wht = self.gross_amount, self.cit_amount, self.dividend_wht_amount\n        shareholder = net - wht\n\n        line_ids = [\n            Command.create({\n                'name': _('Profit distribution (gross)'),\n                'account_id': self.distribution_account_id.id,\n                'partner_id': self.partner_id.id,\n                'tax_ids': [Command.set(self.dividend_wht_tax_id.ids if self.apply_dividend_wht else [])],\n                'debit': gross,\n                'credit': 0.0,\n            }),\n            Command.create({\n                'name': _('CIT payable (%(rate)g%%)', rate=self.cit_tax_id.amount),\n                'account_id': self.cit_account_id.id,\n                'partner_id': self.treasury_partner_id.id,\n                'debit': 0.0,\n                'credit': cit,\n            }),\n            Command.create({\n                'name': _('Net payable to shareholder'),\n                'account_id': self.payable_account_id.id,\n                'partner_id': self.partner_id.id,\n                'debit': 0.0,\n                'credit': shareholder,\n            }),\n        ]\n        if wht:\n            line_ids.append(Command.create({\n                'name': _('Dividend WHT %(rate)s%%', rate=self.dividend_wht_rate),\n                'account_id': self.dividend_wht_account_id.id,\n                'partner_id': self.treasury_partner_id.id,\n                'debit': 0.0,\n                'credit': wht,\n            }))\n\n        move = self.env['account.move'].create({\n            'move_type': 'entry',\n            'journal_id': self.journal_id.id,\n            'date': self.date,\n            'company_id': self.company_id.id,\n            'ref': _('Profit distribution + CIT %(rate)g%% (net %(net)s)', rate=self.cit_tax_id.amount, net=net),\n            'line_ids': line_ids,\n        })\n        move.action_post()\n        return {'type': 'ir.actions.act_window', 'res_model': 'account.move', 'res_id': move.id, 'view_mode': 'form', 'target': 'current'}\n"}},"switches":[{"field":"field:account.tax.gec_is_withholding","model":"account.tax","name":"gec_is_withholding","type":"Boolean","label":"Withholding Tax (GE)","values":[["True","on"],["False","off"]],"readers":["models/account_move_line.py::AccountMoveLine._gec_withholding_tax_lines","models/account_move_line.py::AccountMoveLine._gec_net_withholding_lines","models/account_move_line.py::AccountMoveLine._affect_tax_report","models/account_tax.py::AccountTax._check_gec_is_withholding","models/account_tax.py::AccountTax._add_tax_details_in_base_line","models/account_tax.py::AccountTax._ge_partner_product_taxes"]},{"field":"field:res.partner.gec_vat_payer","model":"res.partner","name":"gec_vat_payer","type":"Boolean","label":"VAT Payer","values":[["True","on"],["False","off"]],"readers":["models/account_tax.py::AccountTax._ge_partner_product_taxes","models/res_partner.py::ResPartner._commercial_fields"]},{"field":"field:l10n.ge.cit.wizard.apply_dividend_wht","model":"l10n.ge.cit.wizard","name":"apply_dividend_wht","type":"Boolean","label":"Withhold Dividend Tax","values":[["True","on"],["False","off"]],"readers":["wizards/cit_wizard.py::L10nGeCitWizard._compute_amounts","wizards/cit_wizard.py::L10nGeCitWizard.action_post_cit"],"views":["view:gec_localization.view_l10n_ge_cit_wizard_form"],"wizard":true},{"field":"field:product.template.not_taxed","model":"product.template","name":"not_taxed","type":"Boolean","label":"Not Taxed","values":[["True","on"],["False","off"]],"readers":["models/account_tax.py::AccountTax._ge_partner_product_taxes"]}],"readme":[{"line":1,"title":"Georgia - Accounting Extensions (`gec_localization`)","level":1},{"line":13,"title":"1. What it does","level":2},{"line":39,"title":"2. Quick facts","level":2},{"line":53,"title":"3. How it works","level":2},{"line":76,"title":"4. Set it up (once)","level":2},{"line":98,"title":"5. Accounts this module adds","level":2},{"line":122,"title":"6. Payroll account settings","level":2},{"line":146,"title":"7. Taxes this module adds","level":2},{"line":154,"title":"VAT and scope","level":3},{"line":172,"title":"Turnover and profit tax","level":3},{"line":184,"title":"Withholding (taken at payment)","level":3},{"line":229,"title":"8. Withholding at payment","level":2},{"line":258,"title":"9. Default taxes per contact and Not Taxed products","level":2},{"line":303,"title":"10. Profit Distribution (CIT)","level":2},{"line":338,"title":"11. Bank name and BIC from a Georgian IBAN","level":2},{"li 0% = -200.00","1 000.00 + 180.00 + -200.00 = 980.00"],"proof":["addons/l10n_ge/data/template/account.tax-ge.csv:82 | \"ge_vat_purchase_18\",\"18%\",\"purchase\",\"18\"","data/template/account.tax-ge.csv:112 | \"ge_tax_p_wht_res_services_20\",\"WHT 20% - Resident Individual Services (unregistered)\""]}],"result":[{"label":"Line taxes","value":"18% VAT and WHT 20%"},{"label":"VAT","value":"180.00"},{"label":"Withholding","value":"-200.00"},{"label":"Bill total","value":"980.00"}],"lesson":"VAT Payer decides add or replace for a withholding default. Only a withholding default is added; any other default replaces the VAT.","tests":[],"variants":[{"when":"The default is not a withholding tax, for example VAT exempt","then":"It replaces the product's VAT. The fiscal position maps it first.","proof":["models/account_tax.py:59 | return fiscal_position.map_tax(partner_tax)"]},{"when":"The vendor is not a VAT payer","then":"The withholding replaces the product's VAT.","scenario":"non_vat_vendor_withholding"}],"flows":["default_taxes"],"level":"checked"},{"key":"not_taxed_product","group":"Taxes on order and invoice lines","title":"Not Taxed product: no tax proposed, whatever the contact's default","case":"A deposit or penalty product has Not Taxed ticked. The customer has a Default Sales Tax. The line still gets no tax.","given":[{"label":"Company","value":"Georgian chart, fiscal country GE"},{"label":"Product","value":"Deposit, Not Taxed ticked","ref":"field:product.template.not_taxed"},{"label":"Contact","value":"customer with an active Default Sales Tax","ref":"field:res.partner.property_sale_tax_id"},{"label":"Document","value":"sales order line or invoice line for 500.00"}],"sets":{"field:product.template.not_taxed":true},"steps":[{"title":"A product line asks for its taxes","ref":"models/account_tax.py::AccountTax._ge_partner_product_taxes","text":"The sale, purchase and invoice lines all call `AccountTax._ge_partner_product_taxes` with the taxes core proposed.","proof":["models/sale_order_line.py:13 | line.tax_ids = AccountTax._ge_partner_product_taxes(line.tax_ids, order.partner_id, line.product_id, line.company_id, 'sale',","models/account_move_line.py:128 | return AccountTax._ge_partner_product_taxes(taxes or AccountTax, move.partner_id, self.product_id, move.company_id, type_tax_use,"]},{"title":"The company is Georgian, so the rule applies","ref":"models/account_tax.py::AccountTax._ge_partner_product_taxes","text":"The root company's fiscal country is GE. Any other country gets the core taxes back before the product is looked at.","proof":["models/account_tax.py:45 | if not company._gec_is_georgian():"]},{"title":"Not Taxed is checked first","ref":"models/account_tax.py::AccountTax._ge_partner_product_taxes","text":"The method returns an empty tax set. It never reads the contact, so the default sales tax is not used.","proof":["models/account_tax.py:47 | if product.not_taxed:","models/account_tax.py:48 | return self.env['account.tax']"]},{"title":"The form hides the tax fields of the product","text":"The product form hides the tax fields while Not Taxed is ticked. A user can still add a tax by hand on the line.","proof":["views/product_views.xml:13 | \u003cattribute name=\"invisible\">type == 'combo' or not_taxed\u003c/attribute>","models/product_template.py:8 | help=\"No tax is proposed for this product on orders, invoices and bills. A tax can still be added by hand on the line.\")"]}],"result":[{"label":"Line amount","value":"500.00"},{"label":"Taxes on the line","value":"none","note":"the contact's default is ignored"}],"lesson":"The Not Taxed check sits before any contact lookup. Move it below and the contact's default tax lands on deposits and penalties.","tests":[],"variants":[{"when":"Not Taxed is off and the contact has an active default","then":"The default replaces the product's taxes.","scenario":"branch_uses_parent_default"},{"when":"The company is not Georgian","then":"The rule is skipped and core's taxes stay." hholding"},{"label":"Treasury","value":"exactly one contact with Treasury Code 101001000"},{"label":"Journal","value":"bank journal whose outgoing method has an Outstanding Payments account"}],"sets":{"field:account.tax.gec_is_withholding":true},"steps":[{"title":"The bill books two credits","text":"The vendor is owed the price less the tax. The 5% tax is a separate credit line owed to the Treasury.","calc":["1 000.00 × 5% = 50.00","1 000.00 − 50.00 = 950.00"],"proof":["tests/test_review_fixes.py:143 | 'amount': -5,","tests/test_review_fixes.py:213 | self.assertEqual(self._wht_wizard(tax_line).amount, 50)"]},{"title":"Pay opens the choice wizard instead of core's dialog","ref":"models/account_move.py::AccountMove.action_force_register_payment","text":"The bill has an open withholding line, so `gec.bill.pay.choice` opens for the bill.","proof":["models/account_move.py:43 | or not self._gec_open_withholding_lines()","models/account_move.py:49 | 'res_model': 'gec.bill.pay.choice',"]},{"title":"Both is offered because no check fails","ref":"wizards/bill_pay_choice.py::GecBillPayChoice._compute_can_pay_both","text":"The bill is not paid, has one term, no discount and is in GEL. One Treasury contact exists. So `pay_choice` starts as Both.","proof":["wizards/bill_pay_choice.py:72 | elif any(move.payment_state != 'not_paid' for move in wizard.move_ids):","wizards/bill_pay_choice.py:88 | elif len(self.env['res.partner']._gec_state_treasury_partners(company)) != 1:","wizards/bill_pay_choice.py:40 | if wizard.can_pay_both:"]},{"title":"The vendor payment is created first","ref":"wizards/bill_pay_choice.py::GecBillPayChoice._gec_pay_both","text":"Odoo's Pay code pays the open payable line. The wizard computes no amount itself.","calc":"1 000.00 − 50.00 = 950.00","proof":["wizards/bill_pay_choice.py:129 | Register.with_context(active_model='account.move.line', active_ids=self.vendor_line_ids.ids).create(vals)._create_payments()"]},{"title":"The tax payment goes to the State Treasury","ref":"wizards/bill_pay_choice.py::GecBillPayChoice._gec_pay_both","text":"The tax line is netted first. Then Pay runs with `gec_wht_tax_line_payment`, so the payee is the Treasury and the payment is grouped.","calc":"1 000.00 × 5% = 50.00","proof":["wizards/bill_pay_choice.py:123 | tax_lines = self.tax_line_ids._gec_net_withholding_lines()","wizards/bill_pay_choice.py:132 | gec_wht_tax_line_payment=True).create({**vals, 'group_payment': True})._create_payments()"]}],"result":[{"label":"Payment to the vendor","value":"950.00"},{"label":"Payment to the State Treasury","value":"50.00"},{"label":"Bill","value":"both credit lines are settled; the wizard closes","ref":"model:gec.bill.pay.choice"}],"lesson":"Both is only a shortcut for two normal Pay runs. Every case that could change an amount is sent to two separate steps.","tests":[],"variants":[{"when":"The bill has an early payment discount","then":"Both is not offered; pay the vendor first.","scenario":"early_discount_blocks_tax_payment"},{"when":"The bill is in USD or already partly paid","then":"Both is not offered; the wizard shows the reason and Vendor or Tax is chosen.","proof":["wizards/bill_pay_choice.py:73 | note = self.env._(\"The bill is already partly paid: pay the vendor and the tax separately.\")","wizards/bill_pay_choice.py:87 | note = self.env._(\"The bill is not in %(currency)s: pay the vendor and the tax separately.\", currency=company.currency_id.name)"]}],"flows":["bill_pay_choice","withholding_payment"],"level":"checked"},{"key":"credit_note_offsets_withholding","group":"Paying bills with withholding","title":"Withholding left by a credit note reduces the next Treasury payment","case":"A vendor credit note leaves withholding open because the Treasury already holds the tax. The next withholding payment, even for another vendor, is reduced by it.","given":[{"label":"Tax","value":"withholding 5%, one withholding account","ref":"field:account.tax.gec_is_withholding"},{"label":"Bill A","value":" ister.py::AccountPaymentRegister._create_payments","text":"The module forces a grouped wizard for a tax payment, so both lines are paid by one payment.","proof":["models/account_payment_register.py:111 | if tax_payment and not self.group_payment:","models/account_payment_register.py:112 | self.group_payment = True"]}],"result":[{"label":"Payments","value":"1"},{"label":"Payment currency","value":"GEL, the company currency"},{"label":"Payment amount","value":"225.00","note":"the booked tax of both bills"},{"label":"Tax lines","value":"both reconciled"}],"lesson":"A withholding tax is a GEL debt to the Treasury. Do not let core convert it again at the payment date.","tests":["tests/test_review_fixes.py:225 | self.assertEqual(len(payments), 1)","tests/test_review_fixes.py:226 | self.assertEqual(payments.currency_id, self.env.company.currency_id)","tests/test_review_fixes.py:227 | self.assertEqual(payments.amount, 225.0)","tests/test_review_fixes.py:228 | self.assertTrue(all(tax_lines.mapped('reconciled')))"],"variants":[{"when":"The bill is in USD and the user chooses Both","then":"Both is not offered. The wizard shows a reason and the user picks Vendor or Tax.","scenario":"pay_vendor_and_tax_together"}],"flows":["withholding_payment","bill_pay_choice"],"level":"checked"},{"key":"early_discount_blocks_tax_payment","group":"Paying bills with withholding","title":"Withholding tax refused before the early payment discount date","case":"A bill with a 5% withholding tax also has an early payment discount. Paying the Treasury inside the discount period is refused.","given":[{"label":"Bill","value":"one line 1 000.00, withholding 5%, posted","ref":"field:account.tax.gec_is_withholding"},{"label":"Payment term","value":"due in 30 days, 10% discount if paid within 10 days"},{"label":"Payment date","value":"today, inside the discount period"},{"label":"Action","value":"pay the withholding tax line to the State Treasury"}],"sets":{"field:account.tax.gec_is_withholding":true},"ste function splitHl(html) {
  const out = []; let open = [], cur = '';
  html.split(/(<span[^>]*>|<\/span>|\n)/).forEach(tok => {
    if (tok === '\n') { out.push(cur + '</span>'.repeat(open.length)); cur = open.join(''); }
    else if (tok.startsWith('<span')) { open.push(tok); cur += tok; }

}

document.addEventListener('keydown', ev => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName), r = route();
  if (!$('#palette').hidden) {
