se goods or the expenditure incurred on them\",\"საქონლის უსასყიდლოდ მიწოდება, თუ დღგ სრულად ან ნაწილობრივ შედის ამ საქონლის ღირებულებაში ან მასზე გაწეულ ხარჯებში\",\"18% Free of Charge Goods\",\"18% უსასყიდლო საქონელი\",\"S\"\n\"ge_vat_sale_18_foc_s\",\"18% Free Services\",\"18% უსასყიდლო მომსახურება\",\"Providing services free of charge for the personal benefit of the hired person or for a purpose other than the purpose of his/ her own work\",\"მომსახურების უსასყიდლოდ გაწევა დაქირავებული პირის პირადი სარგებლისთვის ან მისი სამუშაოს მიზნისგან განსხვავებული მიზნით\",\"18% Free of Charge Services\",\"18% უსასყიდლო მომსახურება\",\"S\"\n\"ge_vat_sale_18_building\",\"18% Use of Own Building\",\"18% საკუთარი შენობის გამოყენება\",\"Using a self-produced building/structure as a fixed asset, if the right to deduct would be fully or partially restricted in the event of purchase from another person\",\"საკუთარი წარმოების შენობა-ნაგებობის ძირითად საშუალებად გამოყენება, თუ სხვა პირისგან შეძენის შემთხვევაში ჩათვლის უფლება სრულად ან ნაწილობრივ შეიზღუდებოდა\",\"18% Use of Building\",\"18% შენობის გამოყენება\",\"S\"\n\"ge_vat_sale_18_repairs\",\"18% Building Repairs\",\"18% შენობის რემონტი\",\"Carrying out repairs of own fixed assets (buildings/structures), where the right to input VAT deduction would be fully or partially restricted if such services were acquired from a third party\",\"საკუთარი ძირითადი საშუალებების (შენობა-ნაგებობების) რემონტი, თუ ასეთი მომსახურების მესამე პირისგან შეძენის შემთხვევაში დღგ-ის ჩათვლის უფლება სრულად ან ნაწილობრივ შეიზღუდებოდა\",\"18% Repairs of Own Fixed Assets\",\"18% საკუთარი ძირითადი საშუალებების რემონტი\",\"S\"\n\"ge_vat_sale_18_barter\",\"18% Barter Sale\",\"18% ბარტერული გაყიდვა\",\"Barter VAT on sales\",\"დღგ ბარტერულ გაყიდვაზე\",\"18% Barter\",\"18% ბარტერი\",\"S\"\n\"ge_vat_sale_18_other\",\"18% Other Transactions\",\"18% სხვა ოპერაციები\",\"Other transactions taxable at a rate of 18% in accordance with Articles 160 and 160¹ of the Civil Code\",\"სხვა ოპერაციები, რომლებიც 18%-იანი განაკვეთით იბეგრება სამოქალაქო კოდექსის 160-ე და 160¹ მუხლების შესაბამისად\",\"18%\",\"18%\",\"S\"\n\"ge_vat_sale_exempt_foreign\",\"0% Diplomatic Missions\",\"0% დიპლომატიური მისიები\",\"The value of goods/services supplied to foreign diplomatic missions and their members\",\"უცხო ქვეყნის დიპლომატიური წარმომადგენლობებისა და მათი წევრებისთვის მიწოდებული საქონლის/მომსახურების ღირებულება\",\"Exempt\",\"გათავისუფლებული\",\"Z\"\n\"ge_vat_sale_exempt_gas\",\"0% Natural Gas\",\"0% ბუნებრივი აირი\",\"The cost of natural gas supplied to thermal power plants\",\"თბოელექტროსადგურებისთვის მიწოდებული ბუნებრივი აირის ღირებულება\",\"Exempt\",\"გათავისუფლებული\",\"Z\"\n\"ge_vat_sale_exempt_transport\",\"0% International Transport\",\"0% საერთაშორისო გადაზიდვა\",\"The value of goods supplied and/or services rendered, including the value of international transportation/transfer and services directly related thereto\",\"მიწოდებული საქონლის და/ან გაწეული მომსახურების ღირებულება, მათ შორის საერთაშორისო გადაზიდვის/ტრანსპორტირებისა და მასთან უშუალოდ დაკავშირებული მომსახურების ღირებულება\",\"Exempt\",\"გათავისუფლებული\",\"Z\"\n\"ge_vat_sale_exempt_project\",\"0% International Projects\",\"0% საერთაშორისო პროექტები\",\"The value of goods/services supplied within the framework of projects provided for by individual international agreements\",\"ცალკეული საერთაშორისო ხელშეკრულებებით გათვალისწინებული პროექტების ფარგლებში მიწოდებული საქონლის/მომსახურების ღირებულება\",\"Exempt\",\"გათავისუფლებული\",\"Z\"\n\"ge_vat_sale_exempt_ta\",\"0% Inventory\",\"0% ინვენტარიზაცია\",\"Other transactions exempt from VAT on goods, identified as a result of inventory by the tax authority\",\"საგადასახადო ორგანოს მიერ ინვენტარიზაციის შედეგად გამოვლენილ საქონელზე დღგ-ისგან გათავისუფლებული სხვა ოპერაციები\",\"Exempt\",\"გათავისუფლებული\",\"Z\"\n\"ge_vat_sale_0_ex\",\"0% Export\",\"0% ექსპორტი\",\"Goods exported outside Georgia\",\"საქართველოს ფარგლებს გარეთ ექსპორტირებული საქონელი\",\"0% Export\",\"0% ექსპორტი\",\"G\"\n\"ge_vat_sale_exempt_financial\",\"0% Financial Services\",\"0% ფინანსური მომსახურება\",\"Supply of financial operations/financial services\",\"ფინანსური ოპერაციების/ფინანსური მომსახურების მიწოდება\",\"Exempt\",\"გათავისუფლებული\",\"E\"\n\"ge_vat_sale_exempt_land\",\"0% Land Plot\",\"0% მიწის ნაკვეთი\",\"Supply of immovable property (land plot)\",\"უძრავი ქონების (მიწის ნაკვეთის) მიწოდება\",\"Exempt\",\"გათავისუფლებული\",\"E\"\n\"ge_vat_sale_exempt_other\",\"0% Other Exempt\",\"0% სხვა გათავისუფლებული\",\"Other operations exempt without the right of deduction\",\"ჩათვლის უფლების გარეშე გათავისუფლებული სხვა ოპერაციები\",\"Exempt\",\"გათავისუფლებული\",\"E\"\n\"ge_vat_purchase_18\",\"18%\",\"18%\",\"Standard local purchases\",\"სტანდარტული ადგილობრივი შესყიდვები\",\"18%\",\"18%\",\"S\"\n\"ge_vat_purchase_18_fixed_assets\",\"18% Cessation of Activity\",\"18% საქმიანობის შეწყვეტა\",\"Retaining fixed assets in one's own possession after the cessation of economic activity or cancellation of VAT payer registration\",\"ეკონომიკური საქმიანობის შეწყვეტის ან დღგ-ის გადამხდელად რეგისტრაციის გაუქმების შემდეგ ძირითადი საშუალებების საკუთრებაში დატოვება\",\"18%\",\"18%\",\"S\"\n\"ge_vat_purchase_18_building\",\"18% Own Building\",\"18% საკუთარი შენობა\",\"VAT in case of using a self-produced building/structure as a fixed asset\",\"დღგ საკუთარი წარმოების შენობა-ნაგებობის ძირითად საშუალებად გამოყენების შემთხვევაში\",\"18%\",\"18%\",\"S\"\n\"ge_vat_purchase_18_repairs\",\"18% Own Repairs\",\"18% საკუთარი რემონტი\",\"VAT in case of repairs of one's own fixed asset (building/structure) carried out by one's own means\",\"დღგ საკუთარი ძირითადი საშუალების (შენობა-ნაგებობის) საკუთარი ძალებით რემონტის შემთხვევაში\",\"18%\",\"18%\",\"S\"\n\"ge_vat_purchase_18_barter\",\"18% Barter Purchase\",\"18% ბარტერული შესყიდვა\",\"Barter VAT purchase\",\"დღგ ბარტერულ შესყიდვაზე\",\"18%\",\"18%\",\"S\"\n\"ge_vat_purchase_18_auction\",\"18% Auction\",\"18% აუქციონი\",\"Auction/enforcement purchase\",\"აუქციონით/იძულებითი აღსრულებით შესყიდვა\",\"18%\",\"18%\",\"S\"\n\"ge_import_duty_18\",\"18% Import\",\"18% იმპორტი\",\"Goods imported in Georgia\",\"საქართველოში იმპორტირებული საქონელი\",\"18% Import\",\"18% იმპორტი\",\"\"\n\"ge_import_duty_18_base\",\"18% Import Base\",\"18% იმპორტის ბაზა\",\"Goods imported in Georgia\",\"საქართველოში იმპორტირებული საქონელი\",\"18% Import - Base\",\"18% იმპორტი - ბაზა\",\"\"\n\"ge_import_duty_12\",\"12% Import\",\"12% იმპორტი\",\"Goods imported in Georgia\",\"საქართველოში იმპორტირებული საქონელი\",\"12% Import\",\"12% იმპორტი\",\"\"\n\"ge_import_duty_12_base\",\"12% Import Base\",\"12% იმპორტის ბაზა\",\"Goods imported in Georgia\",\"საქართველოში იმპორტირებული საქონელი\",\"12% Import - Base\",\"12% იმპორტი - ბაზა\",\"\"\n\"ge_import_duty_5\",\"5% Import\",\"5% იმპორტი\",\"Goods imported in Georgia\",\"საქართველოში იმპორტირებული საქონელი\",\"5% Import\",\"5% იმპორტი\",\"\"\n\"ge_import_duty_5_base\",\"5% Import Base\",\"5% იმპორტის ბაზა\",\"Goods imported in Georgia\",\"საქართველოში იმპორტირებული საქონელი\",\"5% Import - Base\",\"5% იმპორტი - ბაზა\",\"\"\n\"ge_import_duty_0_base\",\"0% Import Base\",\"0% იმპორტის ბაზა\",\"Goods imported in Georgia\",\"საქართველოში იმპორტირებული საქონელი\",\"0% Import - Base\",\"0% იმპორტი - ბაზა\",\"\"\n\"ge_rcvat_18_ser\",\"18% Reverse Charge Services\",\"18% მომსახურების უკუდაბეგვრა\",\"Services subject to reverse charge provisions\",\"უკუდაბეგვრას დაქვემდებარებული მომსახურება\",\"18% Reverse Charge Service\",\"18% უკუდაბეგვრა - მომსახურება\",\"\"\n\"ge_rcvat_18_goods_customs\",\"18% Customs Warehouse\",\"18% საბაჟო საწყობი\",\"Foreign goods purchased from a person in a customs warehouse\",\"საბაჟო საწყობში მყოფი პირისგან შეძენილი უცხოური საქონელი\",\"18% Reverse Charge Goods\",\"18% უკუდაბეგვრა - საქონელი\",\"\"\n\"ge_rcvat_18_goods_fiz\",\"18% Free Industrial Zone\",\"18% თავისუფალი ზონა\",\"Foreign goods purchased from a FIZ enterprise and placed under the customs procedure\",\"თავისუფალი ინდუსტრიული ზონის საწარმოსგან შეძენილი და საბაჟო პროცედურაში მოქცეული უცხოური საქონელი\",\"18% Reverse Charge Goods\",\"18% უკუდაბეგვრა - საქონელი\",\"\"\n\"ge_vat_sale_18_loss_g\",\"18% Loss of Goods\",\"18% საქონლის დანაკლისი\",\"\",\"საქონლის დანაკლისი\",\"\",\"საქონლის დანაკლისი\",\"S\"\n\"ge_vat_sale_18_retention\",\"18% Retention of Goods\",\"18% საქონლის საკუთრებაში დატოვება\",\"\",\"\",\"\",\"18% საქონლის დატოვება\",\"S\"\n"},"data/wht_sequence.xml":{"sha":"1a7161d7363769f9","lines":15,"text":"\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n\u003c!-- Template for WHT certificate numbering: _ge_gec_apply_maintenance copies it per company\n     and points that company's WHT taxes to it (withholding_sequence_id). -->\n\u003codoo>\n  \u003cdata noupdate=\"1\">\n    \u003crecord id=\"seq_ge_wht\" model=\"ir.sequence\">\n      \u003cfield name=\"name\">Georgian Withholding Tax Certificate\u003c/field>\n      \u003cfield name=\"code\">l10n.ge.wht.certificate\u003c/field>\n      \u003cfield name=\"prefix\">WHT/%(year)s/\u003c/field>\n      \u003cfield name=\"padding\">5\u003c/field>\n      \u003cfield name=\"company_id\" eval=\"False\"/>\n    \u003c/record>\n  \u003c/data>\n\u003c/odoo>\n"},"docs/L10N_GE_VAT_MAPPING_INVESTIGATION.md":{"sha":"69c2b3695cdce23b","lines":577},"docs/L10N_GE_VAT_MAPPING_REPAIR_PLAN.md":{"sha":"4a28fab41d4816cf","lines":406},"i18n/ka_GE.po":{"sha":"b4fb02e0c967d7af","lines":924},"models/__init__.py":{"sha":"eae27b1d6d33a851","lines":15,"text":"from . import template_ge\nfrom . import account_move\nfrom . import account_move_line\nfrom . import account_payment\nfrom . import account_payment_register\nfrom . import account_tax\nfrom . import contact_category\nfrom . import product_template\nfrom . import purchase_order\nfrom . import purchase_order_line\nfrom . import res_company\nfrom . import res_partner\nfrom . import res_partner_bank\nfrom . import sale_order_line\n"},"models/account_move.py":{"sha":"98bc63c9500ef47c","lines":59,"text":"from odoo import api, fields, models\n\n\nclass AccountMove(models.Model):\n    _inherit = 'account.move'\n\n    gec_show_pay_withholding = fields.Boolean(compute='_compute_gec_show_pay_withholding')\n\n    def _gec_bills(self):\n        \"\"\"Return the vendor bills and purchase receipts of ``self``, without expense receipts (core's Pay flow).\"\"\"\n        return self.filtered(lambda move: move.move_type in ('in_invoice', 'in_receipt') and not ('expense_ids' in move._fields and move.expense_ids))\n\n    def _gec_open_withholding_lines(self):\n        \"\"\"Return the open withholding tax lines (credit, not reconciled) of the posted bills in ``self``.\"\"\"\n        lines = self.env['account.move.line']\n        for move in self._gec_bills().filtered(lambda m: m.state == 'posted'):\n            currency = move.company_currency_id\n            lines |= move.line_ids._gec_withholding_tax_lines().filtered(\n                lambda line: currency.compare_amounts(line.balance, 0) \u003c 0 and line._gec_is_open())\n        return lines\n\n    @api.depends('state', 'payment_state', 'line_ids.amount_residual', 'line_ids.reconciled')\n    def _compute_gec_show_pay_withholding(self):\n        \"\"\"Show Pay Withholding Tax when the vendor is paid but a withholding tax is open.\n        Blocked and reversed bills do not show it.\"\"\"\n        for move in self:\n            move.gec_show_pay_withholding = bool(move.state == 'posted' and move.payment_state == 'paid' and move._gec_open_withholding_lines())\n\n    @api.onchange('partner_id')\n    def _onchange_partner_id_default_taxes(self):\n        self.filtered(lambda move: move.is_invoice(include_receipts=True) and move.company_id._gec_is_georgian()).invoice_line_ids._compute_tax_ids()\n\n    def action_force_register_payment(self):\n        \"\"\"Ask what to pay first when a bill has an open withholding tax; else core's Pay.\n        Non-accountants and expense receipts get core's dialog; gec_pay_choice_done stops it repeating.\"\"\"\n        action = super().action_force_register_payment()\n        if self.env.context.get('dont_redirect_to_payments'):\n            action['context'] = {**action['context'], 'dont_redirect_to_payments': True}\n        if (\n            self.env.context.get('gec_pay_choice_done')\n            or not self.env.user.has_group('account.group_account_user')\n            or self._gec_bills() != self\n            or not self._gec_open_withholding_lines()\n        ):\n            return action\n        return {\n            'name': self.env._(\"Pay\"),\n            'type': 'ir.actions.act_window',\n            'res_model': 'gec.bill.pay.choice',\n            'view_mode': 'form',\n            'views': [[False, 'form']],\n            'target': 'new',\n            'context': {'default_move_ids': self.ids},\n        }\n\n    def action_gec_pay_withholding_tax(self):\n        \"\"\"Open Pay for the withholding tax of the bills, to the State Treasury, with no question first.\"\"\"\n        return self._gec_open_withholding_lines()._gec_action_pay_withholding()\n"},"models/account_move_line.py":{"sha":"5f186c00678586df","lines":146,"text":"from odoo import api, fields, models\nfrom odoo.exceptions import UserError\n\n\nclass AccountMoveLine(models.Model):\n    _inherit = 'account.move.line'\n\n    gec_can_pay = fields.Boolean(compute='_compute_gec_can_pay')\n\n    @api.depends('parent_state', 'move_type', 'journal_id.type', 'payment_id', 'statement_line_id', 'account_id.account_type', 'balance',\n        'reconciled', 'amount_residual', 'amount_residual_currency', 'company_currency_id', 'currency_id',\n        'partner_id', 'company_id')\n    def _compute_gec_can_pay(self):\n        \"\"\"Show Pay on an open payable credit line of a posted general-journal entry.\n        Payment and bank statement entries and bill withholding lines have their own Pay flow.\"\"\"\n        for line in self:\n            currency = line.company_currency_id\n            line.gec_can_pay = bool(\n                line.parent_state == 'posted'\n                and line.move_type == 'entry'\n                and line.journal_id.type == 'general'\n                and not line.payment_id\n                and not line.statement_line_id\n                and line.account_id.account_type == 'liability_payable'\n                and currency.compare_amounts(line.balance, 0) \u003c 0\n                and line._gec_is_open()\n                and line.partner_id\n                and line.company_id._gec_is_georgian()\n            )\n\n    def _gec_is_open(self):\n        \"\"\"Return whether this line still has an amount to settle, as the Pay wizard tests it.\n        A foreign-currency line is open on its currency residual, any other on the company residual.\"\"\"\n        self.ensure_one()\n        if self.currency_id:\n            return not self.currency_id.is_zero(self.amount_residual_currency)\n        return not self.company_currency_id.is_zero(self.amount_residual)\n\n    def _gec_withholding_tax_lines(self):\n        \"\"\"Return the lines of ``self`` booking a withholding tax paid to the State Treasury.\n        Today: tax lines of vendor bills and purchase receipts with a Georgian withholding tax;\n        extend with ``super() | ...``.\"\"\"\n        return self.filtered(lambda line: line.tax_line_id.gec_is_withholding and line.move_id.is_purchase_document(include_receipts=True))\n\n    def action_gec_pay_entry_line(self):\n        \"\"\"Open Pay for this payable line and its partner's other open lines on the account, as one payment.\n        Refused: a line with no partner or another contact; residual and balance not both negative.\n        Opens grouped, so a part amount needs no later write.\"\"\"\n        self.ensure_one()\n        if not self.gec_can_pay:\n            raise UserError(self.env._(\"This line cannot be paid from the journal entry.\"))\n        currency = self.company_currency_id\n        open_lines = self.move_id.line_ids.filtered(lambda line: line.account_id == self.account_id and line._gec_is_open())\n        other_partner_lines = (open_lines - self).filtered(\n            lambda line: not line.partner_id or (\n                line.partner_id != self.partner_id\n                and line.partner_id.commercial_partner_id == self.partner_id.commercial_partner_id))\n        if other_partner_lines:\n            raise UserError(self.env._(\"Lines %(lines)s are on the same account with no partner or another contact of %(partner)s. Reset the entry \"\n                \"to draft, give each line its real partner (the State Treasury on tax lines), then pay again.\",\n                lines=', '.join(line.name or line.account_id.display_name for line in other_partner_lines),\n                partner=self.partner_id.commercial_partner_id.display_name))\n        lines = open_lines.filtered(lambda line: line.partner_id == self.partner_id)\n        if len(lines.currency_id) > 1:\n            raise UserError(self.env._(\"These lines are in different currencies, so one payment cannot settle them. Split the entry by currency.\"))\n        if (currency.compare_amounts(sum(lines.mapped('amount_residual')), 0) >= 0 or currency.compare_amounts(sum(lines.mapped('balance')), 0) >= 0):\n            raise UserError(self.env._(\"Nothing is owed to %(partner)s on this account: the debits of this entry cover the credit.\",\n                partner=self.partner_id.display_name))\n        return lines.action_register_payment(ctx={'dont_redirect_to_payments': True, 'default_group_payment': True})\n\n    def _gec_net_withholding_lines(self):\n        \"\"\"Net each bill withholding line with open debit lines on its account; return what is still open.\n        Offsets: the bill's payments (kept on reset to draft), the same tax on its credit notes, and the open withholding\n        left by any vendor credit note on the account (an overpayment the Treasury already holds).\"\"\"\n        pool = self.search([\n            ('company_id', 'in', self.company_id.ids),\n            ('account_id', 'in', self.account_id.ids),\n            ('move_id.move_type', '=', 'in_refund'),\n            ('parent_state', '=', 'posted'),\n            ('tax_line_id.gec_is_withholding', '=', True),\n            ('reconciled', '=', False),\n            ('balance', '>', 0),\n        ])\n        for line in self:\n            currency = line.company_currency_id\n            move = line.move_id\n            credit_notes = move.reversal_move_ids.filtered(lambda m: m.state == 'posted')\n            candidates = (move.matched_payment_ids.move_id.line_ids | pool\n                | credit_notes.line_ids.filtered(lambda l: l.tax_line_id == line.tax_line_id))\n            offsets = candidates.filtered(\n                lambda l: l.account_id == line.account_id\n                and l.parent_state == 'posted'\n                and currency.compare_amounts(l.balance, 0) > 0\n                and l._gec_is_open())\n            if offsets:\n                (line + offsets).reconcile()\n        return self.filtered(lambda line: line._gec_is_open())\n\n    def _gec_action_pay_withholding(self):\n        \"\"\"Open Pay for the withholding tax lines of ``self``, to the State Treasury, after netting them.\n        When nothing is left open a warning is shown instead.\"\"\"\n        lines = self._gec_net_withholding_lines()\n        if not lines:\n            return {\n                'type': 'ir.actions.client',\n                'tag': 'display_notification',\n                'params': {\n                    'type': 'warning',\n                    'message': self.env._(\"This withholding tax is already paid or offset by credit notes.\"),\n                    'next': {'type': 'ir.actions.act_window_close'},\n                },\n            }\n        return lines.action_register_payment(ctx={'gec_wht_tax_line_payment': True, 'dont_redirect_to_payments': True, 'default_group_payment': True})\n\n    def _get_computed_taxes(self):\n        \"\"\"Apply the partner's default tax, the version valid on the document date.\"\"\"\n        taxes = super()._get_computed_taxes()\n        move = self.move_id\n        if self.display_type != 'product':\n            return taxes\n        if move.is_sale_document(include_receipts=True):\n            type_tax_use = 'sale'\n        elif move.is_purchase_document(include_receipts=True):\n            type_tax_use = 'purchase'\n        else:\n            return taxes\n        AccountTax = self.env['account.tax']\n        return AccountTax._ge_partner_product_taxes(taxes or AccountTax, move.partner_id, self.product_id, move.company_id, type_tax_use,\n            move.fiscal_position_id, date=move.invoice_date or move.date or fields.Date.context_today(self))\n\n    def _affect_tax_report(self):\n        \"\"\"A manual entry line with only Georgian withholding labels skips the tax report,\n        so the entry can be re-dated past a Tax Return Lock Date.\"\"\"\n        self.ensure_one()\n        move = self.move_id\n        if (\n            move.move_type == 'entry'\n            and not move.origin_payment_id\n            and not self.tax_line_id\n            and self.tax_ids\n            and all(self.tax_ids.mapped('gec_is_withholding'))\n            and not self.tax_tag_ids.filtered(lambda tag: tag.applicability == 'taxes')\n        ):\n            return False\n        return super()._affect_tax_report()\n"},"models/account_payment.py":{"sha":"a4dc9721362facc2","lines":14,"text":"from odoo import api, models\n\n\nclass AccountPayment(models.Model):\n    _inherit = 'account.payment'\n\n    @api.model\n    def _get_valid_payment_account_types(self):\n        \"\"\"Allow current liabilities as the counterpart: a withholding tax line is on a non-payable liability.\"\"\"\n        account_types = super()._get_valid_payment_account_types()\n        if self.env.context.get('gec_wht_tax_line_payment'):\n            account_types.append('liability_current')\n        return account_types\n"},"models/account_payment_register.py":{"sha":"c3cc303ad3a4c535","lines":133,"text":"from odoo import api, models\nfrom odoo.exceptions import UserError\nfrom .res_partner import GE_TAX_TREASURY_CODE\n\n\nclass AccountPaymentRegister(models.TransientModel):\n    _inherit = 'account.payment.register'\n\n    @api.model\n    def _gec_state_treasury(self, company):\n        \"\"\"Return the State Treasury of the company: the one contact with Treasury Code 101001000.\n        Contacts of the company or of no company are searched; none or several is refused, not guessed.\"\"\"\n        treasury = self.env['res.partner']._gec_state_treasury_partners(company)\n        if not treasury:\n            raise UserError(self.env._(\"No contact with Treasury Code 101001000 was found for %(company)s. Set that Treasury Code on the State \"\n                \"Treasury contact.\", company=company.display_name))\n        if len(treasury) > 1:\n            raise UserError(self.env._(\"Several contacts have Treasury Code 101001000 for %(company)s: %(partners)s. Keep that Treasury Code on the \"\n                \"State Treasury only.\", company=company.display_name, partners=', '.join(treasury.mapped('display_name'))))\n        return treasury\n\n    @api.model\n    def _get_line_batch_key(self, line):\n        \"\"\"Pay the State Treasury in the company currency, with no bank account chosen yet, when paying a withholding tax line.\"\"\"\n        res = super()._get_line_batch_key(line)\n        if self.env.context.get('gec_wht_tax_line_payment'):\n            res['partner_id'] = self._gec_state_treasury(line.company_id).id\n            res['currency_id'] = line.company_currency_id.id\n            res['partner_bank_id'] = False\n        return res\n\n    @api.model\n    def _get_batch_available_partner_banks(self, batch_result, journal):\n        \"\"\"Offer the bank accounts of the State Treasury, not those of the vendor of the bill.\"\"\"\n        if not self.env.context.get('gec_wht_tax_line_payment'):\n            return super()._get_batch_available_partner_banks(batch_result, journal)\n        company = min(batch_result['lines'].company_id, key=lambda c: len(c.sudo().parent_ids))\n        treasury = self.env['res.partner'].browse(batch_result['payment_values']['partner_id'])\n        return treasury.bank_ids.filtered(lambda bank: bank.company_id.id in (False, company.id))._origin\n\n    @api.model\n    def _get_batch_available_journals(self, batch_result):\n        \"\"\"Offer only journals in the company currency, as the Treasury is paid in it.\"\"\"\n        journals = super()._get_batch_available_journals(batch_result)\n        if self.env.context.get('gec_wht_tax_line_payment'):\n            journals = journals.filtered(lambda journal: not journal.currency_id or journal.currency_id == journal.company_id.currency_id)\n        return journals\n\n    def _compute_currency_id(self):\n        \"\"\"Pay a withholding tax line in the company currency, whatever the currency of the bill.\"\"\"\n        super()._compute_currency_id()\n        if self.env.context.get('gec_wht_tax_line_payment'):\n            for wizard in self:\n                wizard.currency_id = wizard.company_id.currency_id\n\n    def _convert_to_wizard_currency(self, installments):\n        \"\"\"A withholding tax is owed to the State Treasury in the GEL booked on the bill, not re-valued at the payment date.\"\"\"\n        if self.env.context.get('gec_wht_tax_line_payment') and self.currency_id == self.company_currency_id:\n            return sum(installment['amount_residual'] for installment in installments)\n        return super()._convert_to_wizard_currency(installments)\n\n    @api.model\n    def _get_payment_display_partner(self, lines, fallback_partner_id):\n        \"\"\"Name the State Treasury as the partner of the payment of a withholding tax line.\"\"\"\n        if self.env.context.get('gec_wht_tax_line_payment'):\n            return self._gec_state_treasury(lines.company_id[:1]).id\n        return super()._get_payment_display_partner(lines, fallback_partner_id)\n\n    def _gec_check_withholding_payees(self):\n        \"\"\"Refuse paying withholding tax lines to a payee without Treasury Code 101001000, or no payee.\n        Payee: the wizard's partner when one payment is edited, else each batch's partner.\"\"\"\n        batches = self._get_batches()\n        all_tax_lines = self.env['account.move.line'].concat(batch['lines'] for batch in batches)._gec_withholding_tax_lines()\n        edit_mode = self.can_edit_wizard and (len(batches[0]['lines']) == 1 or self.group_payment)\n        for batch in batches:\n            tax_lines = batch['lines'] & all_tax_lines\n            if not tax_lines:\n                continue\n            if edit_mode:\n                payee_id = self._get_payment_display_partner(self.line_ids, self.partner_id.id)\n            else:\n                payee_id = self._get_payment_display_partner(batch['lines'], batch['payment_values']['partner_id'])\n            payee = self.env['res.partner'].browse(payee_id).commercial_partner_id\n            if (payee.gec_treasury_code or '').strip() != GE_TAX_TREASURY_CODE:\n                raise UserError(self.env._(\"%(documents)s books withholding tax, so it is paid to the State Treasury, but the payee %(payee)s has no \"\n                    \"Treasury Code 101001000. Pay the State Treasury contact, or set that Treasury Code on the payee.\",\n                    documents=', '.join(tax_lines.move_id.mapped('display_name')), payee=payee.display_name or self.env._(\"(none)\")))\n\n    def _compute_unreconciled_paid_amount(self):\n        \"\"\"Ignore the vendor's payments in flight when paying a withholding tax.\n        Core subtracts them from the amount to pay, but they went to the vendor, not to the State Treasury.\"\"\"\n        super()._compute_unreconciled_paid_amount()\n        if self.env.context.get('gec_wht_tax_line_payment'):\n            for wizard in self:\n                wizard.unreconciled_paid_amount = 0.0\n\n    def _compute_actionable_errors(self):\n        \"\"\"Drop core's \"already paid\" info when paying a withholding tax: that payment went to the vendor.\"\"\"\n        super()._compute_actionable_errors()\n        if self.env.context.get('gec_wht_tax_line_payment'):\n            for wizard in self.filtered('actionable_errors'):\n                errors = {key: value for key, value in wizard.actionable_errors.items() if key != 'unreconciled_matched_payments'}\n                wizard.actionable_errors = errors or False\n\n    def _create_payments(self):\n        \"\"\"Check the payee of withholding tax lines on every Pay path; make the payment settle the line.\n        An entry line or bill tax line needs a payment with an Outstanding account (checked on what core created); a bill tax line\n        also needs a grouped wizard and refuses a write-off and an early payment discount.\"\"\"\n        entry_payment = self.company_id._gec_is_georgian() and any(move.move_type == 'entry' for move in self.line_ids.move_id)\n        tax_payment = self.env.context.get('gec_wht_tax_line_payment')\n        if tax_payment and not self.group_payment:\n            self.group_payment = True\n        if tax_payment:\n            if self.can_edit_wizard:\n                epd_lines = self.line_ids if self.early_payment_discount_mode else self.env['account.move.line']\n            else:\n                epd_lines = self.env['account.move.line'].concat(batch['lines'] for batch in self._get_batches()\n                    if self._get_total_amounts_to_pay([batch])['epd_applied'])\n            if epd_lines:\n                raise UserError(self.env._(\"%(bills)s still have an early payment discount, which Odoo would take off the withholding tax. Pay the \"\n                    \"vendor first, or pay the State Treasury after the discount date.\", bills=', '.join(epd_lines.move_id.mapped('display_name'))))\n        if (tax_payment and self.payment_difference_handling == 'reconcile' and not self.currency_id.is_zero(self.payment_difference)):\n            raise UserError(self.env._(\"A withholding tax payment cannot write off a difference. Pay the amount due, or a part of it and keep the \"\n                \"difference open.\"))\n        self._gec_check_withholding_payees()\n        payments = super()._create_payments()\n        unsettled = payments.filtered(lambda payment: not payment.move_id)[:1]\n        if (entry_payment or tax_payment) and unsettled:\n            raise UserError(self.env._(\"Payment method %(method)s of %(journal)s has no Outstanding account, so this payment would not \"\n                \"settle the journal entry line. Set one on the journal's Incoming or Outgoing Payments tab.\",\n                method=unsettled.payment_method_line_id.name, journal=unsettled.journal_id.display_name))\n        return payments\n"},"models/account_tax.py":{"sha":"3a165800a9067636","lines":67,"text":"from odoo import api, fields, models\nfrom odoo.exceptions import ValidationError\n\n\nclass AccountTax(models.Model):\n    _inherit = 'account.tax'\n\n    gec_is_withholding = fields.Boolean(string=\"Withholding Tax (GE)\",\n        help=\"Georgian withholding tax: a negative percent tax booked on the vendor bill line. 'Included in Price' = Tax Excluded: the person bears \"\n        \"the tax (deducted from the payable). Tax Included: the company pays it on top. On journal entries it is only a label.\")\n\n    @api.constrains('gec_is_withholding', 'amount_type', 'amount', 'is_withholding_tax', 'price_include_override')\n    def _check_gec_is_withholding(self):\n        \"\"\"A Georgian withholding tax must be a percent tax with a negative amount (0 is a \"no withholding\" label),\n        not Withhold-on-payment, with Included in Price set: any other shape books wrong amounts on a bill.\"\"\"\n        for tax in self.filtered('gec_is_withholding'):\n            if not (\n                tax.amount_type == 'percent'\n                and tax.amount \u003c= 0\n                and not tax.is_withholding_tax\n                and tax.price_include_override in ('tax_excluded', 'tax_included')\n            ):\n                raise ValidationError(self.env._(\"%s: a Georgian withholding tax must be a percent tax with a negative or zero amount, not ticked \"\n                    \"Withhold, and Included in Price set (Tax Excluded or Tax Included).\", tax.display_name))\n\n    @api.model\n    def _add_tax_details_in_base_line(self, base_line, company, rounding_method=None):\n        \"\"\"Keep withholding taxes out of manual journal entries and bank reconciliation lines (label only there).\n        A negative tax there would book a line that Odoo balances on the suspense account.\"\"\"\n        record = base_line.get('record')\n        if (\n            isinstance(record, models.BaseModel)\n            and record._name == 'account.move.line'\n            and record.move_id.move_type == 'entry'\n            and not record.move_id.origin_payment_id\n        ):\n            base_line['calculate_withholding_taxes'] = True\n            base_line['filter_tax_function'] = lambda t: not t.is_withholding_tax and not t.gec_is_withholding\n        super()._add_tax_details_in_base_line(base_line, company, rounding_method=rounding_method)\n\n    @api.model\n    def _ge_partner_product_taxes(self, taxes, partner, product, company, type_tax_use, fiscal_position, date=None):\n        \"\"\"Not Taxed product wins; else the partner's default tax replaces the product's taxes.\n        For a VAT payer a withholding default is added to the product's (already mapped) taxes, never mapped itself.\"\"\"\n        if not company._gec_is_georgian():\n            return taxes\n        if product.not_taxed:\n            return self.env['account.tax']\n        partner = partner.commercial_partner_id.with_company(company)\n        if type_tax_use == 'sale':\n            partner_tax = partner.property_sale_tax_id or partner.sudo().with_company(company.root_id).property_sale_tax_id.with_env(partner.env)\n        else:\n            partner_tax = self._gec_partner_purchase_tax(partner, company, date)\n        partner_tax = partner_tax.filtered('active')\n        if not partner_tax:\n            return taxes\n        if partner_tax.gec_is_withholding:\n            return taxes | partner_tax if partner.gec_vat_payer else partner_tax\n        return fiscal_position.map_tax(partner_tax)\n\n    @api.model\n    def _gec_partner_purchase_tax(self, partner, company, date):\n        \"\"\"Return the partner's Default Purchase Tax for a document of ``date``; a hook for dated tax versions.\"\"\"\n        partner = partner.with_company(company)\n        # sudo: a user allowed only the branch cannot switch to the root company; core reads the root default the same way\n        return partner.property_purchase_tax_id or partner.sudo().with_company(company.root_id).property_purchase_tax_id.with_env(partner.env)\n"},"models/contact_category.py":{"sha":"027791740f2b2bba","lines":12,"text":"from odoo import fields, models\n\n\nclass GecContactCategory(models.Model):\n    _name = 'gec.contact.category'\n    _description = 'Contact Category'\n    _order = 'name, id'\n\n    name = fields.Char(required=True, translate=True)\n    color = fields.Integer()\n    active = fields.Boolean(default=True)\n"},"models/product_template.py":{"sha":"7ff9b974424e99b9","lines":10,"text":"from odoo import fields, models\n\n\nclass ProductTemplate(models.Model):\n    _inherit = 'product.template'\n\n    not_taxed = fields.Boolean(string=\"Not Taxed\",\n        help=\"No tax is proposed for this product on orders, invoices and bills. A tax can still be added by hand on the line.\")\n    supplier_taxes_id = fields.Many2many(domain=[('type_tax_use', '=', 'purchase'), ('gec_is_withholding', '=', False)])\n"},"models/purchase_order.py":{"sha":"4df1ad55e7eaf1f5","lines":10,"text":"from odoo import api, models\n\n\nclass PurchaseOrder(models.Model):\n    _inherit = 'purchase.order'\n\n    @api.onchange('partner_id')\n    def _onchange_partner_id_default_taxes(self):\n        self.filtered(lambda order: order.company_id._gec_is_georgian()).order_line._compute_tax_id()\n"},"models/purchase_order_line.py":{"sha":"358ec4b44ad9c0d1","lines":16,"text":"from odoo import fields, models\n\n\nclass PurchaseOrderLine(models.Model):\n    _inherit = 'purchase.order.line'\n\n    def _compute_tax_id(self):\n        super()._compute_tax_id()\n        AccountTax = self.env['account.tax']\n        for line in self.filtered('product_id'):\n            line = line.with_company(line.company_id)\n            order = line.order_id\n            fpos = order.fiscal_position_id or order.fiscal_position_id._get_fiscal_position(order.partner_id)\n            line.tax_ids = AccountTax._ge_partner_product_taxes(line.tax_ids, order.partner_id, line.product_id, line.company_id, 'purchase', fpos,\n                date=fields.Date.context_today(line, order.date_order))\n"},"models/res_company.py":{"sha":"9a264a58334399ba","lines":11,"text":"from odoo import models\n\n\nclass ResCompany(models.Model):\n    _inherit = 'res.company'\n\n    def _gec_is_georgian(self):\n        self.ensure_one()\n        # sudo: a user working in a branch only cannot read the root company\n        return self.root_id.sudo().account_fiscal_country_id.code == 'GE'\n"},"models/res_partner.py":{"sha":"ab1dbea21b2cc72b","lines":71,"text":"from odoo import api, fields, models\nfrom odoo.tools.business_data import split_vat\n\nGE_TAX_TREASURY_CODE = '101001000'\n\n\nclass ResPartner(models.Model):\n    _inherit = 'res.partner'\n\n    gec_contact_category_ids = fields.Many2many('gec.contact.category', string='Contact Categories', compute='_compute_gec_contact_category_ids',\n        store=True, readonly=False, recursive=True, copy=True,\n        help='User-defined contact categories. Child contacts inherit their parent’s categories.')\n    property_sale_tax_id = fields.Many2one('account.tax', company_dependent=True, check_company=True, ondelete='restrict', string=\"Default Sales Tax\",\n        domain=\"[('type_tax_use', '=', 'sale'), ('is_withholding_tax', '=', False)]\", help=\"Replaces the product's sales taxes on quotations, sales \"\n        \"orders and customer invoices for this contact. The fiscal position still applies afterwards.\")\n    property_purchase_tax_id = fields.Many2one('account.tax', company_dependent=True, check_company=True, ondelete='restrict',\n        string=\"Default Purchase Tax\", domain=\"[('type_tax_use', '=', 'purchase')]\",\n        help=\"Replaces the product's purchase taxes on purchase orders and vendor bills for this contact: a VAT, a withholding tax (the person bears \"\n        \"it or the company pays it) or a 0% \\\"no withholding\\\" label. For a VAT Payer, a withholding tax or label is added to the product's taxes \"\n        \"instead of replacing them. One tax only; add any other tax on the line by hand.\")\n    gec_vat_payer = fields.Boolean(string=\"VAT Payer\", tracking=True, help=\"Registered for VAT: purchase orders and vendor bills keep the product's \"\n        \"VAT and add this contact's Default Purchase Tax when it is a withholding tax or a \\\"no withholding\\\" label. Unticked, that default replaces \"\n        \"the product's taxes. Bills pulled from rs.ge keep only their own VAT: add the label by hand.\")\n    gec_treasury_code = fields.Char(string='Treasury Code', tracking=True, help=\"Set on budget recipients such as the State Treasury (taxes: \"\n        \"101001000). Pay Salaries pays such a contact by this code instead of a bank account, and the bank sends a treasury transfer.\")\n\n    @api.depends('parent_id.gec_contact_category_ids')\n    def _compute_gec_contact_category_ids(self):\n        for partner in self:\n            partner.gec_contact_category_ids = (partner.parent_id.gec_contact_category_ids if partner.parent_id else partner.gec_contact_category_ids)\n\n    @api.depends('vat', 'country_id')\n    def _compute_is_company(self):\n        \"\"\"A Georgian 11-digit personal number belongs to a person (sole traders too), not a company.\n\n        Core counts every contact with a Tax ID as a company. Legal entities (9 digits) and other countries keep it.\"\"\"\n        super()._compute_is_company()\n        for partner in self:\n            if partner.is_company and partner._gec_has_georgian_personal_number():\n                partner.is_company = False\n\n    def _gec_has_georgian_personal_number(self):\n        \"\"\"Whether the Tax ID is an 11-digit Georgian personal number: GE prefix, country Georgia,\n        or no country at all (as rs.ge waybill drivers and sellers are created).\"\"\"\n        self.ensure_one()\n        prefix, number = split_vat((self.vat or '').strip())\n        if not (number.isdigit() and len(number) == 11):\n            return False\n        if prefix:\n            return prefix == 'GE'\n        return not self.country_id or self.country_code == 'GE'\n\n    @api.model\n    def _commercial_fields(self):\n        return super()._commercial_fields() + ['property_sale_tax_id', 'property_purchase_tax_id', 'gec_vat_payer']\n\n    @api.model\n    def _gec_state_treasury_partners(self, company):\n        return self.search([('gec_treasury_code', '=', GE_TAX_TREASURY_CODE), *self._check_company_domain(company)])\n\n    @api.model\n    def _gec_recompute_georgian_company_flag(self):\n        \"\"\"Recompute contacts stored as companies with a Georgian personal number (archived included).\n\n        The compute alone runs only on a Tax ID or country change; called by the data \u003cfunction> on install/upgrade.\"\"\"\n        companies = self.with_context(active_test=False).search_fetch([('is_company', '=', True), ('vat', '!=', False)], ['vat', 'country_id'])\n        stale = companies.filtered(lambda partner: partner._gec_has_georgian_personal_number())\n        if stale:\n            self.env.add_to_compute(self._fields['is_company'], stale)\n            stale._recompute_recordset(['is_company'])\n"},"models/res_partner_bank.py":{"sha":"0b820ea00a362429","lines":42,"text":"from odoo import models\n\n# Georgian IBAN bank code (positions 5-6) -> (bank name, BIC).\nGE_BANKS = {\n    'BG': ('Bank of Georgia', 'BAGAGE22'),\n    'BS': ('BasisBank', 'CBASGE22'),\n    'BT': ('Silk Bank', 'DISNGE22'),\n    'CR': ('Cartu Bank', 'CRTUGE22'),\n    'HB': ('Halyk Bank Georgia', 'HABGGE22'),\n    'KS': ('Terabank', 'TEBAGE22'),\n    'LB': ('Liberty Bank', 'LBRTGE22'),\n    'PC': ('ProCredit Bank', 'MIBGGE22'),\n    'TB': ('TBC Bank', 'TBCBGE22'),\n    'VT': ('VTB Bank Georgia', 'UGEBGE22'),\n    'ZB': ('Ziraat Bank Georgia', 'TCZBGE22'),\n    'PB': ('Pasha Bank Georgia', 'PAHAGE22'),\n    'IS': ('Isbank Georgia', 'ISBKGE22'),\n    'CD': ('Credo Bank', 'JSCRGE22'),\n    'PS': ('Paysera Bank Georgia', 'PSRAGE22'),\n    'HS': ('HASH Bank', 'HAJSGE22'),\n    'PV': ('Pave Bank Georgia', 'PAVEGE22'),\n    'MB': ('Microbank MBC', 'MOMBGE22'),\n    'BC': ('Microbank Crystal', 'BCRYGE22'),\n}\n\n\nclass ResPartnerBank(models.Model):\n    _inherit = 'res.partner.bank'\n\n    def _sanitize_vals(self, vals):\n        \"\"\"Fill the bank name and BIC of a Georgian IBAN from its bank code.\n        A value typed in the same save wins; an empty one counts as not typed.\"\"\"\n        super()._sanitize_vals(vals)\n        account_number = vals.get('sanitized_account_number') or ''\n        bank = account_number.startswith('GE') and GE_BANKS.get(account_number[4:6])\n        if not bank:\n            return\n        if not vals.get('bank_name'):\n            vals['bank_name'] = bank[0]\n        if not vals.get('bank_bic'):\n            vals['bank_bic'] = bank[1]\n"},"models/sale_order_line.py":{"sha":"a710bf34f0f0c538","lines":15,"text":"from odoo import api, models\n\n\nclass SaleOrderLine(models.Model):\n    _inherit = 'sale.order.line'\n\n    @api.depends('order_id.partner_id')\n    def _compute_tax_ids(self):\n        super()._compute_tax_ids()\n        AccountTax = self.env['account.tax']\n        for line in self.filtered(lambda l: l.product_id and l.product_type != 'combo'):\n            order = line.order_id\n            line.tax_ids = AccountTax._ge_partner_product_taxes(line.tax_ids, order.partner_id, line.product_id, line.company_id, 'sale',\n                order.fiscal_position_id)\n"},"models/template_ge.py":{"sha":"65165bf040682ca4","lines":234,"text":"import csv\n\nfrom psycopg2 import IntegrityError\n\nfrom odoo import Command, api, models\nfrom odoo.addons.account.models.chart_template import template\nfrom odoo.exceptions import UserError\nfrom odoo.tools import file_open, mute_logger\n\nGE_TAX_TEXTS_KEY = 'gec_localization.tax_texts_20261023'\nGE_RC_TEXTS_KEY = 'gec_localization.tax_texts_rc_20261104'\nGE_TAX_CATEGORIES_KEY = 'gec_localization.tax_categories_20261028'\nGE_REMOVED_TAXES = ('ge_tax_p_wht_res_rent_5_cp',)\nGE_WRONG_REPLACEMENTS = {\n    'ge_vat_sale_18_sp_sale': 'ge_vat_sale_18',\n    'ge_vat_sale_18_adv': 'ge_vat_sale_18',\n    'ge_vat_sale_18_other': 'ge_vat_sale_18',\n    'ge_vat_sale_exempt_financial': 'ge_vat_sale_18',\n    'ge_vat_sale_exempt_land': 'ge_vat_sale_18',\n    'ge_vat_sale_exempt_other': 'ge_vat_sale_18',\n    'ge_rcvat_18_ser': 'ge_vat_purchase_18',\n    'ge_rcvat_18_goods_customs': 'ge_vat_purchase_18',\n    'ge_rcvat_18_goods_fiz': 'ge_vat_purchase_18',\n}\nGE_VAT_POSITION = 'ge_fiscal_position_vat'\nGE_DOMESTIC_POSITIONS = ('ge_fiscal_position_nonvat', 'ge_fiscal_position_domestic')\nGE_DOMESTIC_SALE_TAXES = ('ge_vat_sale_18', 'ge_vat_sale_18_sp_sale', 'ge_vat_sale_18_adv', 'ge_vat_sale_18_building', 'ge_vat_sale_18_repairs',\n    'ge_vat_sale_18_barter', 'ge_vat_sale_18_other', 'ge_vat_sale_exempt_financial', 'ge_vat_sale_exempt_land', 'ge_vat_sale_exempt_other')\nGE_IMPORT_VAT_TAXES = ('ge_import_duty_18', 'ge_import_duty_12', 'ge_import_duty_5')\n\n\ndef _read_ge_core_tax_texts():\n    \"\"\"{xmlid: {field: value}} of our l10n_ge tax names, descriptions, invoice labels (en, ka) and Tax Category Code.\n    Empty cells are dropped, as core does, so the l10n_ge value stays.\"\"\"\n    with file_open('gec_localization/data/template/ge_core_tax_texts.csv', 'r') as csv_file:\n        return {\n            row['id']: {\n                key: value.strip() for key, value in row.items()\n                if key and key != 'id' and value and value.strip()\n            }\n            for row in csv.DictReader(csv_file) if row['id']\n        }\n\n\nclass AccountChartTemplate(models.AbstractModel):\n    _inherit = 'account.chart.template'\n\n    @template('ge', 'account.account')\n    def _get_ge_gec_account_account(self):\n        \"\"\"Our accounts on top of l10n_ge's chart, plus overrides of four of its accounts.\n        Pension 332010: Payable + reconcilable; 310310: Payable; 331310: non-reconcilable.\n        WHT Settled 331211 (core Expense): non-trade Payable, so Pay settles it. Payroll income tax posts to 331320.\"\"\"\n        return self._parse_csv('ge', 'account.account', module='gec_localization')\n\n    @template('ge', 'account.tax.group')\n    def _get_ge_gec_account_tax_group(self):\n        return self._parse_csv('ge', 'account.tax.group', module='gec_localization')\n\n    @template('ge', 'account.tax')\n    def _get_ge_gec_account_tax(self):\n        \"\"\"Taxes l10n_ge does not ship (withholding, turnover, CIT, out of scope ...).\n        The reverse-charge one carries l10n_ge's report tags 21(B)/21(T) so Odoo's VAT report sees it.\"\"\"\n        tax_data = self._parse_csv('ge', 'account.tax', module='gec_localization')\n        self._deref_account_tags('ge', tax_data)\n        return tax_data\n\n    @template(model='account.tax')\n    def _get_account_tax(self, template_code):\n        \"\"\"Correct l10n_ge's tax data on every 'ge' chart load: drop nine wrong \"Replaces\" links,\n        keep domestic sale taxes for buyers without a Tax ID, make the three import-VAT-only taxes price-included,\n        set names, labels and Tax Category Codes from ge_core_tax_texts.csv. Ids via .get(): indexing creates an empty row.\"\"\"\n        tax_data = super()._get_account_tax(template_code)\n        if template_code != 'ge':\n            return tax_data\n        for xmlid, source in GE_WRONG_REPLACEMENTS.items():\n            values = tax_data.get(xmlid)\n            if values and values.get('original_tax_ids'):\n                rest = [x for x in values['original_tax_ids'].split(',') if x != source]\n                if rest:\n                    values['original_tax_ids'] = ','.join(rest)\n                else:\n                    values.pop('original_tax_ids', None)\n        for xmlid in GE_DOMESTIC_SALE_TAXES:\n            values = tax_data.get(xmlid)\n            positions = [x for x in (values or {}).get('fiscal_position_ids', '').split(',') if x]\n            if GE_VAT_POSITION in positions:\n                positions += [x for x in GE_DOMESTIC_POSITIONS if x not in positions]\n                values['fiscal_position_ids'] = ','.join(positions)\n        for xmlid in GE_IMPORT_VAT_TAXES:\n            if xmlid in tax_data:\n                tax_data[xmlid]['price_include_override'] = 'tax_included'\n        for xmlid, values in _read_ge_core_tax_texts().items():\n            if xmlid in tax_data:\n                tax_data[xmlid].update(values)\n        return tax_data\n\n    @api.model\n    def _ge_fix_core_vat_taxes(self, companies=None):\n        \"\"\"Apply the _get_account_tax corrections to existing records (install and every 'ge' chart load).\n        Only the wrong \"Replaces\" link is removed and an empty price-included value filled, so edits survive;\n        archived records included.\"\"\"\n        if companies is None:\n            companies = self.env['res.company'].search([('chart_template', '=', 'ge'), ('parent_id', '=', False)])\n        for company in companies:\n            tpl = self.with_company(company).with_context(active_test=False)\n            for xmlid, source_xmlid in GE_WRONG_REPLACEMENTS.items():\n                tax = tpl.ref(xmlid, raise_if_not_found=False)\n                source = tpl.ref(source_xmlid, raise_if_not_found=False)\n                if tax and source and source in tax.original_tax_ids:\n                    tax.original_tax_ids = [Command.unlink(source.id)]\n            vat_position = tpl.ref(GE_VAT_POSITION, raise_if_not_found=False)\n            domestic = [position for xmlid in GE_DOMESTIC_POSITIONS if (position := tpl.ref(xmlid, raise_if_not_found=False))]\n            for xmlid in GE_DOMESTIC_SALE_TAXES:\n                tax = tpl.ref(xmlid, raise_if_not_found=False)\n                if tax and vat_position and vat_position in tax.fiscal_position_ids:\n                    tax.fiscal_position_ids = [Command.link(position.id) for position in domestic]\n            for xmlid in GE_IMPORT_VAT_TAXES:\n                tax = tpl.ref(xmlid, raise_if_not_found=False)\n                if tax and not tax.price_include_override:\n                    tax.price_include_override = 'tax_included'\n\n    def _post_load_data(self, template_code, company, template_data):\n        super()._post_load_data(template_code, company, template_data)\n        if template_code == 'ge' and not company.parent_id:\n            self._ge_gec_apply_maintenance(company)\n            self._ge_fix_core_vat_taxes(company)\n\n    @api.model\n    def _ge_gec_apply_maintenance(self, companies=None):\n        \"\"\"Create our template records missing in a 'ge' company, matching hand-made records first as a chart reload does.\n        Give each company its own WHT certificate sequence. Existing records are rewritten only by _ge_apply_tax_texts;\n        new Bank and Cash accounts get no journal; Georgian names never overwrite a set name. @api.model: for the data \u003cfunction> tag.\"\"\"\n        if companies is None:\n            companies = self.env['res.company'].search([('chart_template', '=', 'ge'), ('parent_id', '=', False)])\n        shared_seq = self.env.ref('gec_localization.seq_ge_wht', raise_if_not_found=False)\n        for company in companies:\n            tpl = self.with_company(company)\n            data = tpl._get_chart_template_data('ge', module='gec_localization')\n            data.pop('template_data', None)\n            missing = {\n                model: {xid: vals for xid, vals in records.items() if not tpl.ref(xid, raise_if_not_found=False)}\n                for model, records in data.items()\n            }\n            missing = {model: records for model, records in missing.items() if records}\n            if missing:\n                tpl._pre_reload_data(company, {}, missing)\n                tpl._pre_load_data('ge', company, {}, missing)\n                tpl.with_context(skip_auto_account_journal_creation=True)._load_data(missing)\n            if shared_seq:\n                company_seq = self._ge_wht_company_sequence(shared_seq, company)\n                self.env['account.tax'].search([\n                    ('company_id', '=', company.id),\n                    ('is_withholding_tax', '=', True),\n                    ('withholding_sequence_id', 'in', (False, shared_seq.id)),\n                ]).write({'withholding_sequence_id': company_seq.id})\n        if companies:\n            self._ge_apply_tax_texts()\n            self._ge_apply_tax_texts(GE_RC_TEXTS_KEY, ('ge_tax_p_rc_18_nonvatreg',))\n            self._ge_apply_tax_categories()\n            self._load_translations(companies=companies)\n\n    @api.model\n    def _ge_apply_tax_texts(self, key=GE_TAX_TEXTS_KEY, xmlids=None):\n        \"\"\"Once per database and key: remove retired taxes (archive if used); set template name, description and invoice\n        label (en, ka) on 'ge' company taxes, only `xmlids` when given; no Georgian text keeps the stored one.\n        One dict write per field: per-language Html writes mismap terms.\"\"\"\n        params = self.env['ir.config_parameter'].sudo()\n        if params.get_bool(key):\n            return\n        companies = self.env['res.company'].search([('chart_template', '=', 'ge'), ('parent_id', '=', False)])\n        template_values = self.with_context(ignore_missing_tags=True)._get_chart_template_model_data('ge', 'account.tax')\n        text_xmlids = sorted({*_read_ge_core_tax_texts(),\n            *self._parse_csv('ge', 'account.tax', module='gec_localization')} & template_values.keys() & set(xmlids or template_values))\n        has_ka = bool(self.env['res.lang']._lang_get('ka_GE'))\n        for company in companies:\n            tpl = self.with_company(company).with_context(active_test=False)\n            for xmlid in GE_REMOVED_TAXES:\n                tax = tpl.ref(xmlid, raise_if_not_found=False)\n                if tax:\n                    try:\n                        with self.env.cr.savepoint(), mute_logger('odoo.sql_db'):\n                            tax.unlink()\n                    except (UserError, IntegrityError):\n                        tax.active = False\n            for xmlid in text_xmlids:\n                tax = tpl.ref(xmlid, raise_if_not_found=False)\n                if not tax:\n                    continue\n                values = template_values[xmlid]\n                vals = {}\n                for fname in ('name', 'description', 'invoice_label'):\n                    en = values.get(fname)\n                    if not en:\n                        continue\n                    if not has_ka:\n                        vals[fname] = en\n                        continue\n                    stored = tax._get_stored_translations(fname)\n                    ka = values.get(f'{fname}@ka') or (dict.get(stored, 'ka_GE') if stored is not None else None)\n                    vals[fname] = {'en_US': en, 'ka_GE': ka} if ka else en\n                if vals:\n                    tax.with_context(lang='en_US', active_test=True).write(vals)\n        params.set_bool(key, True)\n\n    @api.model\n    def _ge_apply_tax_categories(self):\n        \"\"\"Fill empty Tax Category Codes of existing Georgian taxes from the template CSVs, once per database.\"\"\"\n        params = self.env['ir.config_parameter'].sudo()\n        if params.get_bool(GE_TAX_CATEGORIES_KEY):\n            return\n        template_taxes = {**_read_ge_core_tax_texts(), **self._parse_csv('ge', 'account.tax', module='gec_localization')}\n        codes = {xmlid: values['ubl_cii_tax_category_code'] for xmlid, values in template_taxes.items() if values.get('ubl_cii_tax_category_code')}\n        companies = self.env['res.company'].search([('chart_template', '=', 'ge'), ('parent_id', '=', False)])\n        for company in companies:\n            tpl = self.sudo().with_company(company).with_context(active_test=False)\n            for xmlid, code in codes.items():\n                tax = tpl.ref(xmlid, raise_if_not_found=False)\n                if tax and not tax.ubl_cii_tax_category_code:\n                    tax.ubl_cii_tax_category_code = code\n        params.set_bool(GE_TAX_CATEGORIES_KEY, True)\n\n    def _ge_wht_company_sequence(self, shared, company):\n        \"\"\"One certificate counter per legal entity, starting where the shared counter stands.\"\"\"\n        Sequence = self.env['ir.sequence']\n        sequence = Sequence.search([('code', '=', shared.code), ('company_id', '=', company.id)], limit=1)\n        return sequence or Sequence.create({\n            'name': f\"{shared.name} - {company.name}\",\n            'code': shared.code,\n            'prefix': shared.prefix,\n            'padding': shared.padding,\n            'company_id': company.id,\n            'number_next': shared.number_next_actual,\n        })\n"},"security/ir.access.csv":{"sha":"1131b713684a0c61","lines":7,"text":"id,name,model_id,group_id/id,operation,domain\naccess_gec_contact_category_user,Contact Category internal user,gec.contact.category,base.group_user,crud,\naccess_l10n_ge_cit_wizard,access.l10n.ge.cit.wizard,l10n.ge.cit.wizard,account.group_account_manager,cru,\nrule_l10n_ge_cit_wizard_own,CIT wizard: own records only,l10n.ge.cit.wizard,,crud,\"[('create_uid', '=', user.id)]\"\naccess_gec_bill_pay_choice,access.gec.bill.pay.choice,gec.bill.pay.choice,account.group_account_user,cru,\nrule_gec_bill_pay_choice_own,Bill Pay Choice: own records only,gec.bill.pay.choice,,crud,\"[('create_uid', '=', user.id)]\"\n"},"tests/__init__.py":{"sha":"b04b674bc43530e9","lines":4},"tests/test_ge_tax_categories.py":{"sha":"dcf5d0554fe77fd0","lines":74},"tests/test_ge_vat_mapping.py":{"sha":"87f091fe6d8651e8","lines":176},"tests/test_review_fixes.py":{"sha":"ba13c5e7acd8f8b9","lines":300},"views/account_move_views.xml":{"sha":"ecdcfcecc9e09fab","lines":30,"text":"\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n\u003codoo>\n    \u003crecord id=\"view_move_form_gec_pay_entry_line\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">account.move.form.gec.pay.entry.line\u003c/field>\n        \u003cfield name=\"model\">account.move\u003c/field>\n        \u003cfield name=\"inherit_id\" ref=\"account.view_move_form\"/>\n        \u003cfield name=\"arch\" type=\"xml\">\n            \u003cxpath expr=\"//field[@name='line_ids']/list\" position=\"inside\">\n                \u003cfield name=\"gec_can_pay\" column_invisible=\"True\"/>\n                \u003cbutton name=\"action_gec_pay_entry_line\" type=\"object\" string=\"Pay\" class=\"btn-link\"\n                        invisible=\"not gec_can_pay\" groups=\"account.group_account_user\"/>\n            \u003c/xpath>\n        \u003c/field>\n    \u003c/record>\n\n    \u003crecord id=\"view_move_form_gec_pay_withholding\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">account.move.form.gec.pay.withholding\u003c/field>\n        \u003cfield name=\"model\">account.move\u003c/field>\n        \u003cfield name=\"inherit_id\" ref=\"acco            \u003c/sheet>\n            \u003c/form>\n        \u003c/field>\n    \u003c/record>\n\n    \u003crecord id=\"contact_category_view_search\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">gec.contact.category.search\u003c/field>\n        \u003cfield name=\"model\">gec.contact.category\u003c/field>\n        \u003cfield name=\"arch\" type=\"xml\">\n            \u003csearch string=\"Contact Categories\">\n                \u003cfield name=\"name\"/>\n                \u003cseparator/>\n                \u003cfilter name=\"archived\" string=\"Archived\" domain=\"[('active', '=', False)]\"/>\n            \u003c/search>\n        \u003c/field>\n    \u003c/record>\n\n    \u003crecord id=\"contact_category_action\" model=\"ir.actions.act_window\">\n        \u003cfield name=\"name\">Contact Categories\u003c/field>\n        \u003cfield name=\"res_model\">gec.contact.category\u003c/field>\n        \u003cfield name=\"view_mode\">list,form\u003c/field>\n        \u003cfield name=\"search_view_id\" ref=\"contact_category_view_search\"/>\n    \u003c/record>\n\n    \u003cmenuitem id=\"menu_contact_categories\" name=\"Contact Categories\"\n              parent=\"contacts.menu_contacts\" action=\"contact_category_action\"\n              sequence=\"3\" groups=\"base.group_user\"/>\n\n    \u003crecord id=\"view_partner_form_contact_categories\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">res.partner.form.contact.categories\u003c/field>\n        \u003cfield name=\"model\">res.partner\u003c/field>\n        \u003cfield name=\"inherit_id\" ref=\"base.view_partner_form\"/>\n        \u003cfield name=\"arch\" type=\"xml\">\n            \u003cfield name=\"category_id\" position=\"after\">\n                \u003cfield name=\"gec_contact_category_ids\" widget=\"many2many_tags\"\n                       options=\"{'color_field': 'color'}\" readonly=\"parent_id\"/>\n            \u003c/field>\n            \u003cxpath expr=\"//field[@name='child_ids']/form/sheet/group[last(
