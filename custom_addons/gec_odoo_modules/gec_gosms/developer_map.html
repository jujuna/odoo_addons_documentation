addEventListener('hashchange', () => render());
/* hover card: a preview without leaving the page */
const card = document.body.appendChild(Object.assign(document.createElement('div'), {id: 'hover'}));
let cardTimer = 0;
function cardHtml(id) {
  const e = IDX.get(id); if (!e) return '';
  const o = e.o;
  switch (e.type) {
    case 'scenario': return `<b class="t">${esc(o.title)}</b>${plain(o.case)}<div class="faint" style="margin-top:3px">${o.tests?.length ? 'pinned by a test' : 'from code'} · ${(o.steps || []).length} steps</div>`;
    case 'method': return `<b class="t">${esc(mname(o))}()</b><span class="bdg ${o.kind}">${MKIND[o.kind]}</span> ${plain(purposeOf(o)) || 'No note yet.'}<div class="faint" style="margin-top:4px">${esc(o.file)}:${o.def_line} · ${o.end - o.line + 1} lines</div>`;
    case 'field': return `<b class="t">${esc(o.model)}.${esc(o.name)}</b>${esc(T(o.label || ''))} · ${esc(o.type)}${o.comodel ? ' → ' + esc(o.comodel) : ''}${S.field_notes?.[o.id] ? `<div style="margin-top:3px">${plain(S.field_notes[o.id])}</div>` : ''}`;
    case 'button': return `<b class="t">${esc(T(o.label || '') || o.name)}</b>Button on ${esc(o.model || '')}, calls ${esc(o.name)}()${o.invisible ? `<div class="faint" style="margin-top:3px">Hidden when ${esc(o.invisible)}</div>` : ''}`;
    case 'model': return `<b class="t">${esc(o.model)}</b><span class="bdg ${o.kind}">${KIND[o.kind]}</span> ${plain(O.models?.[o.model] || o.description)}<div class="faint" style="margin-top:4px">${o.fields.length} fields · ${o.methods.length} methods</div>`;
    case 'group': return `<b class="t">${esc(o.full)}</b>${esc(o.xid)}${o.implied ? `<div class="faint" style="margin-top:3px">Includes ${esc(o.implied.map(x => GROUPS[x]?.full || x).join(', '))}</div>` : ''}`;
    case 'msg': return `<b class="t">${esc(o.exc)}</b>“${esc(T(o.text))}”<div class="faint" style="margin-top:3px">raised in ${esc(mname(e.m))}()</div>`;
    case 'menu': return `<b class="t">${esc((o.path || []).map(n => T(n.name || '?')).join(' › '))}</b>Opens ${esc(o.res_model || o.action || '')}`;
    case 'flow': return `<b class="t">${esc(o.title)}</b>${plain(o.summary)}<div class="faint" style="margin-top:3px">${o.steps.length} steps</div>`;
    default: return `<b class="t">${esc(id.replace(/^\w+:/, ''))}</b>${esc(T(o.name || ''))}`;
  }
}
document.addEventListener('mouseover', ev => {
  const c = ev.target.closest?.('.chip[data-open], .chip[data-go], .node[data-open], .node[data-go], .node[data-pick], .quote[data-open]');
  clearTimeout(cardTimer); card.classList.remove('on');
  if (!c || matchMedia('(hover: none)').matches) return;
  const go = c.dataset.go || '';
  const id = c.dataset.open || (go.startsWith('#/data/') ? 'model:' + decodeURIComponent(go.slice(7)) : go.startsWith('#/flows/') ? 'flow:' + decodeURIComponent(go.slice(8))
    : go.startsWith('#/scenarios/') ? 'scenario:' + decodeURIComponent(go.slice(12)) : c.dataset.pick !== undefined ? 'model:' + c.dataset.n : '');
  cardTimer = setTimeout(() => { const html = cardHtml(id); if (!html) return;
    card.innerHTML = html; const r = c.getBoundingClientRect(), h = card.offsetHeight, w = card.offsetWidth;
    card.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px'; card.style.top = (r.bottom + h + 14 > innerHeight ? r.top - h - 8 : r.bottom + 8) + 'px'; card.classList.add('on'); }, 300);
});
addEventListener('scroll', () => { clearTimeout(cardTimer); card.classList.remove('on'); }, true);
/* drag a diagram to pan it */
let pan = null;
document.addEventListener('pointerdown', ev => { const w = ev.target.closest('.mapwrap'); if (!w || ev.target.closest('.node')) return; pan = {w, x: ev.clientX, y: ev.clientY, l: w.scrollLeft, t: w.scrollTop}; w.classList.add('drag'); });
document.addEventListener('pointermove', ev => { if (pan) { pan.w.scrollLeft = pan.l - (ev.clientX - pan.x); pan.w.scrollTop = pan.t - (ev.clientY - pan.y); } });
document.addEventListener('pointerup', () => { pan?.w.classList.remove('drag'); pan = null; });
document.addEventListener('wheel', ev => { const w = ev.target.closest?.('.mapwrap'); if (!w || !(ev.ctrlKey || ev.metaKey)) return; ev.preventDefault();
  const el = w.querySelector('.map'); el._z = (el._cur || 1) * (ev.deltaY < 0 ? 1.100 : .9); setZoom(el, el._z); }, {passive: false});
const toastEl = document.body.appendChild(Object.assign(document.createElement('div'), {id: 'toast'}));
let toastTimer = 0;
const toast = text => { toastEl.textContent = text; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 4200); };
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const box = document.body.appendChild(Object.assign(document.createElement('textarea'), {value: text})); box.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {} box.remove(); return ok;
}
const wrapOn = store.get('wrap', '1') === '1'; $('#drawer').classList.toggle('wrap', wrapOn); $('#dr-wrap').classList.toggle('on', wrapOn);
$('#dr-grip').addEventListener('pointerdown', ev => {
  ev.preventDefault(); const grip = ev.currentTarget; grip.setPointerCapture(ev.pointerId); document.body.classList.add('sizing');
  const move = e => { store.set('dw', Math.round(innerWidth - e.clientX)); dockFit(); };
  const up = () => { document.body.classList.remove('sizing'); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); refit(); };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);

$('#dr-grip').addEventListener('dblclick', () => { store.set('dw', ''); dockFit(); refit(); });
let sizeTimer = 0;
addEventListener('resize', () => { clearTimeout(sizeTimer); sizeTimer = setTimeout(() => { dockFit(); refit(); }, 80); });

$('#theme').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', document.documentElement.dataset.theme); };

    let name = LANG; try { name = new Intl.DisplayNames(['en'], {type: 'language'}).of(LANG.split('_')[0]) || LANG; } catch {}

}

load('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js').then(ok => ok && render(true));
