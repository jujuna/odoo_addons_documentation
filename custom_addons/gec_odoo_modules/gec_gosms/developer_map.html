<style>
:root{

}

  --code:#181b21;--hl:#3b3413;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);

:root[data-theme="dark"]{
  color-scheme:dark;--bg:#14161b;--surface:#1b1e25;--raised:#21252e;--sunken:#262a34;--ink:#e4e6eb;--ink2:#c3c7d0;--muted:#9aa1ae;--faint:#6c7381;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line2) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.62 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3,h4,p{margin:0}
code,.mono{font-family:var(--mono);font-size:.86em}
code{background:var(--sunken);padding:1px 5px;border-radius:5px;color:var(--ink2);overflow-wrap:anywhere}
kbd{font:500 11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--raised)}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
#app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
#nav{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.brand-name{font:600 15px var(--mono);letter-spacing:-.01em;overflow-wrap:anywhere}
.brand-title{color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.stamp{display:block;margin-top:12px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--ink2)}
.stamp:hover{border-color:var(--line2)}.stamp b{font:600 12px var(--mono)}
.stamp .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.stamp .dot.dirty{background:var(--amber)}
.nav-group{font:600 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 10px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink2);font-weight:500;font-size:14px}
.nav-item:hover{background:var(--sunken)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav-item .n{margin-left:auto;font:500 11.5px var(--mono);color:var(--faint)}
.nav-item.on .n{color:inherit;opacity:.7}
.nav-item .seen{width:5px;height:5px;border-radius:50%;background:var(--green);opacity:0;margin-left:-4px}
.nav-item.visited .seen{opacity:.8}
.nav-item .warn{background:var(--amber-soft);color:var(--amber);border-radius:20px;padding:0 6px}
.nav-foot{margin-top:auto;font-size:11.5px;color:var(--faint);padding:0 10px;line-height:1.5}
#main{min-width:0}
#bar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:12px 40px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.searchbox{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13.5px;text-align:left}
.searchbox:hover{border-color:var(--line2)}.searchbox kbd{margin-left:auto}.searchbox .short{display:none}
.bar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 10px;font:600 11.5px var(--sans);color:var(--muted);letter-spacing:.03em}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}
#view{padding:8px 40px 90px;max-width:1180px;margin:0 auto;outline:0;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
h1{font-size:30px;line-height:1.18;letter-spacing:-.022em;font-weight:700;margin:6px 0 10px}
h2{font-size:19px;letter-spacing:-.012em;font-weight:650;margin:38px 0 4px;scroll-margin-top:72px}
h3{font-size:15px;font-weight:600;margin:0 0 6px}
h4{font-size:14.5px;font-weight:600;line-height:1.4}
.lead{font-size:17px;line-height:1.6;color:var(--ink2);max-width:74ch}
.sub{color:var(--muted);font-size:13.5px;max-width:78ch;margin-bottom:14px}
.prose p{max-width:74ch;margin:0 0 10px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card.flush{padding:0;overflow:hidden}.card.pad0{padding:0}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0 4px}
.tile{display:block;padding:13px 15px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile b{display:block;font:650 24px/1.1 var(--sans);letter-spacing:-.02em}
.tile span{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;font:500 12.5px/1.5 var(--mono);padding:1px 7px;border-radius:6px;background:var(--sunken);color:var(--ink2);border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:baseline}
a.chip:hover{border-color:currentColor}
.chip.m{background:var(--accent-soft);color:var(--accent-ink)}
.chip.model{background:var(--teal-soft);color:var(--teal)}
.chip.g{background:var(--violet-soft);color:var(--violet);font-family:var(--sans)}
.chip.g.neg{text-decoration:line-through}
.chip.menu{background:var(--amber-soft);color:var(--amber);font-family:var(--sans)}
.chip.msg{background:var(--red-soft);color:var(--red);font-family:var(--sans)}
.chip.flow{background:var(--green-soft);color:var(--green);font-family:var(--sans)}
.chip.scen{background:var(--amber-soft);color:var(--amber);font-family:var(--sans)}
.chip.ui{font:600 12.5px/1.5 var(--sans);background:var(--raised);border:1px solid var(--line2);box-shadow:0 1px 0 var(--line2);color:var(--ink);padding:1px 9px}
.chip.ui.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);box-shadow:none}
.uis{font-weight:600;color:var(--ink)}
.bdg{display:inline-block;font:600 10.5px/1.6 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:0 6px;border-radius:5px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.bdg.own,.bdg.action,.bdg.module{background:var(--accent-soft);color:var(--accent-ink)}
.bdg.extend,.bdg.override,.bdg.odoo,.bdg.orm{background:var(--teal-soft);color:var(--teal)}
.bdg.wizard,.bdg.compute,.bdg.other,.bdg.onchange{background:var(--violet-soft);color:var(--violet)}
.bdg.constraint,.bdg.ondelete,.bdg.external,.bdg.warn{background:var(--amber-soft);color:var(--amber)}
.bdg.user,.bdg.ok,.bdg.checked,.bdg.fact{background:var(--green-soft);color:var(--green)}
.bdg.bad{background:var(--red-soft);color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font:600 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 12px 8px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:break-word}
.tbl code{overflow-wrap:break-word}.tbl .chip{white-space:normal;overflow:visible}
.tbl td.num{text-align:right;font:600 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.rowlink{cursor:pointer}.tbl tr.rowlink:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.scroll,.card.flush.scroll{overflow-x:auto}
.at{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
a.at:hover{color:var(--accent);text-decoration:underline}
.callout{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0;border:1px solid var(--line);background:var(--surface)}
.callout.warn{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.callout.info{background:var(--accent-soft);border-color:transparent}
.callout.bad{background:var(--red-soft);border-color:transparent}
.callout.ok{background:var(--green-soft);border-color:transparent}
.callout b.t{display:block;margin-bottom:2px}
.arch{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1.5fr) 26px minmax(0,1fr);gap:0;align-items:stretch;margin-top:10px}
.arch .arrow{display:grid;place-items:center;color:var(--faint)}
.arch .col{display:flex;flex-direction:column;gap:8px}
.arch .col>.eyebrow{margin-bottom:2px}
.dep{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.35}
.dep b{font:600 12.5px var(--mono);display:block}
.dep.me{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.next{display:flex;align-items:center;gap:14px;margin-top:44px;padding:16px 18px;border-radius:var(--r);border:1px dashed var(--line2);color:var(--ink2)}
.next:hover{border-color:var(--accent);background:var(--surface)}
.next{min-width:0}.next>span{min-width:0}.next b{display:block;font-size:15px;color:var(--ink);overflow-wrap:anywhere}.next .ic{margin-left:auto;color:var(--accent)}
.sig{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;margin:12px 0 2px}
.sig a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--mono);background:var(--cs);color:var(--c);border:2px solid transparent;flex:none;transition:transform .12s}
.sig a:hover{transform:scale(1.14)}
.sig a.stop{border-color:var(--red)}
.sig a.opt{border-style:dashed;border-color:var(--c)}
.sig a.cur{background:var(--c);color:var(--bg)}
.sig .bar{width:16px;height:2px;background:var(--line2);flex:none}
.legend i.ring{background:none;border:2px solid var(--red)}
.legend i.dash{background:none;border:2px dashed var(--muted)}
#hover{position:fixed;z-index:30;max-width:380px;padding:10px 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:13px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .1s;color:var(--ink2)}
#hover.on{opacity:1}
#hover b.t{display:block;font:600 12.5px var(--mono);color:var(--ink);margin-bottom:3px;overflow-wrap:anywhere}
.flowcard{display:block;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.flowcard{transition:transform .12s,border-color .12s}
.flowcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.flowcard b{display:block;font-size:14px;line-height:1.35}
.flowcard span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.flowcard .meta{display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:7px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.a-user{--c:var(--amber);--cs:var(--amber-soft)}.a-module{--c:var(--accent);--cs:var(--accent-soft)}.a-odoo{--c:var(--teal);--cs:var(--teal-soft)}
.a-other{--c:var(--violet);--cs:var(--violet-soft)}.a-external{--c:var(--rose);--cs:var(--rose-soft)}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);transition:opacity .15s}
.life{display:grid;grid-auto-flow:column;grid-auto-columns:20px;margin-right:10px}
.life i{position:relative;display:block}
.life i::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.life i.on::after{content:"";position:absolute;left:50%;top:22px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.step-card{margin:6px 0;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);border-left:3px solid var(--c);background:var(--surface)}
.step-head{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.step-n{font:600 11.5px var(--mono);color:var(--c)}
.step-card p{color:var(--ink2);max-width:76ch;margin-top:4px}
.step-ref{margin-top:6px}
.tag{font-size:13px;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--sunken);color:var(--ink2)}
.tag b{font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;margin-right:6px;color:var(--muted)}
.tag.guard{background:var(--red-soft)}.tag.guard b{color:var(--red)}
.tag.branch{background:var(--amber-soft)}.tag.branch b{color:var(--amber)}
.quote{display:block;margin-top:5px;padding-left:10px;border-left:2px solid var(--red);font-style:italic;color:var(--ink)}
details.proof{margin-top:9px;font-size:12.5px}
details.proof summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-flex;gap:6px;align-items:center;user-select:none}
details.proof summary::-webkit-details-marker{display:none}
details.proof summary:hover{color:var(--accent)}
details.proof[open] summary{color:var(--accent)}
.prooflist{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.pf{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.pf code{background:var(--code);border:1px solid var(--line)}
.pf .at{white-space:normal;overflow-wrap:anywhere;min-width:0}.pf>*{min-width:0}
.steps.walk .step.future{opacity:.28}.steps.walk .step.cur .step-card{box-shadow:0 0 0 3px var(--cs)}
.walkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
#view:not(.allsteps) .step.side,#view:not(.allsteps) #sig .side,#view:not(.allsteps) .n-all,#view.allsteps .n-main{display:none}
.step.side .step-card{border-style:dashed}#sig .sg{display:contents}
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font:600 13px var(--sans);color:var(--ink2)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.vis{display:flex;flex-direction:column;gap:4px;margin:0;font-size:13px;min-width:200px}
.vis>div{display:flex;flex-wrap:wrap;gap:1px 7px;align-items:baseline}
.vis dt{color:var(--muted)}.vis dd{margin:0;min-width:0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.mapwrap{cursor:grab}.mapwrap.drag{cursor:grabbing;user-select:none}
.mapwrap{position:relative;overflow:auto;background:var(--surface);max-height:560px}
.map{position:relative;transform-origin:0 0}
.map svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.map path{fill:none;stroke:var(--line2);stroke-width:1.4}
.map path.lit{stroke:var(--accent);stroke-width:2}
.map marker path{fill:var(--faint);stroke:none}
.node{position:absolute;display:flex;flex-direction:column;justify-content:center;padding:6px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);font:500 12.5px var(--mono);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:box-shadow .12s,opacity .12s}
.node span,.node small{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.node small{font:400 11px var(--sans);color:var(--muted)}
.node.own{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.node.wizard{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.node.extend{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.node.ref,.node.more{border-style:dashed;color:var(--muted)}
.node.center{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.node.center small,.node.trig small,.node.core small{color:inherit;opacity:.75}
.node.trig{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-family:var(--sans);font-weight:600}
.node.core{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);border-style:dashed}
.node.state{font-family:var(--sans);font-weight:600;font-size:13.5px;color:var(--ink);align-items:center;text-align:center;background:var(--surface)}
.node.state small{font-family:var(--mono)}
.node:hover,.node.lit{box-shadow:0 0 0 3px var(--accent-soft)}
.map.dim .node:not(.lit){opacity:.35}
.elabel{position:absolute;transform:translate(-50%,-50%);font:500 10.5px var(--mono);background:var(--raised);border:1px solid var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2}
.elabel.lit{opacity:1}
.elabel.show{opacity:1;border-color:var(--line2);color:var(--ink2);font-family:var(--sans);font-weight:600}
.states{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-top:8px}
.state{flex:1 1 150px;max-width:260px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface)}
.state b{display:block;font-size:13.5px}.state code{font-size:11.5px}
.state .by{margin-top:6px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.crud{display:inline-flex;gap:3px}
.crud i{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font:600 10px var(--mono);font-style:normal;background:var(--sunken);color:var(--faint)}
.crud i.y{background:var(--green-soft);color:var(--green)}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.input{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13.5px;color:var(--ink);min-width:230px}
.input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.pill{padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font:500 12.5px var(--sans);color:var(--muted)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:8px}
details.fold>summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(-45deg);transition:transform .12s;flex:none}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>.body{border-top:1px solid var(--line);overflow-x:auto}
details.fold>summary>*{min-width:0;overflow-wrap:anywhere}
.code{font:400 12.5px/1.65 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:8px 0;max-height:62vh;tab-size:4}
.code{scrollbar-width:thin}.code-in{display:block;width:max-content;min-width:100%}
.ln{display:block;white-space:pre;padding:0 14px 0 0}
.ln::before{content:attr(data-n);display:inline-block;width:46px;padding-right:12px;text-align:right;color:var(--faint);user-select:none}
.ln.hl{background:var(--hl);box-shadow:inset 3px 0 0 var(--amber)}
.hljs-keyword,.hljs-built_in,.hljs-literal,.hljs-meta{color:var(--k-kw)}.hljs-string,.hljs-doctag{color:var(--k-str)}
.hljs-number{color:var(--k-num)}.hljs-comment{color:var(--k-com);font-style:italic}
.hljs-title,.hljs-function,.hljs-params .hljs-title{color:var(--k-fn)}.hljs-tag,.hljs-name{color:var(--k-tag)}.hljs-attr,.hljs-attribute{color:var(--k-attr)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,96vw);background:var(--raised);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .2s ease;z-index:20;display:flex;flex-direction:column}
#drawer.open{transform:none}
body.dock #app{padding-right:var(--dw)}
body.dock #drawer{width:var(--dw);box-shadow:none;background:var(--surface)}
#dr-grip{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;display:none;z-index:1;touch-action:none}
#dr-grip::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .12s}
#dr-grip:hover::after,body.sizing #dr-grip::after{opacity:.7}
body.dock #dr-grip{display:block}
body.sizing{user-select:none;cursor:col-resize}body.sizing #drawer{transition:none}
.dr-tool{flex:none;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 12px var(--sans);color:var(--muted);white-space:nowrap}
.dr-tool:hover{color:var(--ink);border-color:var(--line2)}.dr-tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.dr-tool[hidden]{display:none}
.dr-body.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
.dr-body.fill>*{flex:none}
.dr-body.fill>.code{flex:0 1 auto;min-height:0;max-height:none;margin-top:8px}
#drawer.wrap .code-in{width:auto}
#drawer.wrap .ln{white-space:pre-wrap;overflow-wrap:anywhere;padding-left:58px;text-indent:-58px}
#drawer.wrap .ln::before{text-indent:0}
.cur{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);border-radius:5px;color:var(--accent-ink)}
.dr-head{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-head .ttl{font:600 14px var(--mono);overflow-wrap:anywhere;flex:1;min-width:0}
.dr-body{padding:16px 18px 40px;overflow:auto;flex:1}
.dr-body h3{margin-top:20px;font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.dr-body h3:first-child{margin-top:0}
.dr-body ol{margin:4px 0 0;padding-left:20px;color:var(--ink2)}.dr-body ol li{margin:2px 0}
.purpose{font-size:15.5px;line-height:1.55;color:var(--ink)}
#palette{position:fixed;inset:0;z-index:40;background:rgba(20,18,14,.34);display:grid;place-items:start center;padding-top:11vh}
#palette[hidden]{display:none}
.pal{width:min(680px,94vw);background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;padding:15px 18px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:16px;color:var(--ink);outline:0}
.pal-res{max-height:56vh;overflow:auto;padding:6px}
.pal-row{display:flex;gap:10px;align-items:baseline;padding:7px 11px;border-radius:8px;cursor:pointer}
.pal-row.on{background:var(--accent-soft)}
.pal-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pal-row .s{color:var(--muted);font-size:12px;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);margin-top:14px}
.tree{font-size:14px}.tree .crumb{color:var(--muted)}.tree .crumb.ext{color:var(--faint)}
.sep{color:var(--faint);margin:0 5px}
/* purpose, idea, result */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.trio-card{border-top:3px solid var(--c);padding-top:13px}
.trio-card .eyebrow{color:var(--c)}
.trio-card p{margin-top:5px;color:var(--ink);font-size:15px;line-height:1.55}
/* the engine: stages in the order things happen */
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:12px 0 4px}
.rail a{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);font:600 12.5px var(--sans);color:var(--ink2)}
.rail a:hover{border-color:var(--accent);color:var(--accent-ink)}
.rail a i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);font-style:normal;background:var(--accent);color:var(--bg)}
.rail .sep{margin:0 1px;color:var(--faint)}
.stages{margin-top:12px}
.stage{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;position:relative;padding-bottom:12px;scroll-margin-top:72px}
.stage::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line2)}
.stage:last-child::before{display:none}
.stage-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--accent);color:var(--bg);position:relative;z-index:1}
.stage-n.sm{display:inline-grid;width:24px;height:24px;font-size:11.5px;vertical-align:2px;margin-right:6px}
.stage-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stage-main p{color:var(--ink2);margin-top:3px;font-size:14px;max-width:70ch}
.stage-side{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stage-side .chip,.variant .chip{white-space:normal;overflow:visible;line-height:1.35;padding:3px 8px}
/* scenarios */
.sc-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;margin-top:18px;align-items:start}
.given{margin:6px 0 0;display:flex;flex-direction:column;gap:7px}
.given>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px}
.given dt{color:var(--muted)}.given dd{margin:0;color:var(--ink)}
.setv{display:inline-flex;gap:5px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.res{width:100%;border-collapse:collapse;margin-top:6px}
.res td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.res tr:first-child td{border-top:0}
.res td{overflow-wrap:break-word}.res .chip{white-space:normal;overflow:visible;text-align:left}
.res td.num{text-align:right;font:600 14.5px var(--mono);font-variant-numeric:tabular-nums;padding-left:12px}
.res td.txt{text-align:right;padding-left:12px;max-width:62%;color:var(--ink)}
.res tr:last-child td{font-weight:650}.res tr:last-child td.num{font-size:16px;color:var(--accent-ink)}.res tr:last-child td.txt{font-weight:500}
.card.out{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.sstep{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative}
.sstep::before{content:"";position:absolute;left:14px;top:36px;bottom:-6px;width:2px;background:var(--line)}
.sstep:last-child::before{display:none}
.sstep-n{width:30px;height:30px;margin-top:14px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);background:var(--accent-soft);color:var(--accent-ink);position:relative;z-index:1}
.calc{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:8px;padding:7px 11px;border-radius:8px;background:var(--code);border:1px solid var(--line);font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.calc b{color:var(--ink);font-weight:600}.calc+.calc{margin-top:4px}
.variant{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1.3fr);gap:10px;align-items:start;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px;font-size:14px}
.variant .ic{color:var(--faint);margin-top:3px}
.sw{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;border:1px dashed var(--line2);font:500 12.5px var(--sans);color:var(--faint)}
.sw.y{border:1px solid transparent;background:var(--green-soft);color:var(--green)}
a.sw.y:hover{border-color:currentColor}
.sw i{font:600 10.5px var(--mono);font-style:normal;opacity:.8}
/* automation matrix */
.mx{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.mx th{font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:10px 6px 8px;text-align:center;white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--surface);z-index:1}
.mx td{padding:5px 6px;border-top:1px solid var(--line);text-align:center}
.mx button{min-width:34px;height:28px;border-radius:8px;font:600 12.5px var(--mono);background:color-mix(in srgb,var(--accent) calc(var(--h)*1%),var(--accent-soft));color:var(--accent-ink);border:2px solid transparent}
.mx button:hover{border-color:var(--accent)}
.mx button.on{background:var(--accent);color:var(--bg)}
.mx th button{min-width:0;height:auto;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:2px 6px;border-radius:6px}
.mx th button.on{background:var(--accent);color:var(--bg)}
.mx .zero{color:var(--line2)}
.evt{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin:16px 0 4px}
.evt a{display:block;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.evt a:hover{border-color:var(--accent)}
.evt a.on{border-color:var(--accent);background:var(--accent-soft)}
.evt b{display:block;font:650 20px/1.15 var(--sans)}.evt span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
/* diagram box */
.dg{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:10px;overflow:hidden;display:flex;flex-direction:column}
.dg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--raised);font-size:12.5px;color:var(--muted)}
.dg-tools{margin-left:auto;display:inline-flex;gap:5px;align-items:center}
.dg-tools button{height:28px;min-width:28px;padding:0 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font:600 12px var(--sans);color:var(--ink2)}
.dg-tools button:hover{border-color:var(--accent);color:var(--accent-ink)}
.dg-pct{font:500 11.5px var(--mono);min-width:40px;text-align:center}
.dg-info{border-top:1px solid var(--line);padding:11px 14px;background:var(--raised)}
.dg-info[hidden]{display:none}
.dg.full{position:fixed;inset:12px;z-index:26;margin:0;box-shadow:0 0 0 100vmax rgba(20,18,14,.45),var(--shadow)}
.dg.full .mapwrap{max-height:none;flex:1}
.mk{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);font:500 12px var(--sans);color:var(--faint);background:none}
.mk i{width:9px;height:9px;border-radius:3px;background:var(--line2)}
.mk.on{color:var(--ink2);border-color:var(--line2)}
.mk.on.own i{background:var(--accent)}.mk.on.wizard i{background:var(--violet)}.mk.on.extend i{background:var(--teal)}.mk.on.ref i{background:var(--faint)}
.map.pinned .node:not(.lit){opacity:.3}
.node.pin{box-shadow:0 0 0 3px var(--accent)}
/* language control and toast */
.langc{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:50;max-width:min(560px,92vw);padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.noscroll{overflow:hidden}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  #nav{position:static;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand-title,.stamp,.nav-group,.nav-foot,.nav-item .n,.nav-item .seen{display:none}
  .brand{margin-right:8px;flex:none}.brand-name{white-space:nowrap}
  #nav-items,#nav-items>div{display:flex;gap:4px;margin:0!important}.nav-item{white-space:nowrap;padding:6px 9px}
  .searchbox .long{display:none}.searchbox .short{display:inline}
  .step{display:block}.at{white-space:normal;overflow-wrap:anywhere}.tbl .at{white-space:nowrap}
  .kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}.kv .bdg{white-space:normal}
  #bar{padding:10px 16px}#view{padding:6px 16px 70px}
  h1{font-size:25px}.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .arch{grid-template-columns:1fr}.arch .arrow{transform:rotate(90deg);padding:4px}
  .life{display:none}
  .trio,.sc-top{grid-template-columns:minmax(0,1fr)}
  .stage{grid-template-columns:26px minmax(0,1fr);gap:9px}.stage-n{width:26px;height:26px;font-size:11.5px}.stage::before{left:12px;top:26px}
  .stage-body{grid-template-columns:minmax(0,1fr);gap:10px}.stage-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}
  .given>div{grid-template-columns:minmax(0,1fr);gap:0}
  .variant{grid-template-columns:minmax(0,1fr)}.variant .ic{transform:rotate(90deg)}
  .langc .lbl{display:none}.input{min-width:0;width:100%}
  .sstep{grid-template-columns:22px minmax(0,1fr);gap:8px}.sstep-n{width:22px;height:22px;font-size:11px}.sstep::before{left:10px}
}
/* same content rules as the 900px block above: the docked source panel can make the main column that narrow on a wide screen */
#main.tight .searchbox .long{display:none}#main.tight .searchbox .short{display:inline}
#main.tight .step{display:block}#main.tight .at{white-space:normal;overflow-wrap:anywhere}#main.tight .tbl .at{white-space:nowrap}
#main.tight .kv{grid-template-columns:minmax(0,1fr)}#main.tight .kv dt{margin-top:6px}#main.tight .kv .bdg{white-space:normal}
#main.tight #bar{padding:10px 16px}#main.tight #view{padding:6px 16px 70px}
#main.tight h1{font-size:25px}#main.tight .g2,#main.tight .g3{grid-template-columns:minmax(0,1fr)}
#main.tight .arch{grid-template-columns:1fr}#main.tight .arch .arrow{transform:rotate(90deg);padding:4px}
#main.tight .life{display:none}
#main.tight .trio,#main.tight .sc-top{grid-template-columns:minmax(0,1fr)}
#main.tight .stage{grid-template-columns:26px minmax(0,1fr);gap:9px}#main.tight .stage-n{width:26px;height:26px;font-size:11.5px}#main.tight .stage::before{left:12px;top:26px}
#main.tight .stage-body{grid-template-columns:minmax(0,1fr);gap:10px}#main.tight .stage-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}
#main.tight .given>div{grid-template-columns:minmax(0,1fr);gap:0}
#main.tight .variant{grid-template-columns:minmax(0,1fr)}#main.tight .variant .ic{transform:rotate(90deg)}
#main.tight .langc .lbl{display:none}#main.tight .input{min-width:0;width:100%}
#main.tight .sstep{grid-template-columns:22px minmax(0,1fr);gap:8px}#main.tight .sstep-n{width:22px;height:22px;font-size:11px}#main.tight .sstep::before{left:10px}
@media (max-width:1180px) and (min-width:901px){#app{grid-template-columns:208px minmax(0,1fr)}#bar{padding:12px 24px}#view{padding:8px 24px 90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="brand">
      <div class="brand-name" id="b-name"></div>
      <div class="brand-title" id="b-title"></div>
      <a class="stamp" data-go="#/about" id="b-stamp" title="What this map was built from"></a>
    </div>
    <div id="nav-items"></div>
    <div class="nav-foot" id="b-foot"></div>
  </nav>
  <div id="main">
    <header id="bar">
      <button class="searchbox" id="search-btn" type="button"><span id="search-ic"></span><span class="long">Search a method, field, button text, message...</span><span class="short">Search</span><kbd>/</kbd></button>
      <div class="bar-right"><span id="lang"></span><button class="iconbtn" id="theme" type="button" title="Light or dark"></button></div>
    </header>
    <div id="view" tabindex="-1"></div>
  </div>
</div>
<aside id="drawer" aria-hidden="true">
  <div id="dr-grip" title="Drag to resize. Double-click for the default width."></div>
  <div class="dr-head"><span id="dr-kind"></span><span class="ttl" id="dr-title"></span><button class="dr-tool" id="dr-copy" type="button" title="Copy the path and line" hidden>Copy</button><button class="dr-tool" id="dr-wrap" type="button" title="Wrap long lines instead of scrolling sideways">Wrap</button><button class="iconbtn" id="dr-close" type="button" title="Close (Esc)"></button></div>
  <div class="dr-body" id="dr-body"></div>

escaped_in_the_chatter","line":112},{"name":"test_settings_address_is_the_live_route","line":117},{"name":"test_token_alone_is_enough","line":121},{"name":"test_wrong_token_is_refused","line":126},{"name":"test_secret_and_token_must_both_match","line":131},{"name":"test_status_of_another_gosms_account_is_ignored","line":141},{"name":"test_status_of_a_company_with_the_same_gosms_account_is_applied","line":146},{"name":"test_inbound_on_a_shared_contact_is_posted_for_the_url_company","line":151}]}]}],"i18n":{"stats":{"ka_GE":{"total":110,"translated":110}},"tr":{"ka_GE":{"\nConnects Odoo to GoSMS.ge: Odoo's own SMS (chatter, SMS Marketing) go out through it, every message is logged in a GoSMS list,\ndelivery reports and replies come back by webhook, and any module can ask for a one-time SMS code before a button runs.\n":"\nOdoo-ს GoSMS.ge-სთან აკავშირებს: Odoo-ს SMS-ები (შეტყობინებების ისტორიიდან და SMS მარკეტინგიდან) მისი მეშვეობით იგზავნება, ყოველი შეტყობინება GoSMS-ის სიაში აისახება,\nმიწოდების შეტყობინებები და პასუხები webhook-ით ბრუნდება, ხოლო ნებისმიერ მოდულს შეუძლია ღილაკის შესრულებამდე SMS-ით ერთჯერადი კოდი მოითხოვოს.\n","%(sent)s of %(total)s SMS sent.":"%(total)s SMS-დან გაიგზავნა %(sent)s.","API Key":"API გასაღები","Add a phone number first: the confirmation code is sent to it by SMS.":"ჯერ მიუთითეთ ტელეფონის ნომერი: დამადასტურებელი კოდი მასზე SMS-ით გაიგზავნება.","Add the GoSMS API key in Settings first.":"ჯერ პარამეტრებში მიუთითეთ GoSMS-ის API გასაღები.","Add the GoSMS sender name in Settings first.":"ჯერ პარამეტრებში მიუთითეთ GoSMS-ის გამგზავნის სახელი.","Attempts Left":"დარჩენილი მცდელობები","Attempts left:":"დარჩენილი მცდელობები:","Check Connection":"კავშირის შემოწმება","Check Status":"სტატუსის შემოწმება","Code":"კოდი","Code sent to %s":"კოდი გაიგზავნა ნომერზე %s","Company":"კომპანია","Configuration":"კონფიგურაცია","Confirm":"დადასტურება","Confirmation Code":"დამადასტურებელი კოდი","Confirmation Codes":"დამადასტურებელი კოდები","Confirmed with the SMS code sent to %s.":"დადასტურებულია ნომერზე %s გაგზავნილი SMS კოდით.","Contact":"კონტაქტი","Deliver Even if Blocked":"ჩაბარდეს ბლოკირებულ ნომრებზეც","Deliver even to numbers that blocked SMS":"ჩაბარდეს იმ ნომრებზეც, რომლებმაც SMS-ები დაბლოკეს","Delivered":"მიწოდებული","Direction":"მიმართულება","Encoding":"კოდირება","Event":"მოვლენა","Expired":"ვადაგასული","Failed":"ვერ გაიგზავნა","GoSMS":"GoSMS","GoSMS API Key":"GoSMS-ის API გასაღები","GoSMS ID":"GoSMS ID","GoSMS cannot find this message. Check that it was sent with this GoSMS account.":"GoSMS ამ შეტყობინებას ვერ პოულობს. შეამოწმეთ, ამ GoSMS ანგარიშით გაიგზავნა თუ არა.","GoSMS cannot set this up: check the sender name, and for SMS codes the OTP settings, on app.gosms.ge.":"GoSMS ამის გამართვას ვერ ახერხებს: შეამოწმეთ გამგზავნის სახელი, ხოლო SMS კოდებისთვის — OTP პარამეტრები app.gosms.ge-ზე.","GoSMS could not be reached. Try again in a minute.":"GoSMS-თან დაკავშირება ვერ მოხერხდა. სცადეთ ერთ წუთში.","GoSMS could not send the code. Try again.":"GoSMS-მა კოდის გაგზავნა ვერ შეძლო. სცადეთ ხელახლა.","GoSMS did not answer in time: the message may have been sent. Check it before sending again.":"GoSMS-მა დროულად არ უპასუხა: შეტყობინება შესაძლოა უკვე გაიგზავნა. ხელახლა გაგზავნამდე შეამოწმეთ ის.","GoSMS did not confirm this message. Check it before sending again.":"GoSMS-მა ეს შეტყობინება არ დაადასტურა. ხელახლა გაგზავნამდე შეამოწმეთ ის.","GoSMS does not accept this phone number. Correct it and try again.":"GoSMS ამ ტელეფონის ნომერს არ იღებს. შეასწორეთ ნომერი და სცადეთ ხელახლა.","GoSMS is connected. SMS balance: %s":"GoSMS დაკავშირებულია. SMS ბალანსი: %s","GoSMS refused the message: the text is too long or a value is missing.":"GoSMS-მა შეტყობინება უარყო: ტექსტი ძალიან გრძელია ან რომელიმე მნიშვნელობა აკლია.","GoSMS refused the request: %s":"GoSMS-მა მოთხოვნა უარყო: %s","GoSMS status: %s.":"GoSMS-ის სტატუსი: %s.","ID":"იდენტიფიკატორი","Incoming":"შემომავალი","Kind":"ტიპი","Message":"შეტყობინება","Messages":"შეტყობინებები","Not Delivered":"მიუწოდებელი","Opt-out Number":"NoSMS ნომერი","Otp Hash":"OTP ჰეში","Outgoing":"გამავალი","Paste this address into Webhook URL and DLR URL on app.gosms.ge.":"ეს მისამართი ჩასვით app.gosms.ge-ზე, Webhook URL-სა და DLR URL-ში.","Phone":"ტელეფონი","Phone Number":"ტელეფონის ნომერი","Phone Numbers":"ტელეფონის ნომრები","Reason":"მიზეზი","Received":"მიღებული","Register Sender Name":"გამგზავნის სახელის რეგისტრაცია","Request":"მოთხოვნა","SMS":"SMS","SMS Code":"SMS კოდი","SMS Code Confirmation":"SMS კოდით დადასტურება","SMS Message":"SMS შეტყობინება","Search Messages":"შეტყობინებების ძიება","Segments":"სეგმენტები","Select one record at a time: each SMS code confirms one record.":"ერთდროულად აირჩიეთ მხოლოდ ერთი ჩანაწერი: თითო SMS კოდი ერთ ჩანაწერს ადასტურებს.","Send":"გაგზავნა","Send Odoo SMS and confirmation codes through GoSMS.ge. For codes, the sender name and how long a code is valid are set in the OTP settings on app.gosms.ge.":"Odoo-ს SMS-ებისა და დამადასტურებელი კოდების გაგზავნა GoSMS.ge-ით. კოდებისთვის გამგზავნის სახელი და კოდის მოქმედების ვადა app.gosms.ge-ის OTP პარამეტრებში მიეთითება.","Send Odoo SMS through GoSMS":"Odoo-ს SMS-ების GoSMS-ით გაგზავნა","Send SMS":"SMS-ის გაგზავნა","Send SMS, receive replies and confirm actions with one-time codes through GoSMS.ge":"SMS-ების გაგზავნა, პასუხების მიღება და მოქმედებების ერთჯერადი კოდით დადასტურება GoSMS.ge-ის მეშვეობით","Send a New Code":"ახალი კოდის გაგზავნა","Sender Name":"გამგზავნის სახელი","Sent":"გაგზავნილი","Separate the numbers with commas.":"ნომრები ერთმანეთისგან მძიმით გამოყავით.","Settings":"პარამეტრები","Sms Uuid":"SMS-ის UUID","Status":"სტატუსი","The GoSMS API key is wrong or missing. Fix it in Settings.":"GoSMS-ის API გასაღები არასწორია ან არ არის მითითებული. შეასწორეთ ის პარამეტრებში.","The GoSMS SMS balance is used up. Top it up on app.gosms.ge.":"GoSMS-ის SMS ბალანსი ამოიწურა. შეავსეთ ის app.gosms.ge-ზე.","The GoSMS sender name is not registered or not active. Check it on app.gosms.ge.":"GoSMS-ის გამგ :"tools/sms_api.py::_failed","model":null,"cls":"","name":"_failed","file":"tools/sms_api.py","line":27,"def_line":27,"end":28,"args":"uuids, state, reason=False","writes":{"state":[]},"hash":"d75535f674a151eb","called_by":["tools/sms_api.py::SmsApiGosms._send_sms_batch"],"kind":"helper"},{"id":"tools/sms_api.py::SmsApiGosms._send_sms_batch","model":null,"cls":"SmsApiGosms","name":"_send_sms_batch","file":"tools/sms_api.py","line":34,"def_line":34,"end":91,"args":"self, messages, delivery_reports_url=False","doc":"One result per uuid. Rows and log are written here too: direct callers (the SMS Marketing test) skip core's result handling.","strings":[{"text":"GoSMS did not confirm this message. Check it before sending again.","line":90},{"text":"Add the GoSMS sender name in Settings first.","line":39}],"sudo":[36,40],"writes":{"state":["sent"]},"env":["sms.sms"],"hash":"186d192ae1dbb2b4","calls":[{"to":"tools/sms_api.py::SmsApiGosms._save_results","name":"_save_results","line":91,"via":"name"},{"to":"tools/sms_api.py::_failed","name":"_failed","line":90,"via":"name"},{"to":"models/res_company.py::ResCompany._gosms_request","name":"_gosms_request","line":69,"via":"name"}],"kind":"helper"},{"id":"tools/sms_api.py::SmsApiGosms._save_results","model":null,"cls":"SmsApiGosms","name":"_save_results","file":"tools/sms_api.py","line":93,"def_line":93,"end":118,"args":"self, results","sudo":[101],"writes":{"state":[],"failure_type":[]},"creates":["gosms.message"],"env":["gosms.message","sms.sms"],"hash":"2ad5af8f62454f2d","called_by":["tools/sms_api.py::SmsApiGosms._send_sms_batch"],"kind":"helper"}],"files":{"__init__.py":{"sha":"d1c488929d0fdb04","lines":4,"text":"from . import controllers\nfrom . import models\nfrom .models.gosms_confirm_wizard import gosms_confirm\n"},"__manifest__.py":{"sha":"ceeba559c919db97","lines":27,"text":"{\n    'name': 'GoSMS',\n    'summary': 'Send SMS, receive replies and confirm actions with one-time codes through GoSMS.ge',\n    'description': \"\"\"\nConnects Odoo to GoSMS.ge: Odoo's own SMS (chatter, SMS Marketing) go out through it, every message is logged in a GoSMS list,\ndelivery reports and replies come back by webhook, and any module can ask for a one-time SMS code before a button runs.\n\"\"\",\n    'version': '20.0.1.0.0',\n    'category': 'Marketing/Email Marketing',\n    'author': 'GEC-Business Growth Services',\n    'license': 'LGPL-3',\n    'depends': [\n        'base_setup',\n        'sms',\n    ],\n    'data': [\n        'views/res_config_settings_views.xml',\n        'views/gosms_message_views.xml',\n        'views/gosms_send_wizard_views.xml',\n        'views/gosms_confirm_wizard_views.xml',\n        'views/gosms_menus.xml',\n        'security/ir.access.csv',\n    ],\n    'installable': True,\n    'application': True,\n}\n"},"controllers/__init__.py":{"sha":"e0a16a10fd901c56","lines":2,"text":"from . import main\n"},"controllers/main.py":{"sha":"87eec8156f5bdc94","lines":66,"text":"import hashlib\nimport hmac\nimport json\nimport logging\nimport re\n\nfrom odoo.http import Controller, request, route\n\n_logger = logging.getLogger(__name__)\n\n\nclass GosmsController(Controller):\n\n    @route('/gosms/webhook/\u003cint:company_id>', type='http', auth='public', methods=['POST'], csrf=False)\n    def gosms_webhook(self, company_id):\n        # sudo: the caller is the public user, GoSMS; the secret or token check below is the only one\n        company = request.env['res.company'].sudo().browse(company_id).exists()\n        if not company or not self._validate_request(company):\n            _logger.warning(\"GoSMS webhook: could not validate the call for company id=%s\", company_id)\n            raise request.not_found()\n        payload = json.loads(request.httprequest.get_data())\n        messages = request.env['gosms.message'].sudo()  # sudo: the log is for administrators, the call is already authenticated\n        if payload['event'] == 'delivery_status':\n            # GoSMS message ids are account-wide and one key may serve several companies: search the companies of this key, not other accounts\n            companies = company.search([('gosms_api_key', '=', company.gosms_api_key)]) if company.gosms_api_key else company\n            message = messages.search([('gosms_id', '=', str(payload['messageId'])), ('company_id', 'in', companies.ids)])\n            if message:\n                message._gosms_set_status(payload['status'])\n            else:\n                _logger.info(\"GoSMS webhook: no message with GoSMS id %s\", payload['messageId'])\n        elif payload['event'] == 'inbound' and not messages.search_count([('company_id', '=', company.id), ('event_id', '=', payload['eventId'])]):\n            phone = company._phone_format(number='+' + payload['from'])\n            partners = request.env['res.partner'].sudo()  # sudo: the sender is matched to contacts the public user cannot read\n            if phone:\n                partners = partners.search([('phone_sanitized', '=', phone), ('company_id', 'in', [company.id, False])], limit=2)\n            partner = partners if len(partners) == 1 else partners.browse()\n            messages.create({\n                'company_id': company.id,\n                'direction': 'inbound',\n                'number': phone or payload['from'],\n                'partner_id': partner.id,\n                'body': payload['text'],\n                'state': 'received',\n                'event_id': payload['eventId'],\n            })\n            if partner:\n                partner.with_company(company).message_post(body=payload['text'], author_id=partner.id, message_type='comment',\n                    subtype_xmlid='mail.mt_comment')\n        return 'OK'\n\n    def _validate_request(self, company):\n        \"\"\"A call is valid when the secret or the token is set and every one that is set matches.\"\"\"\n        secret, token = company.gosms_webhook_secret, company.gosms_webhook_token\n        headers, body = request.httprequest.headers, request.httprequest.get_data()\n        checks = []\n        if token:\n            checks.append(hmac.compare_digest(token.encode(), headers.get('X-Webhook-Token', '').encode()))\n        if secret:\n            match = re.fullmatch(r't=(\\d+),v1=([0-9a-f]+)', headers.get('X-Webhook-Signature', ''))\n            if match:\n                signed = f'{match[1]}.'.encode() + body\n                checks.append(hmac.compare_digest(hmac.digest(secret.encode(), signed, hashlib.sha256).hex(), match[2]))\n            else:\n                checks.append(False)\n        return bool(checks) and all(checks)\n"},"i18n/ka_GE.po":{"sha":"182c7c34ab59d606","lines":610},"models/__init__.py":{"sha":"d2cb7c9717de7006","lines":8,"text":"from . import res_company\nfrom . import res_config_settings\nfrom . import gosms_confirm_wizard\nfrom . import gosms_message\nfrom . import gosms_send_wizard\nfrom . import sms_composer\nfrom . import sms_sms\n"},"models/gosms_confirm_wizard.py":{"sha":"776545d48dff4e37","lines":106,"text":"import json\nfrom contextvars import ContextVar\nfrom functools import wraps\n\nfrom odoo import fields, models\nfrom odoo.addons.base.models.res_users import _jsonable\nfrom odoo.exceptions import UserError\nfrom odoo.http import request\n\n_confirmed = ContextVar('gec_gosms_confirmed', default=None)\n\n\ndef gosms_confirm(phone_path):\n    \"\"\"Run the button only after the user types the SMS code sent to ``phone_path`` (one phone, through many2one fields).\n\n    Users who click must not be able to edit that phone. Decorate your own buttons only: the dialog calls the method again.\"\"\"\n    def decorator(fn):\n        @wraps(fn)\n        def wrapped(self, *args, **kwargs):\n            if _confirmed.get() == (self._name, tuple(self.ids), fn.__name__):\n                return fn(self, *args, **kwargs)\n            if not request:\n                raise UserError(self.env._(\"This action needs an SMS code, so it can only be run from the Odoo screen.\"))\n            if len(self) != 1:\n                raise UserError(self.env._(\"Select one record at a time: each SMS code confirms one record.\"))\n            numbers = self.mapped(phone_path)\n            if len(numbers) != 1 or not numbers[0]:\n                raise UserError(self.env._(\"Add a phone number first: the confirmation code is sent to it by SMS.\"))\n            phone = self._phone_format(number=numbers[0])\n            if not phone:\n                raise UserError(self.env._(\"The phone number %s is not valid. Correct it and try again.\", numbers[0]))\n            phone = phone.lstrip('+')\n            company = self._mail_get_companies(default=self.env.company)[self.id]\n            otp = company._gosms_send_code(phone)\n            # sudo: request, phone and hash are NO_ACCESS so users cannot change where the code goes, as in core identitycheck\n            wizard = self.env['gosms.confirm.wizard'].sudo().create({\n                'request': json.dumps([{k: v for k, v in self.env.context.items() if _jsonable(v)}, self._name, self.ids, fn.__name__, args, kwargs]),\n                'company_id': company.id,\n                'phone': phone,\n                'otp_hash': otp['hash'],\n                'attempts_left': otp.get('rate_limit_remaining'),\n            })\n            return wizard._gosms_action()\n        wrapped._gosms_confirm = True\n        return wrapped\n    return decorator\n\n\nclass GosmsConfirmWizard(models.TransientModel):\n    _name = 'gosms.confirm.wizard'\n    _description = \"SMS Code Confirmation\"\n\n    request = fields.Char(readonly=True, groups=fields.NO_ACCESS)\n    company_id = fields.Many2one('res.company', readonly=True, ondelete='cascade', groups=fields.NO_ACCESS)\n    phone = fields.Char(readonly=True, groups=fields.NO_ACCESS)\n    otp_hash = fields.Char(readonly=True, groups=fields.NO_ACCESS)\n    attempts_left = fields.Integer(readonly=True)\n    code = fields.Char(store=False)\n\n    def _gosms_action(self):\n        return {\n            'type': 'ir.actions.act_window',\n            'res_model': self._name,\n            'res_id': self.id,\n            'name': self.env._(\"Code sent to %s\", self._phone_format(number=f'+{self.phone}', force_format='INTERNATIONAL')),\n            'target': 'new',\n            'views': [(False, 'form')],\n            'context': {'dialog_size': 'medium'},\n        }\n\n    def action_resend(self):\n        self.ensure_one()\n        self.check_access('read')\n        wizard = self.sudo()  # sudo: the hash is NO_ACCESS; the check above limits this to the user's own dialog\n        otp = wizard.company_id._gosms_send_code(wizard.phone)\n        wizard.write({'otp_hash': otp['hash'], 'attempts_left': otp.get('rate_limit_remaining')})\n        return wizard._gosms_action()\n\n    def action_confirm(self):\n        self.ensure_one()\n        self.check_access('read')\n        code = self.env.context.get('gosms_code')\n        if not code:\n            raise UserError(self.env._(\"Type the code from the SMS first.\"))\n        wizard = self.sudo()  # sudo: request, phone and hash are NO_ACCESS; the check above limits this to the user's own dialog\n        answer = wizard.company_id._gosms_check_code(wizard.phone, wizard.otp_hash, code)\n        if not answer['verify']:\n            left = answer.get('rate_limit_remaining')\n            if left is None:\n                raise UserError(self.env._(\"The code is wrong. Check the SMS and try again.\"))\n            raise UserError(self.env._(\"The code is wrong. Attempts left: %s.\", left))\n        wizard.otp_hash = False\n        ctx, model, ids, method, args, kwargs = json.loads(wizard.request)\n        records = self.env(context=ctx)[model].browse(ids)\n        action = getattr(records, method)\n        assert getattr(action, '_gosms_confirm', False)\n        token = _confirmed.set((model, tuple(ids), method))\n        try:\n            result = action(*args, **kwargs)\n        finally:\n            _confirmed.reset(token)\n        if isinstance(records, self.pool['mail.thread']):\n            phone = self._phone_format(number=f'+{wizard.phone}', force_format='INTERNATIONAL')\n            records._message_log_batch(dict.fromkeys(records.ids, self.env._(\"Confirmed with the SMS code sent to %s.\", phone)))\n        return result\n"},"models/gosms_message.py":{"sha":"e657911d0799718c","lines":58,"text":"from odoo import fields, models\n\nSTATUS_TO_STATE = {'DELIVERED': 'delivered', 'EXPIRED': 'expired', 'UNDELIVERED': 'undelivered'}\nSTATUS_TO_PROVIDER_ERROR = {'EXPIRED': 'expired', 'UNDELIVERED': 'not_delivered'}\n\n\nclass GosmsMessage(models.Model):\n    _name = 'gosms.message'\n    _description = \"SMS Message\"\n    _order = 'id desc'\n    _rec_name = 'number'\n\n    company_id = fields.Many2one('res.company', required=True, index=True, ondelete='cascade', default=lambda self: self.env.company)\n    kind = fields.Selection([('sms', \"SMS\"), ('code', \"Confirmation Code\")], required=True, readonly=True, default='sms')\n    direction = fields.Selection([('outgoing', \"Outgoing\"), ('inbound', \"Incoming\")], required=True, readonly=True)\n    number = fields.Char(\"Phone Number\", readonly=True)\n    partner_id = fields.Many2one('res.partner', \"Contact\", readonly=True, ondelete='set null')\n    body = fields.Text(\"Message\", readonly=True)\n    state = fields.Selection([\n        ('sent', \"Sent\"),\n        ('delivered', \"Delivered\"),\n        ('expired', \"Expired\"),\n        ('undelivered', \"Not Delivered\"),\n        ('error', \"Failed\"),\n        ('received', \"Received\"),\n    ], \"Status\", readonly=True)\n    failure_reason = fields.Char(\"Reason\", readonly=True)\n    segments = fields.Integer(readonly=True)\n    encoding = fields.Char(readonly=True)\n    gosms_id = fields.Char(\"GoSMS ID\", index=True, readonly=True)\n    event_id = fields.Char(readonly=True)\n    sms_uuid = fields.Char(index=True, readonly=True)\n\n    _company_event_unique = models.Constraint('unique(company_id, event_id)', \"This message was already received.\")\n\n    def _gosms_set_status(self, status):\n        if status not in STATUS_TO_STATE:\n            return\n        self.state = STATUS_TO_STATE[status]\n        trackers = self.env['sms.tracker'].search([('sms_uuid', 'in', self.mapped('sms_uuid'))])\n        if status in STATUS_TO_PROVIDER_ERROR:\n            trackers._action_update_from_provider_error(STATUS_TO_PROVIDER_ERROR[status])\n        else:\n            trackers._action_update_from_sms_state('sent')\n\n    def action_check_status(self):\n        self.ensure_one()\n        status = self.company_id._gosms_call('checksms', {'messageId': int(self.gosms_id)})['status']\n        self._gosms_set_status(status)\n        return {\n            'type': 'ir.actions.client',\n            'tag': 'display_notification',\n            'params': {\n                'type': 'info',\n                'message': self.env._(\"GoSMS status: %s.\", status),\n            },\n        }\n"},"models/gosms_send_wizard.py":{"sha":"8e3f738310863897","lines":39,"text":"from odoo import fields, models\nfrom odoo.exceptions import UserError\n\n\nclass GosmsSendWizard(models.TransientModel):\n    _name = 'gosms.send.wizard'\n    _description = \"Send SMS\"\n\n    numbers = fields.Char(\"Phone Numbers\", help=\"Separate the numbers with commas.\")\n    body = fields.Text(\"Message\")\n    urgent = fields.Boolean(\"Deliver even to numbers that blocked SMS\", help=\"Use it only for messages that must arrive, such as security alerts.\")\n\n    def action_send(self):\n        self.ensure_one()\n        if not self.env.company.gosms_sms_enabled:\n            raise UserError(self.env._('Turn on \"Send Odoo SMS through GoSMS\" in Settings first.'))\n        composer = self.env['sms.composer'].new({'composition_mode': 'numbers', 'numbers': self.numbers})\n        # sudo: sms.sms is system-only, as in the core composer\n        sms = self.env['sms.sms'].sudo().create([{\n            'number': number,\n            'body': self.body,\n            'gosms_urgent': self.urgent,\n        } for number in composer.sanitized_numbers.split(',')])\n        sms.send()\n        failed = sms.filtered(lambda sms: sms.state == 'error')\n        message = self.env._(\"%(sent)s of %(total)s SMS sent.\", sent=len(sms) - len(failed), total=len(sms))\n        # sudo: the message log is for administrators, every user who sends needs the reason\n        domain = [('sms_uuid', 'in', failed.mapped('uuid')), ('failure_reason', '!=', False)]\n        reason = self.env['gosms.message'].sudo().search(domain, limit=1, order='id').failure_reason\n        return {\n            'type': 'ir.actions.client',\n            'tag': 'display_notification',\n            'params': {\n                'type': 'warning' if failed else 'success',\n                'message': f'{message} {reason}' if reason else message,\n                'next': {'type': 'ir.actions.act_window_close'},\n            },\n        }\n"},"models/res_company.py":{"sha":"3a796936ee297a55","lines":77,"text":"import logging\nimport math\n\nimport requests\n\nfrom odoo import fields, models\nfrom odoo.addons.gec_gosms.tools.sms_api import GOSMS_ERRORS, SmsApiGosms\nfrom odoo.exceptions import UserError\n\n_logger = logging.getLogger(__name__)\n\nGOSMS_URL = 'https://api.gosms.ge/api'\nGOSMS_TIMEOUT = 15\nGOSMS_RATE_HEADERS = {'X-RateLimit-Remaining': 'rate_limit_remaining', 'Retry-After': 'retry_after'}\n\n\nclass ResCompany(models.Model):\n    _inherit = 'res.company'\n\n    gosms_api_key = fields.Char(\"GoSMS API Key\", groups='base.group_system', copy=False)\n    gosms_sms_enabled = fields.Boolean(\"Send Odoo SMS through GoSMS\")\n    gosms_sender = fields.Char(\"Sender Name\")\n    gosms_nosms_number = fields.Char(\"Opt-out Number\")\n    gosms_webhook_secret = fields.Char(\"Webhook Secret\", groups='base.group_system', copy=False)\n    gosms_webhook_token = fields.Char(\"Webhook Token\", groups='base.group_system', copy=False)\n\n    def _get_sms_api_class(self):\n        self.ensure_one()\n        if self.gosms_sms_enabled:\n            return SmsApiGosms\n        return super()._get_sms_api_class()\n\n    def _gosms_request(self, endpoint, payload):\n        self.ensure_one()\n        api_key = self.sudo().gosms_api_key  # sudo: the key is admin-only, every user who confirms or sends needs it\n        if not api_key:\n            raise UserError(self.env._(\"Add the GoSMS API key in Settings first.\"))\n        try:\n            response = requests.post(f'{GOSMS_URL}/{endpoint}', json={'api_key': api_key, **payload}, timeout=GOSMS_TIMEOUT)\n            data = response.json()\n        except requests.RequestException as error:\n            _logger.warning(\"GoSMS %s failed: %s\", endpoint, error)\n            if isinstance(error, requests.ReadTimeout):\n                raise UserError(self.env._(\"GoSMS did not answer in time: the message may have been sent. Check it before sending again.\")) from error\n            raise UserError(self.env._(\"GoSMS could not be reached. Try again in a minute.\")) from error\n        data.update({key: int(response.headers[header]) for header, key in GOSMS_RATE_HEADERS.items() if response.headers.get(header, '').isdigit()})\n        return data\n\n    def _gosms_call(self, endpoint, payload):\n        data = self._gosms_request(endpoint, payload)\n        if not data.get('success'):\n            code = data.get('errorCode')\n            minutes = math.ceil(data.get('retry_after', 0) / 60)\n            if minutes and code == 109:\n                raise UserError(self.env._(\"Too many codes were requested. Wait %s minutes, then send a new code.\", minutes))\n            if minutes and code == 110:\n                raise UserError(self.env._(\"Too many failed attempts: GoSMS has paused codes. Try again in %s minutes.\", minutes))\n            message = GOSMS_ERRORS.get(code)\n            raise UserError(self.env._(message) if message else self.env._(\"GoSMS refused the request: %s\", data.get('message')))\n        return data\n\n    def _gosms_send_code(self, phone):\n        \"\"\"Send a one-time code to ``phone`` (995XXXXXXXXX) and log it; the answer holds the ``hash`` that ``_gosms_check_code`` needs.\"\"\"\n        answer = self._gosms_call('otp/send', {'phone': phone})\n        # sudo: users who confirm an action have no rights on the message log\n        self.env['gosms.message'].sudo().create({\n            'company_id': self.id,\n            'direction': 'outgoing',\n            'kind': 'code',\n            'number': f'+{phone}',\n            'state': 'sent',\n        })\n        return answer\n\n    def _gosms_check_code(self, phone, code_hash, code):\n        return self._gosms_call('otp/verify', {'phone': phone, 'hash': code_hash, 'code': code})\n"},"models/res_config_settings.py":{"sha":"f561e94d1152e2ef","lines":38,"text":"from odoo import api, fields, models\nfrom odoo.tools.urls import urljoin as url_join\n\n\nclass ResConfigSettings(models.TransientModel):\n    _inherit = 'res.config.settings'\n\n    gosms_api_key = fields.Char(related='company_id.gosms_api_key', readonly=False)\n    gosms_sms_enabled = fields.Boolean(related='company_id.gosms_sms_enabled', readonly=False)\n    gosms_sender = fields.Char(related='company_id.gosms_sender', readonly=False)\n    gosms_nosms_number = fields.Char(related='company_id.gosms_nosms_number', readonly=False)\n    gosms_webhook_secret = fields.Char(related='company_id.gosms_webhook_secret', readonly=False)\n    gosms_webhook_token = fields.Char(related='company_id.gosms_webhook_token', readonly=False)\n    gosms_webhook_url = fields.Char(\"Webhook URL\", compute='_compute_gosms_webhook_url')\n\n    @api.depends('company_id')\n    def _compute_gosms_webhook_url(self):\n        for settings in self:\n            settings.gosms_webhook_url = url_join(settings.company_id.get_base_url(), f'/gosms/webhook/{settings.company_id.id}')\n\n    def _gosms_notify_success(self, message):\n        return {\n            'type': 'ir.actions.client',\n            'tag': 'display_notification',\n            'params': {\n                'type': 'success',\n                'message': message,\n            },\n        }\n\n    def action_gosms_check_connection(self):\n        balance = self.company_id._gosms_call('sms-balance', {})['balance']\n        return self._gosms_notify_success(self.env._(\"GoSMS is connected. SMS balance: %s\", balance))\n\n    def action_gosms_register_sender(self):\n        self.company_id._gosms_call('sender', {'name': self.gosms_sender})\n        return self._gosms_notify_success(self.env._(\"The sender name %s is registered on GoSMS.\", self.gosms_sender))\n"},"models/sms_composer.py":{"sha":"9d50f31d6d304f03","lines":17,"text":"from odoo import models\n\n\nclass SmsComposer(models.TransientModel):\n    _inherit = 'sms.composer'\n\n    def _prepare_mass_sms_values(self, records):\n        results = super()._prepare_mass_sms_values(records)\n        for record in records:\n            company = self.env.company\n            if \"company_id\" in record._fields:\n                company = record.company_id\n            elif \"record_company_id\" in record._fields:\n                company = record.record_company_id\n            results[record.id][\"record_company_id\"] = company.id\n        return results\n"},"models/sms_sms.py":{"sha":"ca80a6dc316a8fd9","lines":48,"text":"from collections import defaultdict\n\nfrom odoo import api, fields, models\n\n\nclass SmsSms(models.Model):\n    _inherit = 'sms.sms'\n\n    record_company_id = fields.Many2one('res.company', 'Company', ondelete='set null')\n    gosms_urgent = fields.Boolean(\"Deliver Even if Blocked\", copy=False)\n\n    @api.model_create_multi\n    def create(self, vals_list):\n        for vals in vals_list:\n            vals['record_company_id'] = vals.get('record_company_id') or self.env.company.id\n        return super().create(vals_list)\n\n    def _split_by_api(self):\n        sms_by_company = defaultdict(lambda: self.env['sms.sms'])\n        todo_via_super = self.browse()\n        for sms in self:\n            sms_by_company[sms._get_sms_company()] += sms\n        for company, company_sms in sms_by_company.items():\n            if company.gosms_sms_enabled:\n                sms_api = company._get_sms_api_class()(self.env)\n                sms_api._set_company(company)\n                yield sms_api, company_sms\n            else:\n                todo_via_super += company_sms\n        if todo_via_super:\n            yield from super(SmsSms, todo_via_super)._split_by_api()\n\n    def _get_sms_company(self):\n        return self.mail_message_id.record_company_id or self.record_company_id or super()._get_sms_company()\n\n    def _get_send_batch_size(self):\n        # the cron calls this on an empty recordset: look at every company, sudo because the cron is not limited to its own\n        companies = self._get_sms_company() if self else self.env['res.company'].sudo().search([('gosms_sms_enabled', '=', True)], limit=1)\n        if any(companies.mapped('gosms_sms_enabled')):\n            return self.env['ir.config_parameter'].sudo().get_int('gec_gosms.session.batch.size') or 10\n        return super()._get_send_batch_size()\n\n    def _handle_call_result_hook(self, results):\n        \"\"\"The core hook reads every result, not only its records: a GoSMS \"no credit\" result must not open the Odoo credit notice.\"\"\"\n        other_sms = self - self.filtered(lambda sms: sms._get_sms_company().gosms_sms_enabled)\n        other_uuids = set(other_sms.mapped('uuid'))\n        super(SmsSms, other_sms)._handle_call_result_hook([result for result in results if result['uuid'] in other_uuids])\n"},"security/ir.access.csv":{"sha":"ae8f975571f1e693","lines":8,"text":"id,name,model_id,group_id/id,operation,domain\naccess_gosms_confirm_wizard_user,gosms.confirm.wizard user,gosms.confirm.wizard,base.group_user,cru,\ngosms_confirm_wizard_own,SMS code dialog: own records only,gosms.confirm.wizard,,crud,\"[('create_uid', '=', user.id)]\"\naccess_gosms_send_wizard_user,gosms.send.wizard user,gosms.send.wizard,base.group_user,cru,\ngosms_send_wizard_own,SMS screen: own records only,gosms.send.wizard,,crud,\"[('create_uid', '=', user.id)]\"\naccess_gosms_message_system,gosms.message system,gosms.message,base.group_system,crud,\ngosms_message_company,SMS message: own companies only,gosms.message,,crud,\"[('company_id', 'in', company_ids)]\"\n"},"tests/__init__.py":{"sha":"b1158ac5f0fee125","lines":5},"tests/common.py":{"sha":"e00dcf983880035a","lines":60},"tests/test_gosms_code.py":{"sha":"2bffb6a442734628","lines":58},"tests/test_gosms_confirm.py":{"sha":"81ec3e7da8467243","lines":207},"tests/test_gosms_sms.py":{"sha":"a4372fce79f5b71f","lines":318},"tests/test_gosms_webhook.py":{"sha":"55b2885383bb8a6d","lines":156},"tools/__init__.py":{"sha":"359951a5a4d1f2ce","lines":2,"text":"from . import sms_api\n"},"tools/sms_api.py":{"sha":"7ac6dc91ad0c9e41","lines":119,"text":"from odoo.addons.sms.tools.sms_api import SmsApiBase\nfrom odoo.exceptions import UserError\nfrom odoo.tools.translate import LazyTranslate\n\n_lt = LazyTranslate(__name__)\n\nGOSMS_ERRORS = {\n    100: _lt(\"The GoSMS API key is wrong or missing. Fix it in Settings.\"),\n    101: _lt(\"The GoSMS sender name is not registered or not active. Check it on app.gosms.ge.\"),\n    102: _lt(\"The GoSMS SMS balance is used up. Top it up on app.gosms.ge.\"),\n    103: _lt(\"GoSMS refused the message: the text is too long or a value is missing.\"),\n    104: _lt(\"GoSMS cannot find this message. Check that it was sent with this GoSMS account.\"),\n    105: _lt(\"GoSMS does not accept this phone number. Correct it and try again.\"),\n    106: _lt(\"GoSMS could not send the code. Try again.\"),\n    107: _lt(\"This sender name already exists on GoSMS. Check it on app.gosms.ge.\"),\n    108: _lt(\"GoSMS cannot set this up: check the sender name, and for SMS codes the OTP settings, on app.gosms.ge.\"),\n    109: _lt(\"Too many codes were requested. Wait a few minutes, then send a new code.\"),\n    110: _lt(\"Too many failed attempts: GoSMS has paused codes for a while. Try again later.\"),\n    111: _lt(\"The code has expired. Send a new code.\"),\n    112: _lt(\"This code was already used. Send a new code.\"),\n    113: _lt(\"The opt-out number is not valid or not set up on GoSMS. Check it on app.gosms.ge.\"),\n}\nGOSMS_FAILED = 'gosms_failed'\nGOSMS_CODE_TO_STATE = {102: 'insufficient_credit', 105: 'wrong_number_format'}\n\n\ndef _failed(uuids, state, reason=False):\n    return [{'uuid': uuid, 'state': state, 'failure_reason': reason} for uuid in uuids]\n\n\nclass SmsApiGosms(SmsApiBase):\n    PROVIDER_TO_SMS_FAILURE_TYPE = SmsApiBase.PROVIDER_TO_SMS_FAILURE_TYPE | {'insufficient_credit': 'sms_credit'}\n\n    def _send_sms_batch(self, messages, delivery_reports_url=False):\n        \"\"\"One result per uuid. Rows and log are written here too: direct callers (the SMS Marketing test) skip core's result handling.\"\"\"\n        company = self.company.sudo()  # sudo: sender and opt-out number are settings read for every user who sends\n        uuids = [info['uuid'] for message in messages for info in message['numbers']]\n        if not company.gosms_sender:\n            return self._save_results(_failed(uuids, GOSMS_FAILED, self.env._(\"Add the GoSMS sender name in Settings first.\")))\n        urgent_uuids = set(self.env['sms.sms'].sudo().search_fetch([('uuid', 'in', uuids), ('gosms_urgent', '=', True)], ['uuid']).mapped('uuid'))\n        results = []\n        calls = []\n        for message in messages:\n            recipients = []\n            for info in message['numbers']:\n                number = info['number'] and company._phone_format(number=info['number'])  # no number: _phone_format would take the company's own\n                if number:\n                    recipients.append((number.lstrip('+'), info['uuid']))\n                else:\n                    results += _failed([info['uuid']], 'wrong_number_format')\n            for urgent in (False, True):\n                group = [(number, uuid) for number, uuid in recipients if (uuid in urgent_uuids) == urgent]\n                if group:\n                    calls.append((message, group, urgent))\n        for message, recipients, urgent in calls:\n            numbers = [number for number, _uuid in recipients]\n            uuids = [uuid for _number, uuid in recipients]\n            marketing = message.get('sms_type') == 'marketing'\n            payload = {'from': company.gosms_sender, 'text': message['content']}\n            if urgent:\n                payload['urgent'] = True\n            if len(numbers) == 1 and not marketing:\n                endpoint, payload['to'] = 'sendsms', numbers[0]\n            else:\n                endpoint, payload['to'] = 'sendbulk', numbers\n                if marketing and company.gosms_nosms_number:\n                    payload['noSmsNumber'] = company.gosms_nosms_number\n            try:\n                data = company._gosms_request(endpoint, payload)\n            except UserError as error:\n                results += _failed(uuids, 'server_error', error.args[0])\n                continue\n            if not data.get('success'):\n                code = data.get('errorCode')\n                reason = self.env._(GOSMS_ERRORS[code]) if code in GOSMS_ERRORS else data.get('message')\n                results += _failed(uuids, GOSMS_CODE_TO_STATE.get(code, GOSMS_FAILED), reason)\n                continue\n            sent = {'state': 'sent', 'gosms_segments': data.get('segment'), 'gosms_encoding': data.get('encode')}\n            answers = [{**data, 'to': numbers[0]}] if endpoint == 'sendsms' else data.get('messages') or []\n            uuids_by_number = {}\n            for number, uuid in recipients:\n                uuids_by_number.setdefault(number, []).append(uuid)\n            for answer in answers:\n                pending = uuids_by_number.get(answer.get('to'))\n                if pending and not answer.get('success'):\n                    results += _failed([pending.pop(0)], GOSMS_FAILED, answer.get('error'))\n                elif pending and answer.get('messageId'):\n                    results.append({'uuid': pending.pop(0), 'gosms_message_id': str(answer['messageId']), **sent})\n            missing = [uuid for waiting in uuids_by_number.values() for uuid in waiting]\n            results += _failed(missing, 'server_error', self.env._(\"GoSMS did not confirm this message. Check it before sending again.\"))\n        return self._save_results(results)\n\n    def _save_results(self, results):\n        failure_types = self.PROVIDER_TO_SMS_FAILURE_TYPE\n        values_by_uuid = {}\n        for result in results:\n            state = result['state']\n            values_by_uuid[result['uuid']] = ('pending', False) if state == 'sent' else ('error', failure_types.get(state, 'unknown'))\n        results_by_uuid = {result['uuid']: result for result in results}\n        # sudo: sms.sms and the message log are system-only, regular users send SMS\n        sms_rows = self.env['sms.sms'].sudo().search([('uuid', 'in', list(results_by_uuid))])\n        outgoing = sms_rows.filtered(lambda sms: sms.state == 'outgoing')\n        for (state, failure_type), group in outgoing.grouped(lambda sms: values_by_uuid[sms.uuid]).items():\n            group.write({'state': state, 'failure_type': failure_type})\n        sms_rows.env['gosms.message'].create([{\n            'company_id': self.company.id,\n            'direction': 'outgoing',\n            'number': sms.number,\n            'partner_id': sms.partner_id.id,\n            'body': sms.body,\n            'sms_uuid': sms.uuid,\n            'gosms_id': results_by_uuid[sms.uuid].get('gosms_message_id'),\n            'segments': results_by_uuid[sms.uuid].get('gosms_segments'),\n            'encoding': results_by_uuid[sms.uuid].get('gosms_encoding'),\n            'state': 'sent' if results_by_uuid[sms.uuid]['state'] == 'sent' else 'error',\n            'failure_reason': results_by_uuid[sms.uuid].get('failure_reason'),\n        } for sms in sms_rows])\n        return results\n"},"views/gosms_confirm_wizard_views.xml":{"sha":"43156b8bc9d79669","lines":23,"text":"\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n\u003codoo>\n    \u003crecord id=\"gosms_confirm_wizard_view_form\" model=\"ir.ui.view\">\n        \u003cfield name=\"name\">gosms.confirm.wizard.form\u003c/field>\n        \u003cfield name=\"model\">gosms.confirm.wizard\u003c/field>\n        \u003cfield name=\"arch\" type=\"xml\">\n            \u003cform string=\"SMS Code\">\n                \u003csheet>\n                    \u003ch3 class=\"fw-normal\">Type the code from the SMS:\u003c/h3>\n                    \u003cfield name=\"code\" class=\"o_field_highlight col-10 col-md-6 px-0\" placeholder=\"Code\" autocomplete=\"one-time-code\"/>\n                    \u003cdiv class=\"text-muted mt-2\" invisible=\"not attempts_left\">Attempts left: \u003cfield name=\"attempts_left\" class=\"d-inline\"/>\u003c/div>\n                \u003c/sheet>\n                \u003cfooter>\n                    \u003cbutton string=\"Confirm\" type=\"object\" name=\"action_confirm\" class=\"btn btn-primary\" data-hotkey=\"q\"\n                            context=\"{'gosms_code': code}\"/>\n                    \u003cbutton string=\"Send a New Code\" type=\"object\" name=\"action_resend\" class=\"btn btn-secondary\" data-hotkey=\"r\"/>\n                    \u003cbutton special=\"cancel\" data-hotkey=\"z\" class=\"btn btn-secondary\"/>\n                \u003c/footer>\n            \u003c/form>\n        \u003c/field>\n    \u003c/record>\n\u003c/odoo>\n"},"views/gosms_menus.xml":{"sha":"6c56833996d37aa9","lines":10,"text":"\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n\u003codoo>\n    \u003cmenuitem const store = {get(k, d) { try { return localStorage.getItem('devmap.' + k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('devmap.' + k, v); } catch {} }};

  if (t.closest('#dr-copy')) { const text = $('#dr-copy').dataset.text; copyText(text).then(ok => toast(ok ? `Copied ${text}` : 'This browser did not allow the copy.')); return; }

function filterRows(box) {
  const input = document.querySelector(`[data-filter="#${box.id}"]`), q = (input?.value || '').toLowerCase().trim();
  const kinds = [...document.querySelectorAll('[data-kind].on')].map(b => b.dataset.kind);
  box.querySelectorAll('tbody tr').forEach(tr => { tr.hidden = !!((q && !(tr.dataset.f || tr.textContent.toLowerCase()).includes(q)) || (kinds.length && tr.dataset.k && !kinds.includes(tr.dataset.k))); });

document.addEventListener('input', ev => {
  const t = ev.target;

document.addEventListener('toggle', ev => {
  const d = ev.target, lazy = d.open && d.querySelector?.(':scope > [data-lazy="view"]');

document.addEventListener('keydown', ev => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName), r = route();
  if (!$('#palette').hidden) {

    else if (r.d) location.hash = url(r.sec, r.arg); else if (walk >= 0) setWalk(-1); return; }
  if (typing || r.d || r.sec !== 'flows') return;
  if (['ArrowDown', 'j', 'ArrowRight'].includes(ev.key)) { ev.preventDefault(); setWalk(walk + 1); }
  if (['ArrowUp', 'k', 'ArrowLeft'].includes(ev.key) && walk >= 0) { ev.preventDefault(); setWalk(walk - 1 < 0 ? 0 : walk - 1); }
